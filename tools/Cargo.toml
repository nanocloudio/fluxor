[package]
name              = "fluxor-tools"
version.workspace = true
edition           = "2021"
license           = "MIT OR Apache-2.0"
repository        = "https://github.com/nanocloudio/fluxor"
description       = "Host-side tools for Fluxor firmware configuration"

[[bin]]
name = "fluxor"
path = "src/main.rs"

# Rig backend executables. Discovered by name (`<surface>-<name>`) on
# the rig backend search path; the Makefile's `install` target symlinks
# them into `$XDG_DATA_HOME/fluxor/backends/` after a release build.
# Host-side telemetry collector: decodes fxtl-compact UDP batches
# against the `fluxor id-table` export, serves Prometheus text on
# /metrics, optionally pushes OTLP/JSON.
[[bin]]
name = "fluxor-collect"
path = "src/bin/fluxor_collect.rs"

[[bin]]
name = "telemetry-monitor_udp"
path = "src/bin/telemetry_monitor_udp.rs"

# Generic UDP-datagram capture observer. Binds a configured port and
# streams each received datagram to the matcher as bytes, so a scenario
# can pin regex pass/fail rules against arbitrary `platform.debug.to: net`
# log lines (e.g. the EL0-isolation `[el0]` / `MON_FAULT` records).
# Distinct from `telemetry-monitor_udp` only in capability surface
# (observe vs telemetry); shares the same generic listener.
[[bin]]
name = "observe-udp_capture"
path = "src/bin/observe_udp_capture.rs"

[features]
default = ["host-test"]

# Disarms the `#![cfg_attr(not(feature = "host-test"), no_std)]` /
# `no_mangle` gates in the PIC module cores mounted by the certification
# fixtures under `tests/` (`conn_guard_resume.rs`), so those cores build
# as plain host code with callable `module_new` / `module_step` fns. No
# code under `src/` reads it; PIC builds never see cargo features, so the
# firmware path is untouched. It is on by default because a cargo feature
# cannot be enabled from a test target's own crate root.
host-test = []

# Library target — gives integration tests under `tools/tests/` and
# the auxiliary backend binaries under `src/bin/` access to individual
# tool modules. `src/main.rs` remains the CLI entry point;
# `src/lib.rs` re-exports a curated subset.
[lib]
name = "fluxor_tools"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
# The wire-ABI surface the config compiler bakes values FROM. A compiled
# config carries route handler ids, contract opcodes and content-type bytes
# that a module then switches on, so the compiler and the module must read
# one definition — re-declaring them here is how the two silently diverge.
fluxor-abi = { path = "../crates/fluxor-abi" }
fluxor-contracts = { path = "../contracts" }
libc = "0.2.186"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"  # deprecated upstream but functional
semver = "1.0.28"
sha2 = "0.11.0"
# `proc-macro2` is a transitive dep of syn; pulling it in directly lets
# us enable the `span-locations` feature so `Span::start()` yields
# stable line numbers (otherwise the API is nightly-only).
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
# `full` enables the items/attrs/tokens needed by the hygiene scanner;
# `extra-traits` exposes Debug/Eq for tests asserting on parsed nodes.
syn = { version = "2.0.117", features = ["full", "extra-traits", "parsing", "visit"] }
thiserror = "2.0.18"
toml = "1.1.2"
# Recursive directory walk for the hygiene scanner. The std-only path
# (`fs::read_dir` recursion) reimplements its filter/skip logic; this
# keeps the scanner focused on AST work.
walkdir = "2.5.0"

# The rig load probes are a crate of their own, `tools/rig-observers/`, so the
# async runtime they need stays out of the CLI's dependency closure. Splitting
# the crate is what standards/dependencies.md §10a asks for in place of gating
# a shipped binary behind a feature.
rustls = { version = "0.23.40", default-features = false, features = ["std", "tls12", "ring"] }
# Web-PKI trust anchors for `fluxor store push`/`pull` against public
# registries; a deployment CA (e.g. the nanocloud registry's) is added
# per-invocation with `--ca <pem>`.
webpki-roots = "0.26.11"

[dev-dependencies]
# Used by test-side `#[cfg(test)]` helpers to construct auto-cleaning
# scratch directories instead of leaking `std::env::temp_dir().join(...)`
# paths to `/tmp`. Production tools that manage long-lived state in
# `/tmp` (rig record artefacts, lock files) stay on the raw API
# deliberately — those paths are part of the contract with downstream
# tooling.
tempfile = "3.27.0"

# `tests/param_store.rs` mounts `src/platform/linux/param_store.rs` the
# way the platform does, with `include!`, so it needs the crates that
# source uses. The store logs what it read and what it refused.
log = "0.4.29"

# Inherit the workspace lint configuration. The tools CLI and
# telemetry monitor are user-facing binaries that print to stdout,
# so they relax `clippy::print_stdout` / `clippy::print_stderr` at
# the crate root in `lib.rs` / `main.rs`.
[lints]
workspace = true
