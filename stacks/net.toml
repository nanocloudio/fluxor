[[variant]]
match = { board = "pi5", phy = "ethernet", nic = "rp1-gem" }
# A NIC and the IP stack exchange frames in both directions, which the
# scheduler sees as a cycle. Without this the graph is rejected at
# `prepare_graph` and the board boots with no network — silently, since
# the netconsole that would have reported it is on that network.
accept_cycles = true
modules = [
  { name = "rp1_gem" },
  { name = "conn_guard" },
  { name = "ip", params = { use_dhcp = "user:use_dhcp|1", static_ip = "user:static_ip|0", static_netmask = "user:static_netmask|0", static_gateway = "user:static_gateway|0", trace_sample_permille = "user:trace_sample_permille|host:observability.sample_permille" } },
]
# RX path passes through conn_guard for SYN-flood admission control.
# TX path goes direct from ip back to the NIC (no per-egress filtering).
wiring = [
  "rp1_gem.frames_rx -> conn_guard.frames_rx",
  "conn_guard.frames_tx -> ip.frames_rx",
  "ip.frames_tx -> rp1_gem.frames_tx",
]

[[variant]]
match = { family = "linux" }
# A NIC and the IP stack exchange frames in both directions, which the
# scheduler sees as a cycle. Without this the graph is rejected at
# `prepare_graph` and the board boots with no network — silently, since
# the netconsole that would have reported it is on that network.
accept_cycles = true
modules = [
  { name = "linux_net", params = { max_conns = "user:max_conns|128", write_buf_kib = "user:write_buf_kib|128", listen_backlog = "user:listen_backlog|128" } },
]
wiring = []

# Debug log overlays live in `stacks/debug.toml`. To enable netconsole:
#
#   platform:
#     net: {}
#     debug:
#       to: net
