# Display stack — provides a `display` sink.
#
# Logical name: `display`. Apps wire to it without naming a concrete
# driver; the stack picks the implementation from board / family / driver.
#
# What a graph wires depends on what the sink holds:
#
# - A sink with a framebuffer (the Linux window, the browser canvas) takes
#   rasters: `<producer>.pixels -> display.pixels`. A draw list reaches it
#   through `draw_raster` (`<producer>.draw -> raster.draw`,
#   `raster.pixels -> display.pixels`).
# - The ST7701S panel has no framebuffer: it retains a draw list and draws
#   it again every refresh. `<producer>.draw -> display.draw`. A raster is
#   placed by the draw list's SURFACE records, or shown scaled when no
#   draw list is wired, through `display.surface0`; the graph gives
#   `surface_bytes`, the largest surface it sends.

[stack]
name = "display"

# ── Waveshare LCD4: ST7701S 480×480 RGB panel ────────────────────────────
[[variant]]
match = { board = "waveshare-lcd4" }
modules = [
  { name = "display", type = "st7701s",
    params = {
      refresh_mhz   = "user:refresh_mhz|60000",
      surface_bytes = "user:surface_bytes|0",
    },
  },
]
wiring = []

# ── Linux: hosted built-in (winit + softbuffer window, or file capture) ─
# `mode: window` opens a host window via winit + softbuffer (requires
# `fluxor-linux` built with `--features host-window`; `fluxor build`
# rejects window mode against a binary lacking the feature). `mode: file`
# writes PPM frames to `path`; `mode: null` drains for performance tests.
[[variant]]
match = { family = "linux", sink = "host" }
modules = [
  { name = "display", type = "linux_display",
    params = {
      width  = "user:width|480",
      height = "user:height|480",
      scale  = "user:scale|1",
      mode   = "user:mode|window",
      path   = "user:path|",
    },
  },
]
wiring = []

# ── WASM: browser <canvas> raster sink ──────────────────────────────────
# Lets a wasm graph resolve `display` through the same `platform.display:`
# stack as Linux/hardware. `wasm_browser_canvas` exposes the uniform
# `pixels` port and declares `video.raster` + `display.scanout` +
# `presentation.clock`, so `<producer>.pixels -> display.pixels` resolves.
[[variant]]
match = { family = "wasm" }
modules = [
  { name = "display", type = "wasm_browser_canvas",
    params = {
      width  = "user:width|960",
      height = "user:height|540",
    },
  },
]
wiring = []
