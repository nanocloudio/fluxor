[stack]
name = "debug"

# Opt-in log observability.
#
# The local-transport debug path (UART on pi5, USB CDC on rp) is owned by
# the platform runtime: it drains `kernel::log_ring` into a board-provided
# sink each tick, independent of any modules. No YAML opt-in is required
# for local output.
#
#   pi5:  tio /dev/ttyUSB0         (115200 by default)
#   rp:   cat /dev/ttyACM0
#
# This stack adds the *network* transport as a second consumer of the
# same log ring. `debug: { to: net }` inserts `log_net` and wires it to
# the ip stack so log bytes fan out to UDP alongside the local sink. The
# ring is multi-consumer (independent tails); neither consumer steals
# bytes from the other.
#
# ## Dependencies
#
# `to: net` wires `log_net` to `ip.net_in` / `ip.net_out`, which come
# from another `platform:` stack. Config validation fails with a clear
# "unknown module" error if the ip stack is missing. Pair with
# `platform: net: {}`.
#
# Usage:
#
#   platform:
#     net: {}                        # required for `to: net`
#     debug:
#       to: net
#       # dst_ip: "192.168.10.10"    # optional, destination for log_net (dotted quad, decimal, or 0x-hex)
#       # dst_port: 6666
#       # bind_port: 6667
#
# Host capture:
#   to: net  →  nc -ul 6666           (or `fluxor rig monitor --net :6666`)
#
# The same ring feeds MON_* monitor lines when the monitor overlay is on.

# `dst_ip` must resolve to a unicast collector — the ip module
# rejects broadcast at the send path. Resolution order:
#   1. `platform.debug.dst_ip` in the user YAML (per-config override)
#   2. `[debug] collector_ip` in `~/.config/fluxor/host.toml` (per-dev)
#   3. hard-fail with a pointer at the missing field.
# ── Silicon families: `ip` module produced by `stacks/net.toml` ──
# rp2 / bcm / qemu-virt wire the netconsole alongside their IP stack.
[[variant]]
match = { to = "net", family = "rp2" }
accept_cycles = true
modules = [
  { name = "log_net", params = {
      dst_ip    = "user:dst_ip|host:debug.collector_ip|required",
      dst_port  = "user:dst_port|host:debug.collector_port",
      bind_port = "user:bind_port|host:debug.bind_port",
  } },
]
wiring = [
  "ip.net_out -> log_net.net_in",
  "log_net.net_out -> ip.net_in",
]

[[variant]]
match = { to = "net", family = "bcm" }
accept_cycles = true
modules = [
  { name = "log_net", params = {
      dst_ip    = "user:dst_ip|host:debug.collector_ip|required",
      dst_port  = "user:dst_port|host:debug.collector_port",
      bind_port = "user:bind_port|host:debug.bind_port",
  } },
]
wiring = [
  "ip.net_out -> log_net.net_in",
  "log_net.net_out -> ip.net_in",
]

# ── Linux family: `stacks/net.toml`'s `family = "linux"` variant
# provides `linux_net` (no separate `ip` module). When a silicon
# graph is run via `runtime_override: linux`, the net stack expands
# to linux_net but the debug overlay still expects a NetProto-
# producing module — point it at linux_net by the same shape. The
# wire format on both endpoints is `NetProto`, identical to the
# `ip`-fronted variants above.
[[variant]]
match = { to = "net", family = "linux" }
accept_cycles = true
modules = [
  { name = "log_net", params = {
      dst_ip    = "user:dst_ip|host:debug.collector_ip|required",
      dst_port  = "user:dst_port|host:debug.collector_port",
      bind_port = "user:bind_port|host:debug.bind_port",
  } },
]
wiring = [
  "linux_net.net_out -> log_net.net_in",
  "log_net.net_out -> linux_net.net_in",
]

# ----------------------------------------------------------------------------
# Overlays — additive switches that layer on top of the chosen transport.
# ----------------------------------------------------------------------------

# ── wasm: browser-console sink ──────────────────────────────────────────
#
# `platform.debug: { to: console }` is the wasm-family default. The
# kernel's `log::*` macros are already routed to `host_log` on the
# wasm platform (see `src/platform/wasm.rs::WASM_LOGGER`), which the
# JS shim implements by writing to `console.log` / `.warn` / `.error`
# (level 0..4). So `to: console` is a no-module variant — it just
# declares the intent so the validator knows what the user asked for
# and refuses combinations that wouldn't fire (e.g. `to: console`
# with a non-wasm target would be a mismatch).
[[variant]]
match = { family = "wasm", to = "console" }
modules = []
wiring = []

# ── wasm: DOM scrollback terminal sink ──────────────────────────────────
#
# `platform.debug: { to: terminal }` adds an in-page `<pre>`
# scrollback widget that the kernel's log ring drains into. Same
# multi-consumer log ring as `log_net` on embedded targets, so this
# composes with `to: console` (both can be enabled via successive
# overlay invocations, or by toggling).
#
# The terminal renders inside a `presentation: surface` with
# `role: terminal`. The synthesised wasm runtime shell auto-renders
# the surface based on the graph YAML's presentation block.
[[variant]]
match = { family = "wasm", to = "terminal" }
modules = [
  { name = "log_terminal", type = "wasm_browser_terminal" },
]
wiring = []

# ── Local sink only (no network transport) ──────────────────────────────
#
# The platform runtime already drains the log ring to the board's local sink
# (UART on pi5, USB CDC on rp, stderr on linux) with no module involved, so
# this is a no-module variant. It exists because every `platform.debug:` block
# must select a transport, and a graph that wants only `observe:` or
# `export_telemetry:` — no netconsole — has one to select. Matching on family
# alone scores below the `to:`-qualified variants, so naming a transport still
# wins.
[[variant]]
match = { family = "rp2" }
modules = []
wiring = []

[[variant]]
match = { family = "bcm" }
modules = []
wiring = []

[[variant]]
match = { family = "linux" }
modules = []
wiring = []

# Monitor telemetry: periodic `MON_HIST` lines for the `fluxor rig monitor` CLI
# (per-module step-time histogram). Orthogonal to `to:` — the monitor
# module emits via log::info!, and whatever transports are active carry
# it out. `MON_FAULT` is emitted by the kernel itself, so it streams
# regardless.
#
#   platform:
#     debug:
#       monitor: true
#       # monitor_interval_ms: 5000   # optional; default 5000
[[overlay]]
match = { monitor = "*" }
modules = [
  { name = "monitor", params = {
      interval_ms = "user:monitor_interval_ms",
  } },
]
wiring = []

# Observability collector: the `observe` module subsumes `monitor` and renders
# the whole signal set as `MON_` text. It drains the kernel telemetry ring, so
# no per-source wiring is needed — module `MON_METRIC` / `MON_SPAN` and the
# kernel-pushed `MON_HIST` / `MON_RES` rounds all arrive on the ring. Emits via
# the same `log_ring` path, so whatever `to:` transport is active carries it.
# `observe_interval_ms` sets the kernel's PSTATUS cadence.
#
#   platform:
#     debug:
#       observe: true
#       # observe_interval_ms: 5000   # optional; default 5000
[[overlay]]
match = { observe = "*" }
modules = [
  { name = "observe", params = {
      interval_ms = "user:observe_interval_ms",
  } },
]
wiring = []

# Telemetry export: `platform.debug.export_telemetry: <kind>` selects a
# pluggable export path. Every kind inserts the `otel` export engine + a
# generic `transport_buffer` (the byte-egress stage), differing only in the
# buffer's `transport` capability. `otel` drains the kernel telemetry ring (no
# per-source wiring — emission is ring-based since
# ring-based), batches records as `fxtl-compact`, and
# frames each batch onto its `export` port; `transport_buffer` forwards each
# framed batch over the selected transport. `udp` (transport 0) sends each
# batch as one datagram off the family's net module (needs a unicast `dst_ip`,
# per-config or `~/.config/fluxor`); the host collector — `fluxor-collect`, fed
# by `fluxor id-table <config>` — resolves `(module, id) -> name`, histogram
# bounds, and composite dimensions, serves Prometheus text on :9464/metrics and
# optionally pushes OTLP — the metric/span analogue of `log_net`. Stack
# expansion injects the id-table digest as otel's `table_digest` param, so a
# collector loaded with a table from a different build REFUSES to resolve
# instead of reporting wrong names. `uart` (transport 1) writes to the debug
# serial sink for network-less targets. Matched by exact value so new
# transports add an overlay without colliding.
#
#   platform:
#     debug:
#       export_telemetry: udp
#       # export_dst_ip: "192.168.10.10" # else host.toml debug.collector_ip
#       # export_flush_ms: 1000         # optional; max partial-batch latency
[[overlay]]
match = { export_telemetry = "udp", family = "rp2" }
accept_cycles = true
modules = [
  { name = "otel", params = {
      flush_ms  = "user:export_flush_ms",
  } },
  { name = "transport_buffer", params = {
      dst_ip    = "user:export_dst_ip|host:debug.collector_ip|required",
      dst_port  = "user:export_dst_port|host:debug.telemetry_port",
      bind_port = "user:export_bind_port|host:debug.telemetry_bind_port",
  } },
]
wiring = [
  "otel.export -> transport_buffer.payload",
  "ip.net_out -> transport_buffer.net_in",
  "transport_buffer.net_out -> ip.net_in",
]

[[overlay]]
match = { export_telemetry = "udp", family = "bcm" }
accept_cycles = true
modules = [
  { name = "otel", params = {
      flush_ms  = "user:export_flush_ms",
  } },
  { name = "transport_buffer", params = {
      dst_ip    = "user:export_dst_ip|host:debug.collector_ip|required",
      dst_port  = "user:export_dst_port|host:debug.telemetry_port",
      bind_port = "user:export_bind_port|host:debug.telemetry_bind_port",
  } },
]
wiring = [
  "otel.export -> transport_buffer.payload",
  "ip.net_out -> transport_buffer.net_in",
  "transport_buffer.net_out -> ip.net_in",
]

[[overlay]]
match = { export_telemetry = "udp", family = "linux" }
accept_cycles = true
modules = [
  { name = "otel", params = {
      flush_ms  = "user:export_flush_ms",
  } },
  { name = "transport_buffer", params = {
      dst_ip    = "user:export_dst_ip|host:debug.collector_ip|required",
      dst_port  = "user:export_dst_port|host:debug.telemetry_port",
      bind_port = "user:export_bind_port|host:debug.telemetry_bind_port",
  } },
]
wiring = [
  "otel.export -> transport_buffer.payload",
  "linux_net.net_out -> transport_buffer.net_in",
  "transport_buffer.net_out -> linux_net.net_in",
]

# `export_telemetry: uart` — the network-less export path: `otel` + a generic
# `transport_buffer`. `otel` drains the ring and frames its batch onto `export`;
# `transport_buffer` writes each framed payload to the platform debug serial sink
# (SERIAL_WRITE — binary-safe). No net module is needed. On single-UART boards
# the frames share the console with the log stream; a host capture demuxes them
# by the `FXTL` batch magic. `fxtl-compact` (default) is the intended encoding.
#
# An overlay, like every other export kind: the export path composes with
# whatever `to:` transport the graph selects. A variant would compete with the
# `to = net|console|terminal` pick and tie on specificity.
# `export_telemetry: otlp-http` — on-device OTLP over HTTP POST. Inserts the
# same `otel` engine in `otlp-proto`
# encoding plus the generic exchange chain: `exchange_poster` wraps each
# encoded document in an exchange MSG_PUBLISH (POST /v1/metrics,
# application/x-protobuf) and an `http` client in exchange mode performs it;
# the correlated reply drives `otel.delivery`, so batches are RETAINED and
# retried on transport failure — the reliable-mode contract, composed
# from generic parts. Protobuf (not JSON) is deliberate: an encoded document
# must fit one exchange payload (8 KiB ceiling; a JSON body can exceed it,
# and one document cannot be fragmented).
#
# The client is `require_distinct`: a graph that already carries an `http`
# module of a DIFFERENT variant conflicts (one image, one build of a type)
# and expansion fails with the ways out, never a silent skip. A graph serving
# http can align its server on `variant: exchange` — a superset of the
# default — and both instances then share one build.
#
#   platform:
#     debug:
#       export_telemetry: otlp-http
#       export_otlp_authority: collector.example:4318   # host[:port]; port 4318 when omitted
#       # export_flush_ms: 1000
[[overlay]]
match = { export_telemetry = "otlp-http", family = "bcm" }
accept_cycles = true
modules = [
  { name = "otel", params = {
      flush_ms = "user:export_flush_ms",
      encoding = "1",
  } },
  { name = "otlp_poster", type = "exchange_poster", params = {
      path = "user:export_otlp_path|/v1/metrics",
  } },
  { name = "otlp_client", type = "http", variant = "exchange", require_distinct = true, params = {
      mode           = "1",
      protocol       = "0",
      authority      = "user:export_otlp_authority|host:debug.otlp_authority|required",
      content_type   = "application/x-protobuf",
      surface_status = "1",
  } },
]
wiring = [
  "otel.export -> otlp_poster.payload",
  "otlp_poster.publish_out -> otlp_client.publish_in",
  "otlp_client.reply_out -> otlp_poster.reply_in",
  "otlp_poster.delivery_out -> otel.delivery",
  "otlp_client.net_out -> ip.net_in",
  "ip.net_out -> otlp_client.net_in",
]

[[overlay]]
match = { export_telemetry = "otlp-http", family = "linux" }
accept_cycles = true
modules = [
  { name = "otel", params = {
      flush_ms = "user:export_flush_ms",
      encoding = "1",
  } },
  { name = "otlp_poster", type = "exchange_poster", params = {
      path = "user:export_otlp_path|/v1/metrics",
  } },
  { name = "otlp_client", type = "http", variant = "exchange", require_distinct = true, params = {
      mode           = "1",
      protocol       = "0",
      authority      = "user:export_otlp_authority|host:debug.otlp_authority|required",
      content_type   = "application/x-protobuf",
      surface_status = "1",
  } },
]
wiring = [
  "otel.export -> otlp_poster.payload",
  "otlp_poster.publish_out -> otlp_client.publish_in",
  "otlp_client.reply_out -> otlp_poster.reply_in",
  "otlp_poster.delivery_out -> otel.delivery",
  "otlp_client.net_out -> linux_net.net_in",
  "linux_net.net_out -> otlp_client.net_in",
]

[[overlay]]
match = { export_telemetry = "uart", family = "rp2" }
modules = [
  { name = "otel", params = {
      flush_ms  = "user:export_flush_ms",
  } },
  { name = "transport_buffer", params = { transport = "1" } },
]
wiring = [
  "otel.export -> transport_buffer.payload",
]

[[overlay]]
match = { export_telemetry = "uart", family = "bcm" }
modules = [
  { name = "otel", params = {
      flush_ms  = "user:export_flush_ms",
  } },
  { name = "transport_buffer", params = { transport = "1" } },
]
wiring = [
  "otel.export -> transport_buffer.payload",
]
