# Owner live-status surface (docs/architecture/owner_status.md) — two
# co-resident owners in ONE node runtime, with a fault in owner A's module
# only. `pod` below is the orchestrator-facing name for an owner; the runtime
# and the status file speak owners throughout.
#
# The graph is three standalone `test_fault` modules; ownership comes from the
# node agent's committed plan (FLUXOR_PLAN), NOT from this file:
#   module 0 `a_fault` — pod A (1 module):  errors once at step 50 → with
#                        `fault_policy: skip` the module terminates and the
#                        runtime reports pod A `phase: Terminated`,
#                        `terminated.reason: GraphNodeFault`, exit_code 2.
#   modules 1-2 `b_*`  — pod B (2 modules): run forever → pod B stays
#                        `phase: Running`, `ready: true`.
#
# Run (from the repo root):
#   make build
#   D=/tmp/fluxor-owner-status && rm -rf $D && mkdir -p $D
#   F=target/aarch64-unknown-linux-gnu/release/fluxor
#   $F generate examples/owner_status/linux_two_pods.yaml -o $D/config.bin
#   $F mktable-config --config examples/owner_status/linux_two_pods.yaml \
#       --modules-dir target/fluxor/bcm2712/modules -o $D/modules.bin
#   $F agent commit --store $D/store --publish $D/current.plan \
#       --pod-uid aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --name pod-a --modules 1
#   $F agent commit --store $D/store --publish $D/current.plan \
#       --pod-uid bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb --name pod-b --modules 2
#   FLUXOR_PLAN=$D/current.plan target/aarch64-unknown-linux-gnu/release/fluxor-linux \
#       --config $D/config.bin --modules $D/modules.bin &
#   sleep 2
#   $F agent status --store $D/store --json     # pods[].runtime per §7.2
#
# Aggregate-restart check: `touch $D/current.plan` → the runtime re-stages the
# plan and rebuilds the graph; pod A re-activates with `restart_count: 1`
# (then faults again). An INTERNAL module retry is not a restart — switch
# `a_fault` to `fault_policy: restart` + `max_restarts: 5` and pod A stays
# `phase: Running` with `restart_count: 0` through the retry.
target: linux
tick_us: 1000

execution:
  domains:
    - name: main
      cores: [0]

modules:
  - name: a_fault
    type: test_fault
    domain: main
    params:
      mode: 1          # return error once at delay_steps
      delay_steps: 50
    fault_policy: skip # terminal: the aggregate owner is done for

  - name: b_worker1
    type: test_fault
    domain: main
    params:
      mode: 3          # normal — never faults

  - name: b_worker2
    type: test_fault
    domain: main
    params:
      mode: 3

wiring: []
