version = "1.0.0"
# Logic is platform-agnostic (timer + preset lookup with a millis
# fallback for the frame-accurate path). Available on hosts and
# bare-metal targets that load PIC modules.
hardware_targets = ["rp2350", "bcm2712", "linux", "rp2040"]

[[ports]]
name = "control"
direction = "input"
content_type = "FmpMessage"

[[ports]]
name = "notes"
direction = "output"
content_type = "OctetStream"
required = true
# One 8-byte note event per write; 32 queued events hold four steps at the
# most one step emits (an 8-way ratchet), without the 8 KiB default an
# unsized port takes.
max_record = 8
buffer_size = 256

[commands]
accepts = ["status", "toggle", "select", "next", "prev"]

# Module-scope observability — exempt (see standards/observability.md §6).
[observability]
exempt = "note-event source — event rate, set by the step clock, is the domain metric, not byte throughput"
