version = "2.1.0"
# timer_class: query timeout reads wall-clock (dev_millis).
timer_class = "wall_clock"
hardware_targets = ["rp2350", "bcm2712"]

[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"

[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"

# The stream leg, for `upstream_tls = 1` (DNS over TLS, RFC 7858). A graph
# wires these through a client-mode `tls` to the network; unwired they cost
# nothing, and `upstream_tls` refuses to construct without them. Separate
# from the datagram pair above because they are a different surface: this
# one is connected and ordered, and the server side of this module keeps
# answering UDP/53 while it is in use. What the leg is worth depends on the
# instance at its far end: the module dials, and the `tls` instance's
# `peer_auth` / `trust` decide whether the peer is authenticated as well as
# encrypted to.
[[ports]]
name = "tls_in"
direction = "input"
content_type = "NetProto"

[[ports]]
name = "tls_out"
direction = "output"
content_type = "NetProto"

# Module-scope observability. Optional 2nd output (out[1]); wired to
# `observe.telemetry` when the debug stack's observe overlay is on. Emits
# cumulative byte counters; no-op when unwired. See standards/observability.md.
[observability]
metrics = ["bytes_in", "bytes_out", "upstream_drops", "forward_refusals"]
# Span 0: one `dns.query` span per locally-resolved query (parse -> reply),
# SERVER kind, rooting its own trace (DNS-over-UDP carries no inbound context).
# Minted only when the telemetry port is wired and the query is head-sampled
# (zero-cost otherwise). Forwarded/upstream queries are not spanned (their
# latency is the upstream resolver's).
spans = ["dns.query"]

[[resources]]
requires_contract = "channel"
access = "read"

# Durable dynamic update (`update_durability = "durable"`) commits each zone
# generation through the fs contract: temp → write → fsync → rename. The
# grant is unconditional because a resource claim cannot be conditioned on
# a parameter; the module refuses durable updates until the provider
# answers `CAPS` with the write tier, and volatile mode never calls it.
[[resources]]
requires_contract = "fs"
access = "write"

# TSIG validity (RFC 8945 §5.2.3) is a calendar-time decision: a signed
# UPDATE is accepted only inside its fudge window against the kernel's
# trusted clock, and fails closed without one. Any update zone needs it —
# `update_durability` is the parameter that is set exactly when
# `update_zone` is.
[[requires_when]]
capability = "time.wall"
when       = { update_durability = ["volatile", "durable"] }
