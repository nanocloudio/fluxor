version = "1.0.0"
hardware_targets = ["rp2350", "bcm2712", "linux", "wasm"]
# Redial backoff and the session-setup deadline are wall-clock; everything
# else is per-frame.
timer_class = "wall_clock"

# Remote-channel multiplexer: up to eight local channels carried record for
# record across authenticated transport sessions — a dialler's one, or up to
# `sessions` a listener serves, one per verified peer — and optionally one
# exchange endpoint. Wire protocol in `wire.rs`; behaviour in `mod.rs`; the
# exchange endpoint in README.md.
#
# ─── Parameters (TLV) ──────────────────────────────────────────────────
# | Tag | Name         | Type | Default | Description |
# |-----|--------------|------|---------|-------------|
# | 1   | transport    | u8   | net     | `net`: `net_proto` on `transport_in`/`transport_out`, toward the clear side of `tls` (or a network provider, with `require_peer: 0`). `mux`: the mux contract, toward `quic`'s `app_out`/`app_in`; one stream per channel. |
# | 2   | role         | u8   | listen  | `net` only: `listen` binds `port` and serves up to `sessions` sessions, one per peer; `dial` connects to `authority`, holds one session and redials after a close. On `mux` the transport's own client/server mode decides, and the side that dialled opens the streams. |
# | 3   | port         | u16  | 9100    | `listen`: the port bound. |
# | 4   | authority    | str  | —       | `dial`: `host[:port]` (port 9100 when omitted) — a name the network provider resolves, or a literal. |
# | 5   | channels     | str  | —       | The channel table (may be empty with `exchange` set), `content_type:framing:max_record;…`, channel index = position, at most 8. `framing` is how records are delimited on the channel's local ports: a length framing `len16@<off>+<add>` / `len32@<off>+<add>` (a little-endian 16- or 32-bit length field at byte `off` of the record's own header, the whole record being the field's value plus `add`; the header, `off` plus the field, within 64 bytes), `tlv16` (`len16@1+3`: `[type:1][len:2 LE][payload]`), `len32` (`len32@0+4`: `[len:4 LE][payload]`), `mailbox` (the edge has a `buffer_group`; one buffer is one record, and an empty buffer is skipped), or `bytes` (a stream with no records, carried in order; `max_record` bounds one piece). On a FIFO edge a length framing delimits records however the producer's writes split or join them; use `mailbox` only on an edge whose every buffer is one record. `max_record` counts the whole local record, header included (not the `peer_tag` prefix), up to `MAX_RECORD`, at least its header and `add`, and for a 16-bit field at most `add + 65535`. Both ends must state the same content types and maxima or the session is refused. |
# | 6   | require_peer | u8   | 1       | 1: a session is used only once the transport's peer identity binds (tls `peer_identity` wired to `peer_identity`, a record naming the session by connection id and generation; quic's in-band record), and it belongs to the peer that identity's key fingerprint names. A `net` transport that numbers no sessions cannot bind one. 0: the transport is trusted as wired, and its sessions are anonymous. |
# | 7   | redial_ms    | u32  | 1000    | `dial`: wait after a close or a failed dial. |
# | 8   | exchange     | u8   | none    | `near`: stand in for a provider on the peer — a requester wires `request_out -> request_in` and `response_out -> response_in` as it would to the provider (one session). `far`: stand in for the peers' requesters — wire `request_out` and `response_in` to the real provider; every exchange reaches it under an id of the far side's own, its request HEAD's `peer` written as the session's verified fingerprint (empty without `require_peer`). `none`: no exchange endpoint. One side's pair must be wired and the other's must not. The endpoint appends two channels (`ExchangeRequest`, `ExchangeResponse`, `mailbox`, 8192) after `channels`, which may then hold at most six. The peer must state the same `channels` and the other side. |
# | 9   | resume       | u8   | 0       | 1: every record is numbered and kept until the peer acknowledges it, and a session resumes where the last left off — each record delivered once and in order across reconnects, and a record the peer already has refused as a replay (`wire.rs`, Resume). `net` or `mux`, not beside `exchange`. |
# | 10  | window       | u32  | 0       | `resume`: retained bytes per channel — records taken off the input and not yet acknowledged, each with its four-byte length. At least one record at the channel's maximum; 0 is four. A full window stops reading the channel's input, so backpressure reaches the producer. |
# | 11  | keepalive_ms | u32  | 1000    | `resume`: an open session that has sent nothing for this long sends an acknowledgement, and one that has heard nothing for three of these is ended (and resumed by the next). A link that died without a close on this end — the reset reached only the other one, or nothing came back at all — is noticed instead of holding its session for ever. 0: never. |
# | 12  | sessions     | u8   | 1       | `net` `listen`: sessions served at once, 1..=`SESSIONS_MAX` (8 on host-class targets, 4 on MCUs), one per peer. A session's peer is its verified key fingerprint (`peer_identity::fingerprint`); a new session from a peer that already has one replaces it. With more than one: under `require_peer` a session whose identity names no fingerprint is closed, and without it sessions are anonymous (never replaced; `resume` then refused); a `bytes` channel and a `near` endpoint are refused. Each session takes its own reassembly ring per channel (and retained window under `resume`) in `REASSEMBLY_BYTES`. |
# | 13  | peer_tag     | u8   | 0       | 0: sessions are interchangeable locally — records arriving on any session are merged, record by record, onto the channel's output, and a record written to a channel goes to every open session (under `resume`, to every peer whose streams are held, taken once each has room). 1: every local record on every channel carries a 32-byte fingerprint prefix ahead of its own bytes: an inbound record the fingerprint of the peer it came from, an outbound one the peer it goes to — all zero for every session, a peer with no session dropped and counted (`unrouted`). Needs `require_peer`; no `bytes` channel. |
#
# Each channel's reassembly ring takes `max_record + 4` bytes per session, and
# a `mailbox` channel a further `2 * max_record` for its send and delivery
# stages; with more than one session every channel stages the record it sends
# (`max_record`), and with `peer_tag` each stage has room for the prefix. The
# sum over channels must fit `REASSEMBLY_BYTES`; an instance that does not is
# refused at construction rather than shrunk. On `mux` the channel count is
# also bounded by the streams `quic` lets one connection open (three at a
# time), and a session that cannot open a stream per channel is closed.
#
# With `resume`, each channel's retained window, per session, is carved from
# the same `REASSEMBLY_BYTES` beside its ring. An instance draws an incarnation
# (16 random bytes) at construction; a peer naming another one than it held
# has restarted and lost its streams, so its streams start afresh and the
# records retained for it go again from number 1 — exactly once across
# reconnects, at least once across a peer's restart.
#
# A session that has not bound its peer and exchanged tables ten seconds
# after the transport session came up is closed. A listener holds one
# transport session more than it serves, so a peer's newer session can be
# authenticated while its older one still holds its place; a connection that
# arrives with every one held, or whose peer finds every session in use, is
# closed.
#
# `session` (optional output) carries a frame each time the instance goes from
# no session open to one (or another opens), and from some to none, so a
# consumer can refuse work toward a member that is down at once instead of
# waiting out its own deadline.
#
# An exchange endpoint's channels take only the half of a mailbox channel's
# region they use: the side that sends a direction a send stage of 8192, the
# side that receives it a ring and a delivery stage, 16388 — 24580 bytes a
# side, which fits the embedded `REASSEMBLY_BYTES` beside a small table; a far
# side serving several sessions takes a request ring (8196) per session. One
# endpoint per instance; a requester's id space crosses to the far side, which
# maps it per session, so one requester per near side and any number of near
# sides per far one. Session loss is the exchange contract's LINK: see
# README.md.

[[ports]]
name = "transport_in"
direction = "input"
content_type = "OctetStream"
required = true
buffer_size = { default = 4096, aarch64 = 16384 }

# tls `peer_identity` (`net` with `require_peer`).
[[ports]]
name = "peer_identity"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "ch0"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "ch1"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "ch2"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "ch3"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "ch4"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "ch5"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "ch6"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "ch7"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "transport_out"
direction = "output"
content_type = "OctetStream"
required = true
buffer_size = { default = 8192, aarch64 = 16384 }

[[ports]]
name = "ch0_rx"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "ch1_rx"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "ch2_rx"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "ch3_rx"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "ch4_rx"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "ch5_rx"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "ch6_rx"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "ch7_rx"
direction = "output"
content_type = "OctetStream"

# Session opened / ended: `contracts/mesh/remote_session.rs` frames. Down
# until the first `MSG_SESSION_UP`.
[[ports]]
name = "session"
direction = "output"
content_type = "OctetStream"

# ── Exchange endpoint (`exchange`) ─────────────────────────────────────────
# Inputs 10–11 and outputs 10–11, after the channels and `session`.

# `near`: the requester's requests.
[[ports]]
name = "request_in"
direction = "input"
content_type = "ExchangeRequest"
max_record = 8192
buffer_size = 8192

# `far`: the provider's answers.
[[ports]]
name = "response_in"
direction = "input"
content_type = "ExchangeResponse"
max_record = 8192
buffer_size = 8192

# `near`: the answers, and the LINK state, to the requester.
[[ports]]
name = "response_out"
direction = "output"
content_type = "ExchangeResponse"
max_record = 8192
buffer_size = 8192

# `far`: the requests, and the ABORTs of a lost session, to the provider.
[[ports]]
name = "request_out"
direction = "output"
content_type = "ExchangeRequest"
max_record = 8192
buffer_size = 8192

[[resources]]
requires_contract = "channel"
access = "read"

# Module-scope observability is exempt.
[observability]
exempt = "channel fabric — byte throughput is observed at the transport it rides (tls / quic / the network provider)"
