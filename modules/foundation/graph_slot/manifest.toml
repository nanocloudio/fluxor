version = "1.0.0"
hardware_targets = ["rp2350", "rp2040"]

permissions = ["flash_raw"]

# Channel-served: FMP-framed requests in, `gs.result` answers out
# (`contracts/storage/graph_slot.rs`). Its consumers are `ota_ingest` and
# `reconfigure`.
[[ports]]
name = "requests"
direction = "input"
content_type = "FmpMessage"
required = true

[[ports]]
name = "results"
direction = "output"
content_type = "FmpMessage"

# Module-scope observability — exempt (see standards/observability.md §6).
[observability]
exempt = "request/answer slot service — every request is answered with a `gs.result` record naming its outcome, and the image bytes it writes are observed by ota_ingest's progress records"
