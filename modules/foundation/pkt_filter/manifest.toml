version = "1.0.0"
hardware_targets = ["rp2350", "bcm2712"]

# Stateless packet filter. Reads parsed metadata from `eth_parser`,
# evaluates match rules from config params, and forwards or drops.

# Optional: enforce a net.policy table (`table` param) instead of the static
# rules — the bare-metal enforcer of the contract. The module READs the table,
# re-reads when its generation moves, and ATTACHes so the provider's CAPS can
# truthfully report ENFORCED. Without a `table` param it never calls the
# contract, and the declaration is inert.
[[resources]]
requires_contract = "net_policy"
access = "read"
