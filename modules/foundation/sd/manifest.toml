version = "1.0.0"
hardware_targets = ["rp2350"]

# Provided storage surface (storage_capability_surface.md §1): a read-only
# `storage.block` source (CAPS and one-block SUBMIT/REAP reads) beside the
# sector stream on `blocks`. Tools-only, never serialized to the .fmod.
provides = ["storage.block"]

[[ports]]
name = "blocks"
direction = "output"
content_type = "OctetStream"
required = true

# Module-scope observability (out[1], optional); wired to observe.telemetry.
[[resources]]
requires_contract = "spi"
access = "exclusive"

[[resources]]
requires_contract = "gpio"
access = "write"

[[resources]]
requires_contract = "timer"
access = "write"

[observability]
metrics = ["blocks_read"]
