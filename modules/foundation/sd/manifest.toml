version = "1.0.0"
hardware_targets = ["rp2350"]

# Provided storage surface (storage_capability_surface.md §1): raw
# 512-byte block I/O. Free-form provider capability string; tools-only,
# never serialized to the .fmod.
provides = ["storage.block"]

[[ports]]
name = "blocks"
direction = "output"
content_type = "OctetStream"
required = true

# Module-scope observability (out[1], optional); wired to observe.telemetry.
[[resources]]
requires_contract = "spi"
access = "exclusive"

[[resources]]
requires_contract = "gpio"
access = "write"

[[resources]]
requires_contract = "timer"
access = "write"

[observability]
metrics = ["blocks_read"]
