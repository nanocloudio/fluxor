[package]
name = "fluxor-mod-conn-guard"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Stateless TCP-SYN connection-rate fuse module — host-test build"

# This file lets the bare-metal `conn_guard` module crate also build as a
# host rlib so its unit tests can run. The PIC firmware build invokes
# `rustc` directly against `mod.rs` (see `Makefile :: modules`) and does
# NOT consult this file, so the cargo build path is purely additive.

[lib]
path = "mod.rs"
crate-type = ["rlib"]

[features]
# `host-test` switches the module away from `#![no_std]` and enables the
# owner-partitioning unit tests. PIC builds never set this feature.
default = []
host-test = []

# Standalone (workspace `exclude`d, like dns/quic/mqtt): not part of the
# workspace lint matrix. It only needs to compile under `host-test` so its
# unit tests run. Dual-build module: PIC firmware ignores this file; the
# firmware artefact is byte-identical with or without this manifest.
