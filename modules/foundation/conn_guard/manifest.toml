version = "1.0.0"
hardware_targets = ["bcm2712", "rp2350", "uefi"]
# Cadence-independent SYN/connection filter pass-through; no tick-based timing.
# Explicit attestation to run on a mechanism-(b) domain: an absent
# declaration is treated as unattested and is blocked there.
timer_class = "agnostic"

# Eligible for `fault_policy: restart`, which releases provider handles,
# flushes every channel, and resumes the same state without re-running
# module_new. This module qualifies: one step handles exactly one frame from
# length prefix to forward, it opens no provider handle, it sits on an
# unreliable L2 path where dropping a frame is what the medium below already
# does, and the fuse table is a rate limiter whose worst case after a partial
# update is one admission of drift inside one `rate_window_ms`. A fault between
# the prefix read and the body read cannot desynchronise the stream because the
# restart path flushes the channel before the module runs again.
resume_after_fault = true

[[ports]]
name = "frames_rx"
direction = "input"
content_type = "EthernetFrame"
required = true
buffer_size = { default = 2048, aarch64 = 8192 }

[[ports]]
name = "frames_tx"
direction = "output"
content_type = "EthernetFrame"
required = true
buffer_size = { default = 2048, aarch64 = 8192 }
max_record = 1514

# Module-scope observability — exempt.
[observability]
exempt = "L2 pass-through filter/fan-out — frame bytes are observed at the ip module; its domain metric is pass/drop counts"
