version = "2.0.0"
hardware_targets = ["rp2350", "bcm2712"]
# Filesystem state machines are readiness-driven; diagnostic/native telemetry
# cadence uses dev_millis and contains no scheduler-step deadline.
timer_class = "wall_clock"

# Provided storage surface (storage_capability_surface.md §1): `file.data`
# byte-stream file access. Directory listing is served through the FS
# contract's OPENDIR/READDIR, not the `storage.namespace` (0x13) contract,
# which this module does not implement — so only `file.data` is declared.
# Free-form provider capability string; tools-only, never serialized.
provides = ["file.data"]

# FAT32 filesystem provider. Every operation goes through the FS
# contract (`provider_call(-1, FS_OPEN, …)`); the kernel routes the
# dispatch here via `module_provides_contract = FS`. Reads and writes
# both use the block source's synchronous ioctls on the `blocks` port,
# so the module owns no outbound block channel of its own.

[[ports]]
name = "blocks"
direction = "input"
content_type = "OctetStream"
required = true

# Module-scope observability (out[1], optional); wired to observe.telemetry.
[observability]
metrics = ["file_count"]
