version = "1.0.0"
hardware_targets = ["bcm2712", "rp2350", "rp2040"]
permissions = ["platform_raw"]
# Cadence-independent telemetry forwarder (drains the log ring → UDP); its emit
# cadence is cosmetic, not correctness-bearing. Explicit attestation to run on a
# mechanism-(b) domain: an absent declaration is treated as unattested and is
# blocked there.
timer_class = "agnostic"

[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"
required = true
buffer_size = { default = 2048, bcm2712 = 8192 }

[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"
required = true
buffer_size = { default = 2048, bcm2712 = 8192 }
max_record = 2048

# Module-scope observability — exempt (see standards/observability.md §6).
[observability]
exempt = "telemetry/log exporter or collector — forwards records, originates none (cf. transport_buffer / otel)"
