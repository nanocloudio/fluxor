version = "1.0.0"
hardware_targets = ["bcm2712"]
permissions = ["platform_raw"]

[[ports]]
name = "devices"
direction = "output"
content_type = "OctetStream"

# Module-scope observability — exempt.
[observability]
exempt = "diagnostic/one-shot probe — not a steady-state production data path"

# Device registers, DMA memory and cache maintenance.
[[resources]]
requires_contract = "metal_device"
access = "write"
