[package]
name = "fluxor-mod-transport_buffer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Transport-agnostic byte-egress buffer (udp/uart) — host-test build"

# This file lets the bare-metal `transport_buffer` module crate also build as a
# host rlib so the test harness can link it as a normal Rust library.
# The PIC firmware build invokes `rustc` directly against `mod.rs`
# (see `Makefile :: modules` / `fluxor modules build`) and does NOT
# consult this file, so the cargo build path is purely additive.

[lib]
path = "mod.rs"
crate-type = ["rlib"]

[features]
default = []
host-test = []
