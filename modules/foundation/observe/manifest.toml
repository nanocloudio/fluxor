version = "1.0.0"
hardware_targets = ["bcm2712", "rp2350", "rp2040"]
# Read-only telemetry-ring drain (TLM_SUBSCRIBE / TLM_DRAIN / TLM_STATS). The
# collector reads records and renders text; it raises no faults and mutates no
# graph state, so it holds `observe` and nothing wider.
permissions = ["observe"]
# Ring draining is event/data driven and independent of scheduler step counts;
# the PSTATUS cadence the collector declares is wall-clock on the kernel side.
timer_class = "wall_clock"

# No ports: every signal arrives on the kernel telemetry ring (metrics and
# spans from modules, PSTATUS step-histogram/arena rounds from the kernel).

# Module-scope observability — exempt (see standards/observability.md §6).
[observability]
exempt = "telemetry/log exporter or collector — forwards records, originates none (cf. transport_buffer / otel)"
