version = "1.0.0"
# timer_class: handshake/session timers read wall-clock (dev_millis).
timer_class = "wall_clock"
# The implementation is target-neutral PIC, so the target list is a statement
# about what has been built and run, not about what the code can express.
# `linux` is here because a Linux graph that terminates TLS is a first-class
# deployment, and a consumer cannot wire a module its target list excludes.
hardware_targets = ["rp2350", "bcm2712", "linux", "uefi"]

# Ingress anchor role: tls terminates the client-visible secure stream in
# front of the consumer it serves, so it owns the attachment a client sees
# — the record keys, the record counters, and the ciphertext the peer has
# been shown. That is what `transport.anchor.stream.secure` names, and it
# is the state the `cont_in` / `cont_out` surface below checkpoints and
# mirrors. Whether a graph reaches stream continuity is decided by the
# validator from the whole path — the ip module must own TCP on the target
# (`fence.enforceable` is ip's fact, not this module's) — so nothing more
# is claimed here.
capabilities = ["transport.anchor.stream.secure"]

# The terms the anchor is carried on.
#
# TLS 1.3 protects every record under an implicit counter: the sequence
# never appears on the wire, both peers count in lockstep, and a taken-over
# sender that skipped forward would fail the peer's decrypt. A counter
# reservation cannot rescue that — it makes a skip safe, not a resume.
#
# What carries the anchor anyway is the horizon `continuity.rs` keeps for a
# mirroring pair under PROFILE_CRASH_CONTINUOUS: an outbound record is held
# rather than written, and an inbound record is held rather than decrypted
# and delivered, until the standby has acknowledged that exact transition,
# with a write-side key update a barrier on the same footing. The standby
# therefore holds the counter the peer is actually at, and a takeover
# retransmits identical ciphertext. A standby that stops answering, or a
# mirror channel that fails, ends the pair instead of stalling the
# connection: the coordinator is told, the shadow is dropped, and what was
# held is written unmirrored.
[capability_facts."transport.anchor.stream.secure"]
aead    = "implicit_counter"
horizon = "exact"

# An instance that validates a peer's chain (a CA profile) checks the
# leaf's lifetime against the kernel's trusted clock (`timer::TRUSTED_UNIX`),
# and under `clock_policy = require` — the default — a clock the platform
# does not vouch for fails the handshake closed. A target with no such
# clock therefore cannot run that posture; the honest configuration there
# is `clock_policy = unchecked`, and the wrong one is refused at compose
# rather than at the first handshake. A plain server, or a pinned peer,
# checks no lifetime and needs no clock.
[[requires_when]]
capability = "time.wall"
when       = { peer_auth = ["ca_dns", "ca_uri"], clock_policy = "require" }

# `trust = "system"` asks the platform to verify rather than verifying here,
# so it needs a platform that answers: the `trust` contract (class 0x1D),
# which only the Linux host registers. On bare metal and wasm there is no
# public root set and nothing to ask, and a graph naming it is refused at
# compose rather than at the first handshake. This gate works precisely
# because `trust` is a declared schema parameter and not an opaque blob.
[[requires_when]]
capability = "trust.system"
when       = { trust = "system" }

# The `trust` contract (class 0x1D) is what `trust = "system"` asks. Declared
# unconditionally because a manifest resource is a GRANT — permission to call
# the class — and not a claim that a provider exists; the `[[requires_when]]`
# above is what refuses a target where none does. A graph that never names
# `trust = "system"` never makes the call, and the grant costs it nothing.
[[resources]]
requires_contract = "trust"
# Read: a verdict is asked for and returned. Nothing is stored, and no
# anchor material crosses in either direction.
access = "read"

# Credentials named by path. `cert_file`, `key_file` and `trust` given as an
# absolute path are read by the instance at runtime through the `fs`
# contract (cred_file.rs), PEM or DER, so an image carries no credential and
# no deployment's trust: on the Linux host a node graph reads the host's
# paths, and a workload reads beneath its owner root and the volumes lent to
# it — a lent credential volume. Until every named file is read the instance is not
# ready: a server refuses handshakes before presenting anything and a client
# answers a dial `EAGAIN`. An unreadable file is retried every second, a
# malformed one is refused (logged once per content) and taken once fixed.
# On aarch64 targets the files are re-read every 10 s and a changed set —
# read the same twice running, validated whole — is installed between
# handshakes, so rotated credentials take effect without a restart; a broken
# rotation keeps the credentials in use. Elsewhere they are read once.
# A grant, like `trust` below: a graph naming no path never calls it.
[[resources]]
requires_contract = "fs"
access = "read"
active_when_params = ["cert_file", "key_file", "trust"]

# The build-time form, `${file:<path>}`, is for targets with no file surface
# at runtime: the builder reads the file and embeds the chain, the key and
# the anchors as extended tags 10, 11 and 12. A Linux image refuses it. A
# credential has one source; a path beside an embedded blob for the same
# credential refuses to construct.
#
# Trust anchors are the `trust` parameter (see `define_params!` in mod.rs):
# one certificate or a bundle of up to MAX_ANCHORS (concatenated DER, or
# PEM), or `system`. A bundle is how an authority rotation is expressed —
# the outgoing and incoming authorities side by side — and a chain signed by
# either verifies. `fluxor run --ca` / `fluxor exec --ca` append an operator's
# anchors under tag 16 to CLIENT-MODE instances only; a `verify_peer`
# server is never widened. Both feed one table through one walk, and the
# accepted-chain log line reports the count and the origin. `trust` is a
# declared schema parameter rather than an opaque blob, so a
# `[[requires_when]]` clause can gate on it. A refusal's reason comes from
# the anchor the chain MATCHES (its subject is the top-most sent
# certificate's issuer); an anchor the chain never reaches is skipped
# unjudged, and with no match the reason is `unknown-ca`.
#
# Known classification edge, deliberately left: a P-256 key signed with
# ecdsa-with-SHA384 is legal (RFC 5480) but x509.rs maps that OID to the
# ECDSA_P384_SHA384 suite, which a P-256 key cannot sign, so such a chain
# fails as `signature`. No public issuer does this.

# Application protocol (ALPN, RFC 7301): the `alpn` graph parameter — one
# name or a list (`alpn: "h2"`, `alpn: ["h2", "http/1.1"]`), each 1..=16
# printable bytes, 64 in all — packed comma-separated as schema param 26
# (so `alpn: {env: NAME}` binds it too, the module holding a bound value to
# the same rule and refusing to construct otherwise). A client offers
# the names in that order; a server selects the first of ITS names the
# client offered, and with none in common selects nothing and proceeds. A
# client refuses a server selection it did not offer. Unset, both sides use
# `h2,http/1.1` (`http/1.1` under `alpn_h1_only`). The negotiated name is
# reported with the connection on `clear_out`: after the session generation
# in `MSG_CONNECTED` / the port-qualified `MSG_ACCEPTED` comes
# `[alpn_len:1][alpn]` (`net_proto::session_alpn`; length 0 for none), so
# an HTTP client knows before its first byte whether to speak HTTP/2.
#
# Dial completions on `clear_out`: a `CMD_CONNECT_TO` is answered by the
# held `MSG_CONNECTED` once the handshake completes, or by a tagged
# `MSG_ERROR` on the requester's tag — `ECONNREFUSED` when the handshake
# fails or the transport loses the connection before it completes, and
# `EAGAIN` (nothing dialled) while a client's `identity_label` holds no
# certificate yet. Never a `MSG_CLOSED` for a connection the requester was
# not told of.

[[ports]]
name = "cipher_in"
direction = "input"
content_type = "NetProto"

[[ports]]
name = "clear_in"
direction = "input"
content_type = "NetProto"

[[ports]]
name = "cipher_out"
direction = "output"
content_type = "NetProto"

[[ports]]
name = "clear_out"
direction = "output"
content_type = "NetProto"

# Per-session peer-identity record emitted after handshake completion,
# for every session — including one whose peer presented no credential,
# because silence is indistinguishable from an event still in flight.
# Wire format documented in modules/foundation/tls/mod.rs
# (`MSG_PEER_IDENTITY` const block):
#   [msg_type:1=0x5A][payload_len:2 LE]
#   [session_id:4][result:1][credential_kind:1][profile_id:2]
#   [not_before:8][not_after:8][flags:4]
#   [fp_alg:1][fp_len:1][principal_len:2][fingerprint][principal]
# `flags` says which checks actually RAN, so a consumer knows what the
# result is worth; the principal is absent unless the chain and the SAN
# were both verified. The TLS module retries on back-pressure so
# delivery is at-least-once.
[[ports]]
name = "peer_identity"
direction = "output"
content_type = "OctetStream"

# Transport-continuity control (in[2] / out[3]), the per-layer continuity
# surface of contracts/net/session_ctrl.rs (§Transport continuity) for
# transport CT_TLS. Driven by a coordinator, or by `transport_continuity`:
# PAIR_PREPARE / CHECKPOINT_* / DELTA_* / QUIESCE_* / CUT_* / EMISSION_ARM /
# ACTIVATE / RETIRE / ABORT arrive on `cont_in`, and CUSTODY (the vault-to-vault transfer of a flow's sealing
# key); checkpoint chunks, deltas, DELTA_ACKs and CONTINUITY replies
# leave on `cont_out`. Unwired means the surface does not exist at runtime
# and the record path is byte-identical. The codec, the shadow lifecycle,
# the vault sealing of the traffic secrets (each flow's key derived from
# `tls-continuity-master`, or unwrapped from a custody transfer attested by
# `tls-custody`) and the strict-profile send / receive horizons are
# documented at the top of
# modules/foundation/tls/continuity.rs; ACTIVATE takes an optional trailing
# `[conn_id:2 LE]` naming the connection the imported session binds to.
#
# `cont_out` must take one whole checkpoint in a single step: the record
# this module exports carries no deliveries, so it is at most about 21 KiB
# where the receive buffer is 16 KiB and about 8.5 KiB on the 4 KiB-buffer
# targets, in 1 KiB chunks plus the CUT manifest (TLS_CKPT_RECORD_MAX, the
# most an import admits, also counts the deliveries a record composed from
# a whole-connection mirror carries). A chunk that does not fit fails the
# export as STATUS_NO_CAPACITY rather than leaving a partial transfer.
[[ports]]
name = "cont_in"
direction = "input"
index = 2
content_type = "OctetStream"
buffer_size = { default = 32768, thumbv8m = 16384, aarch64 = 65536 }

[[ports]]
name = "cont_out"
direction = "output"
index = 3
content_type = "OctetStream"
buffer_size = { default = 65536, thumbv8m = 16384, aarch64 = 65536 }

# The identity named by `identity_label` (identity.rs): the key is born in
# the vault, and its certificate is asked for and delivered at runtime.
# `identity_req` carries `[0x5B][len:2 LE = 65][SEC1 point]` — the key to be
# certified — every second until a chain arrives, and again at two thirds of
# its lifetime; `identity_cert` takes `[0x5C][len:2 LE][leaf DER ‖ issuer
# DER ‖ …]`, which is presented only when its leaf certifies this key.
# Unwired, a label identity refuses to construct; with no label both ports
# are inert.
[[ports]]
name = "identity_cert"
direction = "input"
index = 3
content_type = "OctetStream"
buffer_size = 4096

[[ports]]
name = "identity_req"
direction = "output"
index = 4
content_type = "OctetStream"

# Module-scope observability (optional); wired to observe.telemetry.
[observability]
# `bytes_in` / `bytes_out` are the cipher-side (ip seam) byte counters every
# data-moving module reports, and they sit at the END of the list: metric ids are positional, and 0..2 are
# interned in every collector and id-table built against this manifest, so a
# new counter is appended and never inserted.
metrics = [
    "ecdh_pool_hit",
    "ecdh_fallback_keygen",
    "frame_write_dropped",
    "bytes_in",
    "bytes_out",
    # Strict pairs abandoned when the redelivery caps held the next record
    # back with no consumption for the horizon budget.
    "redeliver_cap_abandoned",
    # Strict pairs abandoned when the record ceiling (session_ctrl's
    # STRICT_TX_RECORDS outbound records unacknowledged by the peer's
    # transport) held the next record back with no acknowledgement for the
    # horizon budget.
    "txrec_cap_abandoned",
]
# Span 0: one `tls.handshake` span per session (Handshaking -> Ready/Error),
# status OK on completion, ERROR on a failed handshake. Minted only when the
# telemetry port is wired (zero-cost otherwise).
spans = ["tls.handshake"]

