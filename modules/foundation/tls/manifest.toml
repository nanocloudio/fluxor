version = "1.0.0"
# timer_class: handshake/session timers read wall-clock (dev_millis).
timer_class = "wall_clock"
hardware_targets = ["rp2350", "bcm2712"]

# Ingress anchor role for the tls-fronted 443 edge (rfc_workload_ingress
# §2/§4.1, rfc_protocols.md §8.1): tls terminates the client-visible
# secure stream in front of the http proxy anchor. Declared so the
# `continuity` config validator (class edge_anchored) accepts a
# tls-fronted edge whose anchor wants `transport.anchor.stream.secure`.
capabilities = ["transport.anchor.stream.secure"]

[[ports]]
name = "cipher_in"
direction = "input"
content_type = "NetProto"

[[ports]]
name = "clear_in"
direction = "input"
content_type = "NetProto"

[[ports]]
name = "cipher_out"
direction = "output"
content_type = "NetProto"

[[ports]]
name = "clear_out"
direction = "output"
content_type = "NetProto"

# Per-session peer-identity envelope emitted after TLS handshake
# completion. Wire format documented in
# modules/foundation/tls/mod.rs (`MSG_PEER_IDENTITY` const block):
#   [msg_type:1=0x5A][payload_len:2 LE]
#   [conn_id:1][replica_id:1=0xFF][verified:1][svid_len:1][svid…]
# `verified == 1` iff `svid_len > 0`. SVID is SHA-256 of the peer
# cert's raw subjectPublicKey (32 B). The TLS module retries on
# back-pressure so delivery is at-least-once.
[[ports]]
name = "peer_identity"
direction = "output"
content_type = "OctetStream"

# Module-scope observability (out[3], optional); wired to observe.telemetry.
[observability]
# `bytes_in` / `bytes_out` are the cipher-side (ip seam) byte counters that
# standards/observability.md §6 requires of a data-moving module; tls carried
# only its crypto-pool counters until 2026-07-27. APPENDED, not prepended —
# metric ids are positional and 0..2 are already interned in every collector
# and id-table built against this manifest.
metrics = [
    "ecdh_pool_hit",
    "ecdh_fallback_keygen",
    "frame_write_dropped",
    "bytes_in",
    "bytes_out",
]
# Span 0: one `tls.handshake` span per session (Handshaking -> Ready/Error),
# status OK on completion, ERROR on a failed handshake. Minted only when the
# telemetry port is wired (zero-cost otherwise).
spans = ["tls.handshake"]
