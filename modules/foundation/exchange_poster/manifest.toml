version          = "1.0.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712", "rp2350", "linux"]
# Reacts to channel readiness only; nothing here measures time.
timer_class      = "agnostic"

# exchange_poster — the generic byte-egress adapter between a framed payload
# producer (the `otel` export engine) and any provider of the exchange
# contract (`crates/fluxor-abi/src/contracts/exchange.rs`) — an HTTP client, or anything
# else that answers a request. The poster is the requester.
#
#   payload       ->  one framed body per batch (net_proto [msg_type][len][body])
#   request_out   ->  one request HEAD per batch: a CALL whose HTTP method
#                     and target come from params, a `content-type` meta
#                     field when one is set, the batch inline as the whole
#                     body
#   response_in   <-  the provider's answer, by exchange id
#   delivery_out  ->  one status byte per batch (delivered / retry / drop),
#                     the `otel.delivery` backchannel — which is what turns a
#                     fire-and-forget export into a retained, retried one.
#
# The adapter is protocol-blind: it composes exchange records, never an HTTP
# byte. A batch that does not fit one record is dropped, permanently and
# reported — it is one encoded document, and the producer's encoding is the fix.
#
# Response mapping, by outcome alone: OK -> delivered; BUSY, UNAVAILABLE,
# TIMEOUT and FAILED (the OTLP retryable family: an HTTP collector's 429 and
# every 5xx, and a provider that could not reach the collector or heard
# nothing back) -> retry; any other outcome -> drop (permanent; retrying
# wedges the pipe). A provider ABORT -> retry, except
# TOO_LARGE / MALFORMED -> drop. LINK DOWN -> the batch in flight retries.

[[ports]]
name         = "payload"
index        = 0
direction    = "input"
content_type = "OctetStream"
max_record   = 8500
buffer_size  = { default = 8704, thumbv8m = 4352 }

[[ports]]
name         = "request_out"
index        = 0
direction    = "output"
content_type = "ExchangeRequest"
max_record   = 8192
buffer_size  = 8192
# The `method` param is an HTTP method: the requests carry its verbs.
[ports.facts]
binding = ["http"]

[[ports]]
name         = "response_in"
index        = 1
direction    = "input"
content_type = "ExchangeResponse"
max_record   = 8192
buffer_size  = 8192

# The same request as a PUBLISH, verb 0, for a provider that accepts records
# for a durable destination: it carries no binding's verbs. A graph wires this
# or `request_out`, never both.
[[ports]]
name         = "publish_out"
index        = 2
direction    = "output"
content_type = "ExchangeRequest"
max_record   = 8192
buffer_size  = 8192

[[ports]]
name         = "delivery_out"
index        = 1
direction    = "output"
content_type = "OctetStream"
max_record   = 16
buffer_size  = 64

[observability]
exempt = "carrier adapter — forwards the export engine's batches verbatim; delivery outcomes ARE the engine's own fidelity accounting, reported on its backchannel"
