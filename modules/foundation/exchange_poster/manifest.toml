version          = "1.0.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712", "rp2350"]
# Reacts to channel readiness only; nothing here measures time.
timer_class      = "agnostic"

# exchange_poster — the generic byte-egress adapter between a framed payload
# producer (the `otel` export engine) and any provider of the exchange
# contract (`modules/sdk/contracts/exchange.rs`) — an HTTP client, or anything
# else that answers a request. The poster is the requester.
#
#   payload       ->  one framed body per batch (net_proto [msg_type][len][body])
#   request_out   ->  one request HEAD per batch: method and target from
#                     params, a `content-type` header when one is set, the
#                     batch inline as the whole body
#   response_in   <-  the provider's answer, by exchange id
#   delivery_out  ->  one status byte per batch (delivered / retry / drop),
#                     the `otel.delivery` backchannel — which is what turns a
#                     fire-and-forget export into a retained, retried one.
#
# The adapter is protocol-blind: it composes exchange records, never an HTTP
# byte. A batch that does not fit one record is dropped, permanently and
# reported — it is one encoded document, and the producer's encoding is the fix.
#
# Response mapping: a 2xx status -> delivered; 429 and every 5xx (the OTLP
# retryable family, including the 502 and 504 a provider raises when the
# collector is unreachable or silent) -> retry; any other status -> drop
# (permanent; retrying wedges the pipe). A provider ABORT -> retry, except
# TOO_LARGE / MALFORMED -> drop. LINK DOWN -> the batch in flight retries.

[[ports]]
name         = "payload"
index        = 0
direction    = "input"
content_type = "OctetStream"
max_record   = 8500
buffer_size  = { default = 8704, rp2350 = 4352 }

[[ports]]
name         = "request_out"
index        = 0
direction    = "output"
content_type = "ExchangeRequest"
max_record   = 8192
buffer_size  = 8192

[[ports]]
name         = "response_in"
index        = 1
direction    = "input"
content_type = "ExchangeResponse"
max_record   = 8192
buffer_size  = 8192

[[ports]]
name         = "delivery_out"
index        = 1
direction    = "output"
content_type = "OctetStream"
max_record   = 16
buffer_size  = 64

[observability]
exempt = "carrier adapter — forwards the export engine's batches verbatim; delivery outcomes ARE the engine's own fidelity accounting, reported on its backchannel"
