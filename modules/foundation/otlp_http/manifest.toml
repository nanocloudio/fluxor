version = "1.0.0"
hardware_targets = ["bcm2712", "rp2350"]
permissions = ["platform_raw"]
# Flush cadence, HTTP response timeout, and reconnect backoff all use
# dev_micros; none are derived from scheduler step counts.
timer_class = "wall_clock"

# Single source of truth for the observability id-table bound. The module
# compiles this as `IDTABLE_MAX` (a fixed array in its arena-allocated state)
# and the config compiler reads it from here to bound the table it injects;
# the drift guard in `tools/src/config/tests.rs` fails the build if the two
# disagree. Per silicon because the table scales with graph size: a
# broker-scale Pi 5 graph (15 instrumented modules) needs ~2.7 KiB of names,
# while an rp2350 graph is a handful of modules and pays no arena for the
# headroom. Overflow is silent at the collector — the sample still exports,
# it just resolves to no name — so the compiler warns at the cap.
[capacities]
idtable = { default = 2048, bcm2712 = 4096 }

# Module-scope telemetry arrives here as fixed-layout `TelemetryRecord`s
# (modules/sdk/contracts/telemetry.rs) — the same edge `observe` and
# `otel_udp_sample` consume.
[[ports]]
name = "telemetry"
direction = "input"
content_type = "Telemetry"

# Stream surface to the IP module (net_proto / Stream Surface v1). Outbound
# TCP client: CMD_CONNECT -> MSG_CONNECTED, CMD_SEND, MSG_DATA, CMD_CLOSE.
#   ip.net_out -> otlp_http.net_in     (MSG_CONNECTED / MSG_DATA / MSG_CLOSED)
#   otlp_http.net_out -> ip.net_in     (CMD_CONNECT / CMD_SEND / CMD_CLOSE)
[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"
required = true
buffer_size = { default = 2048, bcm2712 = 8192 }

[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"
required = true
buffer_size = { default = 2048, bcm2712 = 8192 }
max_record = 2048

# Forwards telemetry as OTLP/HTTP; originates none. Exempt from the
# instrumentation contract (standards/observability.md §6).
[observability]
exempt = "telemetry exporter — forwards records, originates none"
