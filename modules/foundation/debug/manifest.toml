version = "1.0.0"
hardware_targets = ["rp2350", "bcm2712", "linux", "uefi"]

# `debug` accepts a data stream and logs it. The input is optional:
# running debug with no wiring is a supported "does the runtime load
# modules?" smoke test. Marking the port required would force users
# to wire a stub source they don't need.
[[ports]]
name = "data"
direction = "input"
content_type = "OctetStream"

# Module-scope observability — exempt.
[observability]
exempt = "debug tap — diagnostic passthrough, not a production data path"
