version = "1.0.0"
# timer_class: the drain window counts scheduler ticks as ms (elapsed vs
# drain_timeout_ms), so it warps the moment a mechanism-(b) domain varies the
# tick period and stalls entirely under mechanism-(a) idle-sleep. Keep this
# module on a fixed-cadence domain unless it is reworked to read dev_millis.
timer_class = "tick_counted"
hardware_targets = ["rp2350", "rp2040", "bcm2712"]
permissions = ["reconfigure", "monitor"]

[[ports]]
name = "trigger"
direction = "input"
content_type = "OctetStream"
required = true

[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"

# Module-scope observability — exempt (see standards/observability.md §6).
[observability]
exempt = "control-plane module (FMP/config) — applies discrete messages, not a sustained byte data path"
