version = "1.0.0"
hardware_targets = ["rp2040", "rp2350", "bcm2712", "linux", "wasm", "uefi"]
# Moves what is buffered when it is stepped; nothing here is timed.
timer_class = "agnostic"
mailbox_safe = true

# Several outputs wired to one input: the composer puts a merge on it
# (`fluxor_contracts::graph::plan::fan_pass`). Each producer writes to one of
# `in0`..`in15`, numbered from 0 in the order the composer joins them; the
# consumer reads `out0`. The inputs are served round robin, and a unit moves
# only when `out0` can take it whole.
#
# ─── Parameters (TLV) ──────────────────────────────────────────────────
# | Tag | Name            | Type | Default | Description |
# |-----|-----------------|------|---------|-------------|
# | 1   | frame_kind      | u8   | 0       | `stream` 0, `eth` 1, `net` 2, `telemetry` 3, `record` 4: what one unit on the fanned port is. |
# | 2   | frames_per_step | u16  | 64      | Whole frames or records moved per step, at most. |
# | 3   | scratch_bytes   | u32  | 32768 on aarch64, 2048 on thumb, 8192 elsewhere | Bytes of scratch from the heap: the largest unit moved whole. The composer sets it to the largest ring beside the fan. |

[[ports]]
name = "out0"
direction = "output"
content_type = "OctetStream"
required = true

[[ports]]
name = "in0"
direction = "input"
content_type = "OctetStream"
required = true

[[ports]]
name = "in1"
index = 1
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "in2"
index = 2
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "in3"
index = 3
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "in4"
index = 4
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "in5"
index = 5
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "in6"
index = 6
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "in7"
index = 7
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "in8"
index = 8
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "in9"
index = 9
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "in10"
index = 10
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "in11"
index = 11
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "in12"
index = 12
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "in13"
index = 13
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "in14"
index = 14
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "in15"
index = 15
direction = "input"
content_type = "OctetStream"

[capacities]
# The scratch, from the heap: one byte per `scratch_bytes` (params tag 3),
# on top of the declared arena (the allocation header).
heap_per_param = { base = 64, params = [
    { tag = 3, default = { default = 8192, aarch64 = 32768, thumbv6m = 2048, thumbv8m = 2048 }, bytes_each = 1 },
] }

[observability]
exempt = "a fan the composer inserts — the units it moves are observed at the modules on either side of it"
