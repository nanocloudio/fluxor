version = "1.0.0"
hardware_targets = ["rp2350", "rp2040"]

[[ports]]
name = "source"
direction = "input"
content_type = "OctetStream"
required = true

[[ports]]
name = "level"
direction = "output"
content_type = "OctetStream"
required = true
# One level byte per write; a 64-byte ring queues 64 of them.
max_record = 1
buffer_size = 64

# Module-scope observability — exempt (see standards/observability.md §6).
[observability]
exempt = "control-rate transformer — emits one level byte per brightness change, not a sustained byte stream"
