version = "1.0.0"
hardware_targets = ["rp2350", "bcm2712", "linux"]

# A small `storage.object` + `storage.namespace` provider over the `fs`
# contract: each object a file under `root`, written through a temporary and
# a rename, its key in the file's header. The store a board has without a
# storage cluster -- FAT32 under `fat32` on a Pi 5 or a Pico, a host
# directory on Linux. See mod.rs for the format and what it does not do.
provides = ["storage.object", "storage.namespace"]

# No tick-based timekeeping: a pure provider_call surface.
timer_class = "agnostic"

# Every op is answered from the filesystem the graph wires underneath.
[[resources]]
requires_contract = "fs"
access = "write"

[observability]
exempt = "provider answered inside its consumers' steps; it originates no stream and every op's outcome is its caller's to report"
