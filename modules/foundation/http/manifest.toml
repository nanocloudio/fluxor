version = "2.0.0"
hardware_targets = ["rp2350", "bcm2712"]

# Feature-set variants (RFC module_variants). `full` (default) emits
# the unsuffixed http.fmod with every protocol generation;
# `http-web.fmod` drops HTTP/2 + HTTP/3 (h2/hpack/wire_h2/client_h2 +
# h3/qpack/wire_h3, ≈4.65k LOC of flash) for embedded targets that
# serve single-connection HTTP/1 (+WebSocket). `h1` and `ws` are
# declared markers — always compiled today; a future `min` variant
# arrives when the ws seams are gated (rfc_module_variants.md §9 O1:
# ws scatter is ~10x h2's, deferred until a workload needs it).
[[variant]]
name = "web"
features = ["h1", "ws"]

[[variant]]
name = "full"
features = ["h1", "h2", "ws", "h3"]
default = true

[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"
# Sized to absorb 8 KiB CMD_SEND payloads (the staging cap on aarch64)
# plus in-flight headroom; embedded workloads stage 1600-byte payloads
# on a 2 KiB budget.
buffer_size = { default = 2048, bcm2712 = 16384 }

[[ports]]
name = "variables"
index = 1
direction = "input"
content_type = "FmpMessage"
buffer_size = 256

[[ports]]
name = "file_data"
index = 2
direction = "input"
content_type = "OctetStream"
buffer_size = { default = 2048, bcm2712 = 16384 }

[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"
buffer_size = { default = 2048, bcm2712 = 16384 }

[[ports]]
name = "file_ctrl"
index = 1
direction = "output"
content_type = "OctetStream"
buffer_size = 256

# WebSocket fan-out — populated only when a route uses
# HANDLER_WEBSOCKET_FANOUT (handler value 5). On such routes the upgraded
# connection's frames are routed externally as WsFrame records on these
# ports instead of being echoed internally. Routes that use the existing
# HANDLER_WEBSOCKET (4) ignore these channels and keep echoing.
[[ports]]
name = "ws_out"
index = 2
direction = "output"
content_type = "WsFrame"

[[ports]]
name = "ws_in"
index = 3
direction = "input"
content_type = "WsFrame"
# WsFrame envelopes from ws_stream: [conn_id u32][opcode][fin][len u16]
# [payload] — payload up to 65535 B, so the full envelope is ~65 KiB.
# Channel writes are all-or-nothing: a default ring silently rejects
# every envelope. aarch64 pipelines two envelopes; embedded fits
# exactly one plus header.
buffer_size = { default = 65600, bcm2712 = 131072 }

# Module-scope observability (out[3], optional); wired to observe.telemetry.
[[ports]]
name = "telemetry"
index = 3
direction = "output"
content_type = "Telemetry"

[[resources]]
requires_contract = "channel"
access = "read"

# HANDLER_FS_FILE routes serve files by path through the FS_CONTRACT
# (`fat32` on bare-metal, `linux_fs_dispatch` on the host). Granting
# `fs` enables `provider_call(-1, FS_OPEN, ...)`.
[[resources]]
requires_contract = "fs"
access = "read"

[observability]
metrics = ["bytes_in", "bytes_out"]
# Span 0: one `http.server.request` span per request (head parsed -> response
# drained), SERVER kind. Minted only when the telemetry port is wired
# (zero-cost otherwise). Keepalive re-latches the span per request.
spans = ["http.server.request"]
