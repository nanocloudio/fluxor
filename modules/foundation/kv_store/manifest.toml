version = "1.0.0"
hardware_targets = ["rp2350", "bcm2712"]

# Lattice KV — paged-arena key-value store. Demonstrates transparent
# demand paging on MMU-capable targets (bcm2712) and resident-arena
# storage on MMU-less targets (rp2350).

# The store reads its heap arena raw (`ARENA_GET` in `module_new`), so the
# kernel commits the whole cap at instantiation (params tag 0xEE).
[capacities]
raw_arena = 1
