version = "1.0.0"
hardware_targets = ["rp2350", "rp2040"]

[[ports]]
name = "stream"
direction = "input"
content_type = "OctetStream"
required = true

[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"

# The link to `graph_slot`: FMP-framed requests out, its `gs.result`
# answers in (`contracts/storage/graph_slot.rs`). Index 1 on each side,
# which is where the module looks for them.
[[ports]]
name = "gs_resp"
index = 1
direction = "input"
content_type = "FmpMessage"
required = true

[[ports]]
name = "gs_req"
index = 1
direction = "output"
content_type = "FmpMessage"
required = true

# Module-scope observability — exempt (see standards/observability.md §6).
[observability]
exempt = "firmware-image ingest — emits its own progress status records (kind/offset/byte_count) on the status port; a generic byte counter would duplicate that domain telemetry"
