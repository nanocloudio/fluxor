version = "1.0.0"
# timer_class: TCP/ARP timers increment on a 50 ms wall-clock gate (dev_millis), not per tick.
timer_class = "wall_clock"
hardware_targets = ["rp2350", "bcm2712"]

# The emission fence (`ADDR_FENCE` on `addr_ctl`): a provable cutoff for a
# local address, reported as the frame counter at the ring hand-off.
capabilities = ["fence.enforceable"]

[capability_facts."fence.enforceable"]
cutoff = "ring_handoff"

[[ports]]
name = "frames_rx"
direction = "input"
content_type = "EthernetFrame"
required = true
# ETH rings are the per-tick burst budget for the IP pipeline. aarch64 uses
# 32 KiB (~21 MSS); rp2350/wasm keep 4 KiB.
buffer_size = { default = 4096, bcm2712 = 32768 }

[[ports]]
name = "frames_tx"
direction = "output"
content_type = "EthernetFrame"
required = true
buffer_size = { default = 4096, bcm2712 = 32768 }

[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"
# net rings match http's per-call stage: 16 KiB on aarch64, 2 KiB else.
buffer_size = { default = 2048, bcm2712 = 16384 }

[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"
buffer_size = { default = 2048, bcm2712 = 16384 }

# Address-control port (in[2]) — rfc_net_identity_metal §3.2. Single writer:
# the platform workload backend. Carries IP_ADDR_ADD / IP_ADDR_DEL as
# net-proto-framed control messages. Optional: graphs that don't wire it get
# today's single-address behaviour, byte-identical. Small ring — this is
# low-rate control, not a data path.
[[ports]]
name = "addr_ctl"
direction = "input"
index = 2
content_type = "NetProto"
buffer_size = { default = 512, bcm2712 = 512 }

# Emission events back to the address-control writer (out[5]): the token
# minted at each install (`MSG_ADDR_ADDED`), arm and fence outcomes, and
# refusals. An address installs armed unless the writer asks otherwise;
# `ADDR_ARM` / `ADDR_FENCE` present the token. A fence closes the emission
# gate in `send_frame` — no frame sourced from the address is handed to the
# driver ring after `MSG_ADDR_FENCED`, which carries the frame counter at
# the cutoff. That boundary is the ring hand-off, and the capability fact
# says so: a driver that can prove the wire declares `cutoff = "wire"`.
[[ports]]
name = "addr_evt"
direction = "output"
index = 5
content_type = "NetProto"
buffer_size = { default = 512, bcm2712 = 1024 }

# Pre-transport decision seam (in[3] / out[3] / out[4]), on only when
# `packet_decision = pre_transport`: every validated inbound IPv4 packet is
# described to a director on `packet_out` and held until the director's
# disposition arrives on `packet_in`; a TUNNEL or DSR disposition hands the
# whole frame over on `packet_fwd`. Wire contract:
# `modules/sdk/contracts/net/packet.rs` (`MSG_PKT_DECIDE`,
# `CMD_PKT_DISPOSE`, `MSG_PKT_FORWARD`). Unwired means the seam does not
# exist at runtime; wiring it with the parameter off is refused at
# construct, as is the parameter on without the ports.
[[ports]]
name = "packet_in"
direction = "input"
index = 3
content_type = "NetProto"
buffer_size = { default = 512, bcm2712 = 2048 }

[[ports]]
name = "packet_out"
direction = "output"
index = 3
content_type = "NetProto"
buffer_size = { default = 512, bcm2712 = 2048 }

[[ports]]
name = "packet_fwd"
direction = "output"
index = 4
content_type = "NetProto"
buffer_size = { default = 4096, bcm2712 = 32768 }

# Transport continuity (in[4] / out[6]), the `session_ctrl` §Transport
# continuity surface for the TCP connections this module owns: a
# coordinator's PAIR_PREPARE / CHECKPOINT / DELTA / QUIESCE / CUT / ARM /
# ACTIVATE / RETIRE / ABORT commands arrive on `cont_in`; replies
# (`MSG_SC_CONTINUITY`), checkpoint chunks and deltas leave on `cont_out`.
# Unwired means no connection here can be mirrored or imported. The flow
# identity is the tuple: [local_ip:4][remote_ip:4][local_port:2]
# [remote_port:2][0;4], all big-endian.
[[ports]]
name = "cont_in"
direction = "input"
index = 4
content_type = "OctetStream"
buffer_size = { default = 2048, bcm2712 = 8192 }

[[ports]]
name = "cont_out"
direction = "output"
index = 6
content_type = "OctetStream"
buffer_size = { default = 4096, bcm2712 = 16384 }

# Module-scope observability. Optional 3rd output (out[2]); wired to
# `observe.telemetry` when the debug stack's observe overlay is on. Emits
# cumulative counters; no-op when unwired. See standards/observability.md.
[observability]
metrics = ["bytes_in", "bytes_out"]
# Span 0: one `tcp.connection` span per accepted connection (accept -> close),
# the ingress root of a trace. Emitted on the same telemetry port; minted only
# when wired (zero-cost otherwise).
spans = ["tcp.connection"]

# Execution envelope, measured profile. The numbers
# are this module's thread-CPU-time maxima under the mixed TCP / ARP / UDP
# load of the evidence gate, on an aarch64 Linux host (Pi 5) that was also
# running concurrent builds: observed max_step 28-168 us (p50 0.7 us, p99
# 14-17 us) and max_dispatch 24-68 us across runs. Each declaration is the
# largest observed maximum times a safety factor of 3, rounded. A step
# excludes the synchronous dispatches it makes (TIMER::MILLIS,
# RANDOM_FILL), which `max_dispatch_us` bounds per call.
[execution]
max_step_us = 500
max_dispatch_us = 200
profile = "measured_envelope"
evidence = "tests/harness/tests/execution_envelope_ip.rs"
