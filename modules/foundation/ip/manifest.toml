version = "1.0.0"
# timer_class: TCP/ARP timers increment on a 50 ms wall-clock gate (dev_millis), not per tick.
timer_class = "wall_clock"
# `linux`: over the `linux_eth` native frame driver the module is the hosted runtime's
# own TCP/IP stack (the transport-continuity surfaces need a stack that owns
# its connections; `linux_net`'s host sockets cannot checkpoint one).
hardware_targets = ["rp2040", "rp2350", "bcm2712", "linux", "uefi"]

# The node's `net.route` and `net.policy` provider on bare metal: the node
# agent writes segments, peer routes, held addresses and packet policy here,
# and an in-graph enforcer (`pkt_filter`) attaches to the tables it applies.
# A module provider and the modules it serves share an execution domain.
provides = ["net_route", "net_policy"]
provider_contracts = ["net_route", "net_policy"]

# The emission fence (`ADDR_FENCE` on `addr_ctl`): a provable cutoff for a
# local address, reported as the frame counter at the ring hand-off.
capabilities = ["fence.enforceable"]
deferred_ready = true

[capability_facts."fence.enforceable"]
cutoff = "ring_handoff"

# Lanes: every consumer reaches the stack over a `Lane { key, target = "ip" }`
# of its own — a module of the node's graph under the node owner, a staged
# workload's under its own — never a port. The `net_in`/`net_out` ports below
# describe each lane's commands and events: the composer wires every edge to
# them as a lane (one per edge into `net_in`, one shared by the edges marked
# `edge_class: merge`) and adds the node graph's lanes to `lanes`. The kernel
# reads the capacity from the `lanes` param as it instantiates the module,
# queues each lane for it (`LANE_TAKE`), and answers a workload owner's
# grants (`OWNER_GRANTS`). `lanes = 0` serves none.
[lanes]
capacity_param = "lanes"

[[ports]]
name = "frames_rx"
direction = "input"
content_type = "EthernetFrame"
required = true
# `net_route` and `net_policy` are answered from `ip`'s own store whatever
# the NIC has delivered, so a filter in the frame path (`pkt_filter`) may
# read `ip`'s tables while it feeds `ip` its frames.
gates_readiness = false
# ETH rings are the per-tick burst budget for the IP pipeline. aarch64 uses
# 32 KiB (~21 MSS); rp2350/wasm keep 4 KiB.
buffer_size = { default = 4096, aarch64 = 32768 }

[[ports]]
name = "frames_tx"
direction = "output"
content_type = "EthernetFrame"
required = true
# A fence asks the NIC driver here whether the wire is quiet; a driver that
# serves no drain query leaves the fence at the ring hand-off.
contract = "net_tx_drain"
contract_optional = true
buffer_size = { default = 4096, aarch64 = 32768 }

[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"
# net rings match http's per-call stage: 16 KiB on aarch64, 2 KiB else.
buffer_size = { default = 2048, aarch64 = 16384 }
# A datagram of one link MTU, `[ep_id][af][addr 4][port]` + 1472 B, the
# longest record written here (`NET_OUT_MAX_RECORD`).
max_record = 1483
# What this port's connections send is kept here for every consumer that does
# not keep it itself (`retains_send`) and may open a stream (not
# `datagram_only`), in blocks of `tcp_send_buf` from a pool of
# `tcp_send_pool` bytes. Either at 0 keeps nothing, and may be set only when
# no consumer leaves retention here. The composer derives the pool from the
# graph: 0 where no consumer leaves retention here and no workload lane
# (`lanes`) is served, else the default pool's blocks of `tcp_send_buf`.
send_buffer_param = "tcp_send_buf"
send_pool_param = "tcp_send_pool"
send_pool_lanes_param = "lanes"

[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"
buffer_size = { default = 2048, aarch64 = 16384 }
# One command up to the send stash (`NET_IN_ACCEPTS_RECORD`).
accepts_record = { default = 1603, aarch64 = 8195 }

# Address-control port (in[2]). Single writer: the workload creator, or an
# address coordinator on a node without one. Carries ADDR_ADD / ADDR_DEL /
# ADDR_ARM / ADDR_FENCE and owners' OWNER_RESOLVER contexts as
# net-proto-framed control messages. Optional: a graph that doesn't wire it
# serves its single configured address. Small ring — this is low-rate
# control, not a data path.
[[ports]]
name = "addr_ctl"
direction = "input"
index = 2
content_type = "NetProto"
buffer_size = { default = 512, aarch64 = 512 }
accepts_record = 265

# Emission events back to the address-control writer (out[5]): the token
# minted at each install (`MSG_ADDR_ADDED`), arm and fence outcomes, and
# refusals. An address installs armed unless the writer asks otherwise;
# `ADDR_ARM` / `ADDR_FENCE` present the token. A fence closes the emission
# gate in `send_frame` — no frame sourced from the address is handed to the
# driver ring after `MSG_ADDR_FENCED`, which carries the frame counter at
# the cutoff. That boundary is the ring hand-off, and the capability fact
# says so: a driver that can prove the wire declares `cutoff = "wire"`.
[[ports]]
name = "addr_evt"
direction = "output"
index = 5
content_type = "NetProto"
buffer_size = { default = 512, aarch64 = 1024 }
max_record = 39

# Pre-transport decision seam (in[3] / out[3] / out[4]), on only when
# `packet_decision = pre_transport`: every validated inbound IPv4 packet, and
# every TCP or UDP packet to a `seam_v6` address, is described to a director
# on `packet_out` (`MSG_PKT_DECIDE` / `MSG_PKT_DECIDE6`) and held until the
# director's disposition arrives on `packet_in`; a TUNNEL, DSR or CHAIN
# disposition, and a MIRROR's copy, hand the whole frame over on
# `packet_fwd`. Wire contract: `crates/fluxor-abi/src/contracts/net/packet.rs`
# (`CMD_PKT_DISPOSE`, `MSG_PKT_FORWARD`). Unwired means the seam does not
# exist at runtime; wiring it with the parameter off is refused at
# construct, as is the parameter on without the ports.
[[ports]]
name = "packet_in"
direction = "input"
index = 3
content_type = "NetProto"
buffer_size = { default = 512, aarch64 = 2048 }
accepts_record = 27

[[ports]]
name = "packet_out"
direction = "output"
index = 3
content_type = "NetProto"
buffer_size = { default = 512, aarch64 = 2048 }
max_record = 61

[[ports]]
name = "packet_fwd"
direction = "output"
index = 4
content_type = "NetProto"
buffer_size = { default = 4096, aarch64 = 32768 }
max_record = 1600

# Transport continuity (in[4] / out[6]), the `session_ctrl` §Transport
# continuity surface for the TCP connections this module owns: a
# coordinator's (or `transport_continuity`'s) PAIR_PREPARE / CHECKPOINT /
# DELTA / QUIESCE / CUT / ARM / ACTIVATE / RETIRE / ABORT / TOMBSTONE
# commands arrive on `cont_in`; replies
# (`MSG_SC_CONTINUITY`), checkpoint chunks and deltas leave on `cont_out`.
# Unwired means no connection here can be mirrored or imported. The flow
# identity is the tuple: [local_ip:4][remote_ip:4][local_port:2]
# [remote_port:2][0;4], all big-endian; an IPv6 connection's is
# `tc_flow_id_v6` (0xF6 then a digest of its tuple, transport_continuity.rs).
[[ports]]
name = "cont_in"
direction = "input"
index = 4
content_type = "OctetStream"
buffer_size = { default = 2048, aarch64 = 8192 }

[[ports]]
name = "cont_out"
direction = "output"
index = 6
content_type = "OctetStream"
buffer_size = { default = 4096, aarch64 = 16384 }

# The VIP authority (in[5] / out[7]), with `arm_authority`: each ADDR_ARM's
# emission token goes out as MSG_ARM_AUTH_CHECK (with this host's boot
# incarnation) and the address arms only on an accepting ARM_AUTH_VERDICT
# (`contracts/net/identity.rs` §The VIP authority's token). Unwired with the
# parameter set, nothing arms.
[[ports]]
name = "auth_rsp"
direction = "input"
index = 5
content_type = "OctetStream"
buffer_size = 512

[[ports]]
name = "auth_req"
direction = "output"
index = 7
content_type = "OctetStream"
buffer_size = 1024

# Module-scope observability. Optional 3rd output (out[2]); wired to
# `observe.telemetry` when the debug stack's observe overlay is on. Emits
# cumulative counters; no-op when unwired.
[capacities]
# The send pool (`tcp_send_pool`) comes from the heap on an MCU-class target,
# so the heap grows by it, byte for byte; on aarch64 its blocks are granted
# from the elastic region and the heap does not. `base` is `module_facts!`'s
# arena (`HEAP_DEFAULT_BYTES`), `default` the param's schema default
# (`send_pool::POOL_DEFAULT`). The decision seam's holds (`packet_holds`) are
# heap too, `HOLD_BYTES` each, declared only by a graph that turns the seam on.
# Each lane (`lanes`, the node graph's and its workloads') is heap on an
# MCU-class target, `LANE_HEAP_BYTES` each at the declared defaults.
heap_per_param = { base = { default = 1976, aarch64 = 16777216 }, params = [
    { tag = 34, default = { default = 2920, thumbv8m = 5840, aarch64 = 8388608 }, bytes_each = { default = 1, aarch64 = 0 } },
    { tag = 32, default = 0, bytes_each = { default = 1628, aarch64 = 0 } },
    { tag = 12, default = { default = 0, aarch64 = 16 }, bytes_each = { default = 3548, aarch64 = 0 } },
] }

[observability]
metrics = ["bytes_in", "bytes_out"]
# Span 0: one `tcp.connection` span per accepted connection (accept -> close),
# the ingress root of a trace. Emitted on the same telemetry port; minted only
# when wired (zero-cost otherwise).
spans = ["tcp.connection"]

# Execution envelope, measured profile. The numbers
# are this module's thread-CPU-time maxima under the mixed TCP / ARP / UDP
# load of the evidence gate, on an aarch64 Linux host (Pi 5) that was also
# running concurrent builds: observed max_step 28-168 us (p50 0.7 us, p99
# 14-17 us) and max_dispatch 24-68 us across runs. Each declaration is the
# largest observed maximum times a safety factor of 3, rounded. A step
# excludes the synchronous dispatches it makes (TIMER::MILLIS,
# RANDOM_FILL), which `max_dispatch_us` bounds per call.
[execution]
max_step_us = 500
max_dispatch_us = 200
profile = "measured_envelope"
evidence = "tests/harness/tests/execution_envelope_ip.rs"

# A connection table sized for a graph whose traffic is a few datagrams --
# DHCP and a log sink -- rather than the profile's. Datagram endpoints take
# whole connection slots, so on RP2350 the default table is eight slots of
# some 2.2 KiB each whatever they carry; `small_table` holds four, inline on
# every target. Where the profile's table is already smaller (RP2040's two),
# it is the profile's.
[[variant]]
name     = "full"
features = []
default  = true

[[variant]]
name     = "small_table"
features = ["small_table"]
