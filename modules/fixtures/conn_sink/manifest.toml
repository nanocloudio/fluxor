version = "1.0.0"
hardware_targets = ["rp2350", "bcm2712", "linux"]
# Counts connections as they arrive; a half-closed connection's linger
# (`linger_ms`) is measured on the wall clock.
timer_class = "wall_clock"

# Fixture consumer for the ip module's connection-table ladders: binds one
# port, accepts every connection it is offered, holds each open, and echoes
# whatever arrives on it. Its own state per connection is one bit, so the
# table it exercises is the transport's, not its own — which is the point
# of the ladder. The heartbeat line
#
#   [sink] conns=<open> peak=<high water> accepted=<total> bytes=<echoed> refused=<n> bound=<0|1>
#
# is what a rig reads: `peak` at the rung the driver opened is the claim
# under test.
#
# Parameters: `port` (9000), `echo` (1), `ack` (0); and for a connection
# that moves under transport continuity, `linger_ms` / `farewell` (a peer
# that half-closes is kept open that long, then sent that many bytes and
# closed), `close_after` (our own close once that many bytes were echoed),
# `echo_after` (received bytes held unconsumed until that many have come,
# then exactly that many consumed, the rest held for the next), `cursor`
# (with `ack`: each CMD_DELIVERED's cursor is the bytes consumed, as its
# in_bytes always is, logged; a stream resumed by a takeover continues from
# its MSG_RESUMED in_bytes) and
# `dial` (`a.b.c.d:port`: connect out and be the session's client
# instead of listening).

[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"
required = true
buffer_size = { default = 4096, aarch64 = 65536 }

[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"
required = true
buffer_size = { default = 4096, aarch64 = 65536 }

[[resources]]
requires_contract = "channel"
access = "read"

# Module-scope observability — exempt.
[observability]
exempt = "capacity-ladder fixture; the `[sink]` heartbeat carries its counters, and the transport it exercises (ip) is the instrumented surface"
