version = "1.0.0"
hardware_targets = ["rp2350", "rp2040", "bcm2712", "linux"]

# Fixture for a domain placed on a core of its own, holding no grant. It
# steps and reports, about once a second,
#   [step_probe] <tag> steps=<n> gap_us=<longest wait between steps>
# so a reader can tell the module kept stepping while another core did
# something that parks this one. With `busy: 1` it asks to be stepped again
# at once, as a module with work always pending does, which keeps a `poll`
# domain's loop spinning.
timer_class = "wall_clock"

[[resources]]
requires_contract = "timer"
access = "read"

[observability]
exempt = "placement fixture; its '[step_probe]' lines are the observable, consumed by the rig scenarios' rules"
