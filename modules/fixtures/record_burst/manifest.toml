version = "1.0.0"
hardware_targets = ["bcm2712", "linux"]

# Writes records of differing lengths to `out`, as many in a step as the
# channel takes. Its input is never read: it gives a downstream module's
# output somewhere to stay until a test reads it off the channel.

[[ports]]
name = "records_in"
direction = "input"
content_type = "OctetStream"
framed = true

[[ports]]
name = "records_out"
direction = "output"
content_type = "OctetStream"
framed = true

[observability]
exempt = "channel framing fixture; a harness test reads what it causes off the channel"
