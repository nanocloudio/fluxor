version = "1.0.0"
hardware_targets = ["bcm2712", "rp2350", "rp2040"]

# Isolated transform module — real channel I/O through the gateway: it reads
# its input, XORs the bytes and writes its output, with the kernel copying
# between the channels and its own buffer. An ordinary SDK module, so it runs
# gated or not; gated is the point. Diagnostic — not loaded by production
# configs.
