name = "vault_probe"
version = "1.0.0"
hardware_targets = ["bcm2712", "linux"]

# Does a node keep its keys? Opens one persistent Ed25519 key by label
# (OPEN_OR_GENERATE, SIGN|EXPORT_PUBLIC|PERSIST) the way a node's CA is
# opened, asking again while the vault answers EAGAIN (its store not loaded
# yet, or the key not on the store's medium yet), then reports, and repeats the report every 5 s:
#
#   [vault_probe] key waits=<EAGAIN answers> pub=<first 8 bytes, hex>
#                 tier=<vault tier> persisted=<0|1|2>
#   [vault_probe] FAIL rc=-<errno>
#
# Two boots of one node logging the same `pub=` prove the key outlived the
# reboot; `persisted=` is `DESCRIBE`'s answer (0 not kept, 1 kept sealed, 2
# kept readable), `tier=` how well the key is protected (2 = sealed by a
# device key).
#
# Params: 1 label (str, default "fluxor/vault_probe").

[observability]
exempt = "self-contained fixture; its key/FAIL log lines are the verdict"
