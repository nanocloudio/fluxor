version = "1.0.0"
hardware_targets = ["bcm2712"]

# Portless staging fixture: writes the embedded gallery assets onto the
# FAT32 root via the FS contract (OPEN_CREATE/WRITE/FSYNC/CLOSE), then
# idles. Provisions the gallery the image_viewer rig scenario reads.

[[resources]]
requires_contract = "fs"
access = "write"

[observability]
exempt = "one-shot rig-provisioning fixture; success is its '[gallery] staged' log line and the subsequent image_viewer rig pass"
