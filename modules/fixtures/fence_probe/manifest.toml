version = "1.0.0"
hardware_targets = ["rp2350", "bcm2712", "linux"]
# Its schedule is wall-clock seconds after boot.
timer_class = "wall_clock"

# Fixture writer for the address-control surface
# (`modules/sdk/contracts/net/identity.rs`): it claims one address,
# waits `fence_after_s`, then fences it with the token the claim minted.
# Either provider of that surface answers it — the ip module, where the
# claim installs a secondary local address on this host, or an out-of-band
# fence agent, where it takes custody of the host that owns the address —
# so the same probe drives a local emission fence and a power cut.
#
# Everything it does is logged, so a packet capture can be aligned against
# it:
#
#   [fence_probe] installed <ip>            the address is claimed
#   [fence_probe] fence requested           the fence was asked for
#   [fence_probe] fenced cutoff=<kind> index=<n>
#   [fence_probe] refused reason=<r>
#
# `cutoff` is `wire` where the provider can prove the wire — the NIC
# driver confirmed its transmit drain, or the agent's actuator cut the
# host — and `ring_handoff` where the ip module can only promise its own
# hand-off to the driver ring.
#
# The `fenced` line is the cutoff a capture is read against: no frame
# sourced from `<ip>` may follow it. How long it trails the request is the
# provider's business — the ip module closes its gate as it takes the
# request and holds the event only while the driver drains, while an agent
# answers once its actuator has cut the host and the host's hold-up has
# passed.

[[ports]]
name = "addr_ctl_out"
direction = "output"
content_type = "NetProto"
required = true
buffer_size = 512

[[ports]]
name = "addr_evt_in"
direction = "input"
content_type = "NetProto"
required = true
buffer_size = 512

[[resources]]
requires_contract = "channel"
access = "read"

# Module-scope observability — exempt (standards/observability.md §6).
[observability]
exempt = "fence fixture; its log lines are the observable a packet capture is aligned against"
