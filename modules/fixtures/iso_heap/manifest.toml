version = "1.0.0"
hardware_targets = ["bcm2712", "rp2350", "rp2040"]

# Isolated heap module — proves a gated module's heap end to end: it
# allocates from and frees to its OWN per-module arena through the gateway,
# and hands the gateway a pointer it does not own, which must be refused
# without disturbing the allocator. An ordinary SDK module, so it runs gated
# or not; gated is the point. Diagnostic — not loaded by production configs.
