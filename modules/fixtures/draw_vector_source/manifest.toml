version = "1.0.0"
hardware_targets = ["rp2350", "bcm2712", "linux", "wasm"]
timer_class = "agnostic"

# A conformance vector replayed into a graph, for a rasteriser under test.
#
# `file` takes the bytes of one vector file
# (`abi::contracts::video_draw::vector`): its raster inputs, then its draw
# stream, read into one heap block of `file_bytes`. Once the whole file
# has arrived the module sends each raster input, a whole-surface record
# as the file holds it, on `surface0` and `surface1`
# (`abi::contracts::video_raster`), then the stream on `draw`
# (`abi::contracts::video_draw`), byte for byte, and rests. A raster input
# whose port is not wired is not sent. The byte strings a vector's RES_REF
# records name are not sent anywhere: the consumer holds those itself.
#
# A file larger than `file_bytes`, or one that is not a vector, is logged
# and nothing is sent.
#
# ─── Parameters (TLV) ──────────────────────────────────────────────────
# | Tag | Name       | Type | Default | Description |
# |-----|------------|------|---------|-------------|
# | 1   | file_bytes | u32  | 8192    | The largest vector file held: the heap block the file is read into. |

[[ports]]
name = "file"
direction = "input"
content_type = "OctetStream"
required = true

[[ports]]
name = "draw"
direction = "output"
content_type = "VideoDraw"
required = true
[ports.facts]
ops = ["fill_rect", "fill_rrect", "border", "pixmap", "glyphs", "clip_rect", "clip_rrect", "translate", "surface", "res_ref", "fill_path", "stroke_path", "current_color"]
pixmap_formats = ["rgba8", "rgb565"]
glyph_formats = ["a1", "a8"]
max_depth = 8
max_resources = 8
resource_bytes = 65536
# What the conformance vectors' paths stay within.
path_commands = 4096
path_edges = 16384
# A frame is replayed from the file, so it is no larger than the file.
frame_bytes = { param = "file_bytes" }
damage = ["full"]
atomic = ["no"]

[[ports]]
name = "surface0"
index = 1
direction = "output"
content_type = "VideoRaster"
required = false
[ports.facts]
formats = ["rgb565", "rgba8"]
regions = ["bands"]

[[ports]]
name = "surface1"
index = 2
direction = "output"
content_type = "VideoRaster"
required = false
[ports.facts]
formats = ["rgb565", "rgba8"]
regions = ["bands"]

[capacities]
# The file, from the heap: one byte per `file_bytes` (params tag 1), on
# top of the allocation header.
heap_per_param = { base = 64, params = [
    { tag = 1, default = 8192, bytes_each = 1 },
] }

[observability]
exempt = "a fixture — it replays one file and rests"
