version = "1.0.0"
hardware_targets = ["bcm2712"]
grants = ["metal_device.mmio", "metal_device.dma"]

# Fixture for the bounds on register access through an aperture and on the
# cache-maintenance opcodes, on QEMU virt. On its first step it asks for what
# must be refused — an aperture the machine does not have, a read through a
# handle naming none, an unaligned read, one past the aperture, a cache flush
# of no allocation of its own, a flush that wraps — and for what must be
# served — a device register, a flush of a streaming DMA buffer — and logs
# one line:
#
#   [access_probe] ok
#   [access_probe] FAIL case=<n>
timer_class = "agnostic"

[observability]
exempt = "fixture whose evidence is its one verdict line"

# Device registers, DMA memory and cache maintenance.
[[resources]]
requires_contract = "metal_device"
access = "write"
