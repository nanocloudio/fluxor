version = "1.0.0"
hardware_targets = ["rp2350", "bcm2712", "linux"]

# Continuity roles (capability_surface.md §Continuity Role): movable
# session worker with opaque export/import handoff and resume support.
# Consumed by the `continuity` config block validator.
capabilities = ["session.worker", "session.handoff", "session.resume"]

# The session-control channel from the anchor.
[[ports]]
name = "ctrl_in"
direction = "input"
content_type = "OctetStream"

# Raw byte data channel from the anchor (client bytes → worker).
[[ports]]
name = "data_in"
index = 1
direction = "input"
content_type = "OctetStream"

# Session-control replies back to the anchor.
[[ports]]
name = "ctrl_out"
direction = "output"
content_type = "OctetStream"

# Processed byte stream back to the anchor (worker bytes → client).
[[ports]]
name = "data_out"
index = 1
direction = "output"
content_type = "OctetStream"

[[resources]]
requires_contract = "channel"
access = "read"

# Module-scope observability — exempt.
[observability]
exempt = "application-layer demo — byte throughput is observed at the foundation transport (ip/quic/http) it rides"
