version = "1.0.0"
hardware_targets = ["bcm2712"]
permissions = ["platform_raw"]

# Tier-2 (IRQ-owned) validation probe. `isr_safe` attests the step/ISR body
# never calls a forbidden syscall from interrupt context — no heap
# allocation, no provider_call, no channel_read/channel_write, and
# bounded execution. Required for admission to a `tier: 2` domain; the
# author owns the claim and the runtime backstops it by returning EACCES
# on any barred syscall.
# `module_isr_entry` (exported in mod.rs) is what the IRQ dispatches into; the
# packer sets the isr_module header bit when it sees that symbol.
isr_safe = true

# Cadence-independent: it does no tick-based timekeeping. Lets it sit on an
# adaptive (mechanism-(b)) domain too if desired — an absent declaration is
# unattested and is blocked there.
timer_class = "agnostic"

[[ports]]
name = "probe_out"
direction = "output"
content_type = "OctetStream"
buffer_size = 16

# Module-scope observability — exempt (see standards/observability.md §6).
[observability]
exempt = "Tier-2 IRQ probe — counts module_isr_entry dispatches, emits no sustained byte stream"
