version = "1.0.0"
hardware_targets = ["rp2350", "rp2040", "bcm2712", "linux"]

# Fixture for a `timer` domain: each step counts one and does nothing else.
# `interrupt_safe` attests that the step makes no call at all, so the module
# may be stepped from the module timer's interrupt. The observable is the
# rate the platform reports its timer handler ran at.
interrupt_safe = true

# It keeps no time of its own.
timer_class = "agnostic"

[observability]
exempt = "timer-domain fixture; it makes no call, and the kernel's report of the handler's rate is the observable"
