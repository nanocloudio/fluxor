version = "1.0.0"
hardware_targets = ["rp2350", "bcm2712"]

# Holds the claim that a module going deeper than the stack it was admitted
# against is caught. The probe writes below its stack pointer in inline
# assembly, which the build's stack measurement does not read, so its recorded
# depth is its small prologue. On RP one step writes sixteen kilobytes down and
# the scheduler's stack fence must name the module and fault it; on bcm2712 it
# writes two megabytes down and must take a translation fault in the kernel
# stack's guard page. Diagnostic only; no production graph loads it.

[observability]
exempt = "stack-fence probe; its '[stack_fence_probe]' lines and the kernel's '[stack]' and fault lines are the observable, read by the rig scenario's rules"
