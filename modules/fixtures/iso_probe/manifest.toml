version = "1.0.0"
hardware_targets = ["bcm2712"]

# EL0 module-isolation probe for the Pi 5 walking skeleton. Runs at EL0
# under its own page table when wired with `protection: isolated` and
# demonstrates allowed (own state) vs. denied (kernel / out-of-region /
# execute-state / write-code) accesses, each of which becomes a contained
# module protection fault rather than a core hang. Diagnostic only — not
# loaded by production configs.

# The probe's fault mode IS its behaviour: modes that provoke a contained
# fault return an error so `fault_policy: restart` re-steps the same
# instance, and the probe relies on its state surviving that. It qualifies
# for the attestation on every count: `module_step` is syscall-free, so no
# provider handle is ever held; each step is one self-contained probe
# action; the probe carries no channel protocol whose in-flight bytes could
# be lost; and its only carried state is a step counter and two diagnostic
# sentinels.
resume_after_fault = true
