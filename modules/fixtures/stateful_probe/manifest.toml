name = "stateful_probe"
version = "1.0.0"
hardware_targets = ["bcm2712"]

# The smallest stateful workload: on its block source's first block it
# keeps a magic and an epoch; every start reads the epoch back, adds one,
# writes it, flushes, and logs it. Staged as a workload's subgraph over a
# volume that outlives it (loam's `loam_volume`, say), two consecutive starts
# logging epoch=1 then epoch=2 prove the workload's state lived in the
# volume between them.
#
#   [stateful_probe] epoch=<n>
#   [stateful_probe] FAIL <phase> rc=-<errno>

[[ports]]
name = "blocks"
direction = "input"
content_type = "OctetStream"

[observability]
exempt = "self-contained fixture; its epoch/FAIL log lines are the verdict"
