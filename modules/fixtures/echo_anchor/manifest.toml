version = "1.0.0"
hardware_targets = ["rp2350", "bcm2712", "linux"]

# Continuity role (capability_surface.md §Continuity Role): this module
# owns the client-visible transport attachment. Consumed by the
# `continuity` config block validator (class edge_anchored).
capabilities = ["transport.anchor.stream"]

# The stream surface (net_proto) channel from the IP module / linux_net.
[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"

# Session-control replies from the worker.
[[ports]]
name = "ctrl_in"
index = 1
direction = "input"
content_type = "OctetStream"

# Processed byte stream from the worker (to send back to client).
[[ports]]
name = "data_in"
index = 2
direction = "input"
content_type = "OctetStream"

# The stream surface (net_proto) commands to the IP module / linux_net.
[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"

# Session-control commands to the worker.
[[ports]]
name = "ctrl_out"
index = 1
direction = "output"
content_type = "OctetStream"

# Raw byte stream to the worker (bytes from client).
[[ports]]
name = "data_out"
index = 2
direction = "output"
content_type = "OctetStream"

# ── Optional standby worker (anchor-preserved handoff) ──────────────
# When wired, `handoff_after_bytes` swaps the live session between the
# two workers over session-control EXPORT/IMPORT/RESUME while the client
# TCP stream stays open (protocol_surfaces.md §Anchor-Preserved
# Maintenance).

# Session-control replies from the standby worker.
[[ports]]
name = "ctrl2_in"
index = 3
direction = "input"
content_type = "OctetStream"

# Processed byte stream from the standby worker.
[[ports]]
name = "data2_in"
index = 4
direction = "input"
content_type = "OctetStream"

# Session-control commands to the standby worker.
[[ports]]
name = "ctrl2_out"
index = 3
direction = "output"
content_type = "OctetStream"

# Raw byte stream to the standby worker.
[[ports]]
name = "data2_out"
index = 4
direction = "output"
content_type = "OctetStream"

[[resources]]
requires_contract = "channel"
access = "read"

# Module-scope observability — exempt.
[observability]
exempt = "application-layer demo — byte throughput is observed at the foundation transport (ip/quic/http) it rides"
