version = "1.0.0"
hardware_targets = ["bcm2712"]

# `after_ms` holds the probe until that long after boot (wall clock).
timer_class = "wall_clock"

# Resumable after a fault: a GET opens and closes its handle in one step, so
# the probe holds no provider handle across steps, and every request it makes
# is rebuilt from its state -- a write the store had not decided is asked
# again with the same bytes, which the store recognises. A subscription does
# not survive a restart (the restart releases the event it rings), so the
# attestation holds only for an instance with `subscribe: 0`: its demand is
# counted from that param below, and the composer refuses
# `fault_policy: restart` to an instance that subscribes.
resume_after_fault = true

# The store, on the board. Both contracts, because the point of the probe is
# that a store-backed graph has BOTH: `storage.object` for the keyed bytes and
# `storage.namespace` for the prefix walk and the change subscription that
# wakes a source.
[[resources]]
requires_contract = "storage.object"
access = "write"

[[resources]]
requires_contract = "storage.namespace"
access = "write"

# The subscription rings the probe's own kernel event: the store writes no
# channel of the probe's, so no port receives it.
[[resources]]
requires_contract = "event"
access = "write"

[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 8192

[observability]
exempt = "store contract probe; its '[stp]' heartbeat is the observable, consumed by the rig scenario's pass rules"

# One store subscription and the kernel event it rings, while `subscribe`
# (tag 5, default 1) is set; none with `subscribe: 0`.
[capacities]
demand_from_params = [
  { pool = "store_subs", tags = [5] },
  { pool = "events", tags = [5] },
]
