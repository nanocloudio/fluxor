version = "1.0.0"
hardware_targets = ["rp2040", "rp2350", "bcm2712", "linux", "wasm", "uefi"]
timer_class = "agnostic"

# A draw list with nothing behind it: one stream of one static frame on
# `draw` (`abi::contracts::video_draw`), for a rasteriser or a panel driver
# under test. The frame is an opaque background over the whole surface, a
# rounded rectangle, and a run of 32 glyphs from an a8 strike the module
# makes up and defines in the stream.
#
# ─── Parameters (TLV) ──────────────────────────────────────────────────
# | Tag | Name   | Type | Default | Description |
# |-----|--------|------|---------|-------------|
# | 1   | width  | u16  | 480     | The surface's width. |
# | 2   | height | u16  | 480     | The surface's height. |

[[ports]]
name = "draw"
direction = "output"
content_type = "VideoDraw"
required = true
[ports.facts]
ops = ["fill_rect", "fill_rrect", "glyphs"]
glyph_formats = ["a8"]
max_depth = 0
max_resources = 1
resource_bytes = 1024
frame_bytes = 512
damage = ["full"]
atomic = ["no"]

[observability]
exempt = "a fixture — it sends one fixed frame and rests"
