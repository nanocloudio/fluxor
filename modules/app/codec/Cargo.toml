[workspace]

[package]
name = "fluxor-mod-codec"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Unified audio + image decoder — host-test build"

# Bare-metal PIC builds use `rustc` directly against `mod.rs` and ignore
# this file; Cargo only sees it during host-test builds where the test
# harness links the module as a plain rlib. Same additive-only pattern
# as `modules/foundation/{ip,http,ws_stream}/Cargo.toml`.

[lib]
path = "mod.rs"
crate-type = ["rlib"]

# Feature set mirrors the manifest's [[variant]] features (RFC
# module_variants). PIC builds get these as raw `--cfg feature="…"`
# flags from `fluxor modules build`; Cargo host builds enable the full
# set by default so the host-test harness sees every sub-codec.
[features]
default = ["wav", "mp3", "aac", "image", "h264"]
host-test = []
wav = []
mp3 = []
aac = []
image = []
h264 = []

[dependencies]
fluxor = { path = "../../..", default-features = false, features = ["host-linux"], optional = true }
