version = "1.0.0"
hardware_targets = ["rp2350"]

[[ports]]
name = "audio"
direction = "input"
content_type = "AudioSample"
required = true

[[ports]]
name = "mixed"
direction = "output"
content_type = "AudioSample"
required = true
# Output: 2048 bytes (256 stereo frames × 4 bytes). max_record omitted:
# a single write is bounded by that tick's input read (up to the 8 KiB
# staging buf), not by a tighter constant.
buffer_size = 2048

[[ports]]
name = "control"
direction = "ctrl_input"
content_type = "InputEvent"

# Module-scope observability — exempt (see standards/observability.md §6).
[observability]
exempt = "audio/media-sample path — meaningful throughput is sample-rate (Hz·channels), not byte count; off-device bytes are observed at the network transport"
