version = "1.0.0"
hardware_targets = ["rp2350", "rp2040"]
permissions = ["platform_raw"]

# The stream buffers at their small-die sizes, for a graph that streams
# nothing at audio rate: a radio's gSPI bus uses the command slots alone.
[[variant]]
name     = "full"
features = []
default  = true

[[variant]]
name     = "small_stream"
features = ["small_stream"]

# pio_rp uses both DMA families:
#   - platform_dma: raw channels for CMD blocking transfers.
#   - platform_dma_fd: async fds for streaming workloads.
[[resources]]
requires_contract = "platform_dma"
access = "exclusive"

[[resources]]
requires_contract = "platform_dma_fd"
access = "exclusive"
