version = "1.0.0"
hardware_targets = ["bcm2712"]
# Cadence-independent NIC driver: moves frames in/out, no tick-based timekeeping.
# Explicit attestation so it may run on a mechanism-(b) domain: an absent
# declaration is treated as unattested and is blocked there.
timer_class = "agnostic"

# Opt rp1_gem into its domain's pre-pass: the scheduler runs
# every module carrying this flag once at the start of each pass, ahead
# of the exec_order rotation, and charges the time against the combined
# pre-pass budget. The NIC driver's TX/RX
# step is the critical-latency path for HTTPS keepalive throughput;
# running it once at the *start* of every scheduler pass (rather
# than at its `exec_order` slot) shortens the RX-to-input-channel
# hop by ~one full pass, attacking the 797 µs fixed per-request
# overhead measured at [[body_size_scaling]]. Step time is bounded
# (~1 µs in current builds) so it fits comfortably under the
# combined pre-pass budget (`PRE_PASS_BUDGET_SHARE` of the domain tick).
pre_pass = true

# `net_tx_drain` is served on `frames_tx` to the stack wired there: a fence
# learns from it when the wire is quiet.
provider_contracts = ["net_tx_drain"]

[[ports]]
name = "frames_tx"
direction = "input"
content_type = "EthernetFrame"
serves = "net_tx_drain"
buffer_size = 8192

[[ports]]
name = "frames_rx"
direction = "output"
content_type = "EthernetFrame"
required = true
buffer_size = 8192
max_record = 1514

[[resources]]
requires_contract = "platform_nic_ring"
access = "exclusive"

# Module-scope observability — exempt.
[observability]
exempt = "L2 frame DMA shim — wire-byte throughput is observed at the ip module that consumes/produces these frames"
