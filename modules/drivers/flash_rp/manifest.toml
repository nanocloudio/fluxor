version = "1.0.0"
type = "EventHandler"
hardware_targets = ["rp2350", "rp2040"]
grants = ["flash", "lend.borrow"]
# `store` (out[2]) is a `storage.block` source over the flash's data store.
# `stream` (out[1]) serves `stream_select`: its consumer picks the blob.
provides = ["storage.block"]
provider_contracts = ["runtime_params", "storage.block", "stream_select"]
deferred_ready = true

# BOOTSEL button driver — reads the QSPI CS pin via the flash
# sideband, debounces, and emits the canonical `input::button` raw
# transition contract on `raw` (out[0]). Same wire shape
# `modules/foundation/button` produces for GPIO pins; downstream
# `gesture` does click counting and FMP mapping.
[[ports]]
name = "raw"
direction = "output"
content_type = "OctetStream"
# Button raw transitions (1 byte each).
buffer_size = 64
max_record = 1

# Blob serving / asset bank source — flash-resident preset blobs
# served on demand: the consumer selects one by index (`stream_select`).
# Used by waveshare image_viewer
# bare-metal builds where the gallery is baked into flash.
[[ports]]
name = "stream"
index = 1
direction = "output"
content_type = "OctetStream"
serves = "stream_select"
# Blob stream.
buffer_size = 2048
# BLOB_CHUNK_SIZE — blobs are emitted in 512-byte chunks.
max_record = 512

# The data store: `storage.block` over the 16 KiB directly below the
# parameter store (`flash_layout::DATA_STORE_SIZE`), in erase-sector blocks.
# A UF2 reflash never reaches it. A `key_vault` keeps its record image there.
[[ports]]
name = "store"
index = 2
direction = "output"
content_type = "OctetStream"
serves = "storage.block"

# Module-scope observability — exempt.
[observability]
exempt = "block-storage driver — block I/O is observed at the fs/bank layer above it"
