version = "1.0.0"
hardware_targets = ["rp2350"]
permissions = ["platform_raw"]
# DSI/PIO panel scanout: paced sink, owns the display refresh timeline so
# it qualifies as a `presentation.clock` for solo display groups.
capabilities = ["video.raster", "video.scanout", "display.scanout", "presentation.clock"]

[[ports]]
name = "pixels"
direction = "input"
content_type = "VideoRaster"
required = false
buffer_size = 4096

[[resources]]
requires_contract = "gpio"
access = "write"

[[resources]]
requires_contract = "pio"
access = "exclusive"

[[resources]]
requires_contract = "timer"
access = "write"

# Its channels are allocated from the platform's pool, so the claim is
# shared with every other DMA user in the graph.
[[resources]]
requires_contract = "platform_dma_fd"
access = "write"

# Module-scope observability — exempt.
[observability]
exempt = "display scanout — frame/refresh rate is the domain metric, not byte throughput"
