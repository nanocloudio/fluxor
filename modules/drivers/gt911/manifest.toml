version = "1.0.0"
hardware_targets = ["rp2350"]

[[ports]]
name = "touch"
direction = "output"
content_type = "InputEvent"
required = true
buffer_size = 256
# size_of::<TouchEvent>() — one event record per write.
max_record = 8

[[resources]]
requires_contract = "i2c"
access = "exclusive"

[[resources]]
requires_contract = "gpio"
access = "write"

[[resources]]
requires_contract = "event"
access = "write"

[[resources]]
requires_contract = "timer"
access = "write"

# Module-scope observability — exempt (see standards/observability.md §6).
[observability]
exempt = "human-input device — event-rate is the domain metric, not byte throughput"
