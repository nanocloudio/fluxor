version = "0.2.0"
hardware_targets = ["bcm2712", "uefi"]
grants = ["metal_device.pcie", "metal_device.dma", "lend.borrow"]
# Controller/admin/I/O timeouts, link rescans, heartbeat, and telemetry cadence
# all use dev_millis. The step counter is observational only.
timer_class = "wall_clock"

# Provided storage surface (storage_capability_surface.md §1): raw block
# I/O at the namespace's logical block size (512 B to 4 KiB). Free-form
# provider capability string; tools-only, never serialized to the .fmod.
provides = ["storage.block"]
# `storage.block` is served on `blocks` to the consumer wired there.
provider_contracts = ["storage.block"]
deferred_ready = true

# Bind the NVMe controller via the PCIE_DEVICE contract. The driver
# supplies a selector (alias string or `@class=nvme`) at module_new
# time; the kernel resolves it against the board's PCIe alias table
# and returns a handle carrying the per-device context for subsequent
# BAR / config-space / MSI-X calls.
[[resources]]
requires_contract = "pcie_device"
access = "exclusive"

# Block I/O request channel (from fat32 or equivalent).
[[ports]]
name = "requests"
direction = "input"
content_type = "OctetStream"

# Block data output — same contract as sd.blocks, so fat32 consumes it.
[[ports]]
name = "blocks"
direction = "output"
content_type = "OctetStream"
serves = "storage.block"

# Module-scope observability — exempt.
[observability]
exempt = "block-storage driver — block I/O is observed at the fs/bank layer above it"

# Device registers, DMA memory and cache maintenance.
[[resources]]
requires_contract = "metal_device"
access = "write"
