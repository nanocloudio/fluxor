version = "1.0.0"
hardware_targets = ["wasm"]
builtin = true

# Browser-side semantic-action source. Drains a host-side queue the
# presentation-shell overlay (`browser_overlay_runtime.js`) fills when
# the user activates a control, and emits each control's action-id hash
# **unchanged** as the FMP command type on `commands`. The action id is
# application-chosen (e.g. `next`/`prev`/`toggle` to drive `bank`, or any
# app-specific verb); this module carries no vocabulary of its own — the
# consumer matches the hash and decides what it means.
#
# This is the action-channel peer of `wasm_browser_button`: where that
# emits raw button transitions for `gesture` to click-count, this is a
# pure conduit for pre-hashed semantic actions, so overlay controls drive
# `bank` (or any FMP consumer) end-to-end without Fluxor translating an
# application vocabulary. See `contracts/input/action.rs` for the wire.

[[ports]]
name = "commands"
direction = "output"
content_type = "FmpMessage"
required = true

[commands]
# App-chosen action-id hashes, passed through unchanged; the generic
# selector verbs below are the common case (`bank` matches these).
emits = ["next", "prev", "toggle"]

# Module-scope observability — exempt (see standards/observability.md §6).
[observability]
exempt = "browser-API shim (wasm) — observed via browser devtools; bridges user-activated overlay controls into FMP commands, not a measurable on-device byte stream"
