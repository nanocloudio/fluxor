version = "1.0.0"
hardware_targets = ["linux"]
builtin = true

# Host argv + stdin source (rfc_cli_execution.md §4.1). argv is one record —
# everything after `--` in the process's own argv, NUL-separated. stdin bytes
# stream on stdin_out; the module returns Done at EOF once fully forwarded.
[[ports]]
name = "args_out"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "stdin_out"
index = 1
direction = "output"
content_type = "OctetStream"

[observability]
exempt = "host stdio surface — runs on the build host, observed via host tooling, not part of the on-silicon data path"
