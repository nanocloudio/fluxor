version = "1.0.0"
hardware_targets = ["wasm"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: its
# heap-seated instance record. `fluxor abi-regen` emits it as `STATE_BYTES`,
# which the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1

# Browser accessibility mirror. An application that draws its own controls
# into a raster publishes an accessibility tree; this module mirrors it into
# the page, so assistive technology reaches the drawn controls as ordinary
# DOM, and reports back what assistive technology and the platform's text
# machinery did.
#
# `tree` takes `AccessibilityTree` records
# (`abi::contracts::accessibility`). Every batch is checked here before the
# page is touched: a batch with a node whose parent is not in the tree, a
# cycle, more nodes than `max_nodes`, or any record the contract refuses is
# dropped whole, the page keeps the tree it shows, and the module sends
# `RESYNC` on `actions`. A checked batch is applied to the page as one
# change.
#
# `actions` carries `AccessibilityActions` records: a press, a focus move or
# a value assistive technology set on a mirrored control, and `RESYNC`.
# Keyboard keys are never actions; they reach the application as key
# records.
#
# `text` carries `TextEvents` records (`abi::contracts::input::text`) from
# the mirror's text fields: committed text, a composition in progress, a
# deletion, a moved selection, each naming the node being edited. A key
# whose effect arrives here is flagged `KEY_TEXT` on
# `wasm_browser_keyboard`'s output. With `tree` unwired the module keeps one
# text field over the surface and its records name no node.
#
# The application's names, values and descriptions are placed in the page's
# DOM, where the browser's extensions can read them; that is what makes
# them reachable. A secret node carries no value and none enters the page.

[[ports]]
name = "tree"
direction = "input"
content_type = "AccessibilityTree"
required = false
# The largest tree the mirror holds.
[ports.facts]
max_nodes = 1024

[[ports]]
name = "actions"
direction = "output"
content_type = "AccessibilityActions"
required = false

[[ports]]
name = "text"
direction = "output"
content_type = "TextEvents"
required = false

# Module-scope observability — exempt.
[observability]
exempt = "browser-API shim (wasm) — observed via browser devtools; carries accessibility records and text edits to and from the page DOM, not a measurable on-device byte stream"

[capacities]
# The module heap the kernel seats for an instance, from the state arena:
# its instance (one tree record of the largest size, one text record, one
# text edit) and the two tables of the tree check at `max_nodes` entries
# each. `fluxor abi-regen` emits it as `HEAP_SEAT`, which the kernel seats by
# and the build charges by (`fluxor_contracts::state_arena::heap_seat_bytes`).
heap_seat = 37888
