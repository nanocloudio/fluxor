version = "1.0.0"
hardware_targets = ["wasm"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: its
# heap-seated instance record. `fluxor abi-regen` emits it as `STATE_BYTES`,
# which the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1

# Browser canvas raster sink. Consumes `VideoRaster` records on the
# input port and presents them on a `<canvas>` element through the
# host shim's `host_canvas_present` import.
#
# Every record is a region header (`abi::contracts::video_raster`) and
# that region's pixels, in RGB565 or RGBA8 as the header says. The
# stream states its surface: `width` and `height` are the largest
# surface the canvas accepts and size its buffer; the canvas takes the
# extent of the surface in the stream. A frame's regions are shown
# together at its last one. A damage frame changes only its regions,
# and the rest of the canvas keeps its picture.

# The capabilities of a paced raster present surface, as `linux_display`
# declares them: the `display` platform stack resolves a wasm variant, and
# a graph that sends pixels to `display.pixels` builds for either.
capabilities = ["video.raster", "display.scanout", "presentation.clock"]

# The sink port `pixels`, named as `linux_display.pixels` is, so
# `<producer>.pixels -> display.pixels` resolves on every target whose
# display takes pixels. The kernel resolves this native module's input by
# port index.
[[ports]]
name = "pixels"
direction = "input"
content_type = "VideoRaster"
required = true
# What the canvas takes: both raster formats, and frames whose regions
# update the retained picture as well as frames that tile the surface.
[ports.facts]
formats = ["rgb565", "rgba8"]
regions = ["damage", "bands"]

[[params]]
name = "width"
tag = 10
type = "u16"
required = true

[[params]]
name = "height"
tag = 11
type = "u16"
required = true

# Module-scope observability — exempt.
[observability]
exempt = "browser-API shim (wasm) — observed via browser devtools; carries input events / media samples / canvas rasters / WS frames, not a measurable on-device byte stream"

[capacities]
# The module heap the kernel seats for an instance, from the state arena:
# its instance, and a region buffer of 4 bytes per pixel of `width` x `height`
# (a whole surface in the widest format). `fluxor abi-regen` emits it as
# `HEAP_SEAT`, which the kernel seats by and the build charges by
# (`fluxor_contracts::state_arena::heap_seat_bytes`).
heap_seat = 296
heap_seat_per_pixel = 4
