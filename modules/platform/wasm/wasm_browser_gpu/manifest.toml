version = "1.0.0"
hardware_targets = ["wasm"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: its
# heap-seated instance record. `fluxor abi-regen` emits it as `STATE_BYTES`,
# which the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1

# WebGPU rendering backend. Consumes GPU draw commands on the input
# port and renders to a `<canvas>` element using WebGPU through the
# host shim's `host_gpu_raster_*` imports.
#
# Command format: binary-encoded FRAME_BEGIN, SET_UNIFORMS,
# UPLOAD_VERTICES, DRAW, FRAME_END opcodes.

capabilities = ["gpu.render", "display.scanout"]

[[ports]]
name = "commands"
direction = "input"
content_type = "OctetStream"
required = true

[[params]]
name = "width"
tag = 10
type = "u16"
required = false
default = 800

[[params]]
name = "height"
tag = 11
type = "u16"
required = false
default = 600

[observability]
exempt = "browser-API shim (wasm) — observed via browser devtools"

[capacities]
# The module heap the kernel seats for an instance, from the state arena:
# its instance, as the kernel lays it out on wasm32. `fluxor abi-regen` emits it as
# `HEAP_SEAT`, which the kernel seats by and the build charges by
# (`fluxor_contracts::state_arena::heap_seat_bytes`).
heap_seat = 65836
