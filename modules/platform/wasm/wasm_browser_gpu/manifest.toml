version = "1.0.0"
hardware_targets = ["wasm"]
builtin = true

# WebGPU rendering backend. Consumes GPU draw commands on the input
# port and renders to a `<canvas>` element using WebGPU through the
# host shim's `host_gpu_raster_*` imports.
#
# Command format: binary-encoded FRAME_BEGIN, SET_UNIFORMS,
# UPLOAD_VERTICES, DRAW, FRAME_END opcodes.

capabilities = ["gpu.render", "display.scanout"]

[[ports]]
name = "commands"
direction = "input"
content_type = "OctetStream"
required = true

[[params]]
name = "width"
tag = 10
type = "u16"
required = false
default = 800

[[params]]
name = "height"
tag = 11
type = "u16"
required = false
default = 600

[observability]
exempt = "browser-API shim (wasm) — observed via browser devtools"
