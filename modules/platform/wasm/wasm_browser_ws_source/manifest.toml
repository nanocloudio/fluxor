version = "1.0.0"
hardware_targets = ["wasm"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: its
# heap-seated instance record. `fluxor abi-regen` emits it as `STATE_BYTES`,
# which the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1

# Browser-side WebSocket source. Opens a WS to the configured URL,
# pulls binary messages via the `host_ws_*` shim, and forwards the
# bytes on the `bytes` output port as a `VideoRaster` stream.
#
# This is the thin half of the split-deployment image-viewer
# pipeline:
#
#   pi5: bank → host_image_codec → ws_stream → http(/ws)
#                                                |    ↓ WS BINARY frames
#   wasm:                              ws_source → wasm_browser_canvas
#
# `wasm_browser_canvas` accumulates raw bytes into a `width*height*2`
# RGB565 buffer and presents each completed frame; the wire shape on
# this edge is the same as `wasm_browser_image_codec → canvas` in the
# pure-wasm graph, so the canvas module doesn't care where the bytes
# came from.
#
# Relative URLs (`url: /ws`) are resolved against the page's origin
# by the host shim, so the same graph works from any port / host
# combination — the scenario synthesiser doesn't need to template
# the URL.

[[params]]
name = "url"
tag = 10
type = "string"
required = true

[[ports]]
name = "bytes"
direction = "output"
content_type = "VideoRaster"
required = true

# Module-scope observability — exempt.
[observability]
exempt = "browser-API shim (wasm) — observed via browser devtools; carries input events / media samples / canvas rasters / WS frames, not a measurable on-device byte stream"

[capacities]
# The module heap the kernel seats for an instance, from the state arena:
# its instance, as the kernel lays it out on wasm32. `fluxor abi-regen` emits it as
# `HEAP_SEAT`, which the kernel seats by and the build charges by
# (`fluxor_contracts::state_arena::heap_seat_bytes`).
heap_seat = 65844
