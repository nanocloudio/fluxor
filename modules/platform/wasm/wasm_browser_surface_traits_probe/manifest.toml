version = "1.0.0"
hardware_targets = ["wasm"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: its
# heap-seated instance record. `fluxor abi-regen` emits it as `STATE_BYTES`,
# which the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1

# Demo consumer of the Surface Traits surface. Reads
# `input::surface_traits::MSG_TRAITS` records from its input port and
# logs the decoded fields (viewport / orientation / size class / modalities /
# epoch) to the kernel log ring, so the full round-trip is observable in
# the DOM terminal: browser publisher → host queue → wasm_browser_surface_traits
# → channel → this probe. Not a production module — it is the live check that
# the surface works end to end. Resize / rotate the window and watch the
# records flow.

[[ports]]
name = "events"
direction = "input"
content_type = "SurfaceTraits"
required = true

# Module-scope observability — exempt.
[observability]
exempt = "browser-API demo probe (wasm) — logs decoded surface-state to the kernel log ring, not a measurable on-device byte stream"

[capacities]
# The module heap the kernel seats for an instance, from the state arena:
# its instance, as the kernel lays it out on wasm32. `fluxor abi-regen` emits it as
# `HEAP_SEAT`, which the kernel seats by and the build charges by
# (`fluxor_contracts::state_arena::heap_seat_bytes`).
heap_seat = 60
