version = "1.0.0"
hardware_targets = ["wasm"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: its
# heap-seated instance record. `fluxor abi-regen` emits it as `STATE_BYTES`,
# which the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1
capabilities = ["midi.input"]

# Browser MIDI input source. Subscribes to the Web MIDI API
# (`navigator.requestMIDIAccess`) via the host shim, decodes the
# raw status byte into the pre-decoded form used by Fluxor's
# `input::midi` contract, and emits 4-byte channel-voice frames
# on the output port. Used by the `midi` platform stack
# (stacks/midi.toml) to resolve `platform.midi: {direction: in}`
# on wasm targets.

[[ports]]
name = "events"
direction = "output"
content_type = "MidiEvents"
required = true

[[params]]
name = "port_filter"
tag = 10
type = "str"
default = ""

[[params]]
name = "sysex"
tag = 11
type = "enum"
values = ["off", "on"]
default = "off"

# Module-scope observability — exempt.
[observability]
exempt = "browser-API shim (wasm) — observed via browser devtools; carries input events / media samples / canvas rasters / WS frames, not a measurable on-device byte stream"

[capacities]
# The module heap the kernel seats for an instance, from the state arena:
# its instance, as the kernel lays it out on wasm32. `fluxor abi-regen` emits it as
# `HEAP_SEAT`, which the kernel seats by and the build charges by
# (`fluxor_contracts::state_arena::heap_seat_bytes`).
heap_seat = 33
