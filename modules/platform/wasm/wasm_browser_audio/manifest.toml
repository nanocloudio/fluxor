version = "1.0.0"
hardware_targets = ["wasm"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: its
# heap-seated instance record. `fluxor abi-regen` emits it as `STATE_BYTES`,
# which the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1

# Truthful AV capabilities, parallel to `linux_audio` / `i2s_pio`: a PCM
# sample sink with a presentation clock. Lets the `audio` platform stack resolve a wasm variant and
# lets cross-target graph-shape checks treat all PCM sinks alike.
capabilities = ["audio.sample", "presentation.clock"]

# Browser audio sink. Consumes `AudioSample` (signed 16-bit PCM)
# blocks on the input port and forwards them to the host shim's
# `host_audio_play` import, which schedules playback through
# WebAudio.
#
# Wire format: signed 16-bit interleaved PCM at the configured
# sample rate. The shim handles WebAudio context unlock (user
# gesture required) and i16 → f32 conversion.

[[ports]]
# Named `audio` for cross-platform consistency — same port name as
# `linux_audio.audio`, `i2s_pio.audio`, and `mixer.audio`. Any
# upstream `codec.audio` (or `mixer.mixed`) drops in unchanged.
name = "audio"
direction = "input"
content_type = "AudioSample"
required = true

[[params]]
name = "sample_rate"
tag = 10
type = "u32"
required = true

[[params]]
name = "channels"
tag = 11
type = "u8"
default = 1

[[params]]
# Ring lead target in milliseconds: the sink forwards PCM only while
# the WebAudio queue is shorter than this, so it bounds output
# latency AND is the jank cushion. Codec playback wants the deep
# default; live instruments (grove studio) set 30-50 ms.
name = "lead_ms"
tag = 12
type = "u8"
default = 120

# Module-scope observability — exempt.
[observability]
exempt = "browser-API shim (wasm) — observed via browser devtools; carries input events / media samples / canvas rasters / WS frames, not a measurable on-device byte stream"

[capacities]
# The module heap the kernel seats for an instance, from the state arena:
# its instance, as the kernel lays it out on wasm32. `fluxor abi-regen` emits it as
# `HEAP_SEAT`, which the kernel seats by and the build charges by
# (`fluxor_contracts::state_arena::heap_seat_bytes`).
heap_seat = 4152
