version = "1.0.0"
hardware_targets = ["wasm"]
builtin = true

# Generic GPU provider on WebGPU.
#
# Same contract, same shared cores and same lifetime corpus as the `gpu_replay`
# and `linux_gpu` providers: admission, opaque generational handles, bounded
# views, immutable sealing, residency, dependency-ordered fences,
# candidate-output commit, cancellation, drain and device epochs are all
# `modules/sdk/cores/gpu_*.rs`. Only the device objects behind the slot numbers
# differ.
#
# It draws from the page's ONE adapter and device, shared with the raster shim.
# WebGPU resources belong to the device that created them, so a second device
# would be a disjoint resource world: a compute output could not be bound as
# raster geometry without a CPU round trip at every hand-off.
#
# Nothing here blocks: adapter acquisition, pipeline compilation, submission
# completion and buffer mapping are polled across steps, because a cooperative
# step cannot wait for a driver and a synchronous pipeline create would stall
# the shared device's whole timeline behind one compile.

capabilities = ["gpu.compute"]

[capability_facts."gpu.compute"]
backend  = "webgpu"
readback = "yes"
# No device-resident surface is handed to a sink from here: presenting without
# a readback is the raster half's work, and this provider is the compute half.
# Declaring otherwise would be a capability nothing honours.
shared_surface = "no"

[[ports]]
name = "commands"
direction = "input"
content_type = "GpuCommand"
required = true

[[ports]]
name = "outcomes"
direction = "output"
content_type = "GpuOutcome"
required = true

[observability]
exempt = "browser-API shim (wasm) — the provider's facts are its outcome records, and the device side is observed via browser devtools"
