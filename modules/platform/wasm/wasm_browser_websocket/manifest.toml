version = "1.0.0"
hardware_targets = ["wasm"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: its
# heap-seated instance record. `fluxor abi-regen` emits it as `STATE_BYTES`,
# which the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1

# Browser WebSocket client. Connects to a configured WS URL on the
# host page; pumps bytes from the input channel out to the WS, and
# bytes received from the WS into the output channel.
#
# This is the transport carrier for the "browser tab joins a larger
# Fluxor graph via remote channels" deployment shape. The actual
# remote-channel framing (which channel a byte stream belongs to,
# multi-channel multiplexing) is a separate module that uses this as
# its underlying transport — same pattern as `tls` over `net_proto`.

[[ports]]
name = "tx"
direction = "input"
content_type = "OctetStream"
required = true

[[ports]]
name = "rx"
direction = "output"
content_type = "OctetStream"
required = true

[[params]]
name = "url"
tag = 10
type = "str"
required = true

# Module-scope observability — exempt.
[observability]
exempt = "browser-API shim (wasm) — observed via browser devtools; carries input events / media samples / canvas rasters / WS frames, not a measurable on-device byte stream"

[capacities]
# The module heap the kernel seats for an instance, from the state arena:
# its instance, as the kernel lays it out on wasm32. `fluxor abi-regen` emits it as
# `HEAP_SEAT`, which the kernel seats by and the build charges by
# (`fluxor_contracts::state_arena::heap_seat_bytes`).
heap_seat = 8508
