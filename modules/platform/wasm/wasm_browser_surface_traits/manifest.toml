version = "1.0.0"
hardware_targets = ["wasm"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: its
# heap-seated instance record. `fluxor abi-regen` emits it as `STATE_BYTES`,
# which the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1

# Browser surface-traits authority. The host runtime publisher
# (FluxorOverlay.installSurfaceTraits) coalesces resize / visualViewport /
# pointer-class / gamepad connect-disconnect / audio changes to at most one
# record per animation frame; this built-in drains that queue via
# `host_surface_traits_pop` and emits 24-byte
# `input::surface_traits::MSG_TRAITS` records on the output port.
#
# It is the browser implementation of the runtime environment plane.
# A module that wants to adapt to its surface (viewport / orientation /
# size class / input modalities / audio) wires an input port to this
# output and reacts per record; a module that ignores it keeps
# static-config behaviour, so the surface is purely additive. Linux and
# bare-metal panels publish the same wire shape from their own
# authorities.

[[ports]]
name = "events"
direction = "output"
content_type = "SurfaceTraits"
required = true

# Module-scope observability — exempt.
[observability]
exempt = "browser-API shim (wasm) — observed via browser devtools; carries surface-state snapshots, not a measurable on-device byte stream"

[capacities]
# The module heap the kernel seats for an instance, from the state arena:
# its instance, as the kernel lays it out on wasm32. `fluxor abi-regen` emits it as
# `HEAP_SEAT`, which the kernel seats by and the build charges by
# (`fluxor_contracts::state_arena::heap_seat_bytes`).
heap_seat = 64
