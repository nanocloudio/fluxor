version = "1.0.0"
hardware_targets = ["wasm"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: its
# heap-seated instance record. `fluxor abi-regen` emits it as `STATE_BYTES`,
# which the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1

# Browser pointer input source. Subscribes to DOM PointerEvents on
# the host page (mouse, touch, stylus unified) and emits
# `input::pointer::MSG_EVENT` records on the output port. Multi-
# pointer is supported: each contact has its own pointer_id; the
# host shim multiplexes them into a single event stream.
#
# Used by the `pointer` platform stack (stacks/pointer.toml) to
# resolve `platform.pointer: {}` on wasm targets. A pointer-to-gamepad
# overlay such as `wasm_browser_touch_gamepad_overlay` consumes this
# port to render virtual DPAD/button widgets driven by touch.

[[ports]]
name = "events"
direction = "output"
content_type = "PointerEvents"
required = true

# Module-scope observability — exempt.
[observability]
exempt = "browser-API shim (wasm) — observed via browser devtools; carries input events / media samples / canvas rasters / WS frames, not a measurable on-device byte stream"

[capacities]
# The module heap the kernel seats for an instance, from the state arena:
# its instance, as the kernel lays it out on wasm32. `fluxor abi-regen` emits it as
# `HEAP_SEAT`, which the kernel seats by and the build charges by
# (`fluxor_contracts::state_arena::heap_seat_bytes`).
heap_seat = 52
