version = "1.0.0"
hardware_targets = ["wasm"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: its
# heap-seated instance record. `fluxor abi-regen` emits it as `STATE_BYTES`,
# which the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1

# Browser camera source. Starts getUserMedia lazily and emits grayscale frames,
# framed as `[w:u16 LE][h:u16 LE][luma w*h]`, on the output port — the format the
# qr_scan module reassembles. getUserMedia is the browser's only camera API, so
# capture is JS (the host shim's `host_camera_frame` import); the QR decode is the
# qr_scan module in the graph, not JS.

[[ports]]
name = "frames"
direction = "output"
content_type = "OctetStream"
required = true

# Module-scope observability — exempt.
[observability]
exempt = "browser-API shim (wasm) — observed via browser devtools; carries media samples, not a measurable on-device byte stream"

[capacities]
# The module heap the kernel seats for an instance, from the state arena:
# its instance, as the kernel lays it out on wasm32. `fluxor abi-regen` emits it as
# `HEAP_SEAT`, which the kernel seats by and the build charges by
# (`fluxor_contracts::state_arena::heap_seat_bytes`).
heap_seat = 40084
