version = "1.0.0"
hardware_targets = ["wasm"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: its
# heap-seated instance record. `fluxor abi-regen` emits it as `STATE_BYTES`,
# which the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1

# Browser image decoder. Reads an entire encoded image (JPEG, PNG,
# WebP, BMP, GIF — whatever the browser's createImageBitmap can
# decode) from `encoded`, hands it to the host shim's
# `host_image_decode_*` imports, and emits it on `pixels` as one
# `VideoRaster` record: a region header
# (`abi::contracts::video_raster`) covering the configured
# width x height surface, then its RGB565 little-endian pixels.
#
# Browser-side decode delegates to `createImageBitmap` + an
# `OffscreenCanvas` for the resize/RGB565 conversion; the kernel
# never sees the encoded bytes' interior. This is the wasm-browser
# analogue of `host_image_codec` on the linux host (which uses the
# `image` crate) — different host, same surface contract.
#
# The `pixels` port matches `wasm_browser_canvas`'s input, so
# wiring source → codec → canvas is a trivial 2-edge graph.

[[ports]]
name = "encoded"
direction = "input"
content_type = "OctetStream"
required = true

[[ports]]
name = "pixels"
direction = "output"
content_type = "VideoRaster"
required = true
# What the codec sends: RGB565, each image the whole surface in one region.
[ports.facts]
formats = ["rgb565"]
regions = ["bands"]

[[params]]
# tag 10 — matches wasm_browser_canvas's `width` for symmetry.
name = "width"
tag = 10
type = "u16"
required = true

[[params]]
# tag 11 — matches wasm_browser_canvas's `height` for symmetry.
name = "height"
tag = 11
type = "u16"
required = true

[[params]]
# tag 12 — encoded ingest cap. Larger than host_image_codec's
# default to handle the test-harness 6.2 MB top-down BMP.
name = "max_bytes"
tag = 12
type = "u32"
default = 16777216
range = [1024, 67108864]

# Module-scope observability — exempt.
[observability]
exempt = "browser-API shim (wasm) — observed via browser devtools; carries input events / media samples / canvas rasters / WS frames, not a measurable on-device byte stream"

[capacities]
# The module heap the kernel seats for an instance, from the state arena:
# its instance, and the bytes `max_bytes` (tag 12) states. `fluxor abi-regen` emits it as
# `HEAP_SEAT`, which the kernel seats by and the build charges by
# (`fluxor_contracts::state_arena::heap_seat_bytes`).
heap_seat = 4396
heap_seat_param = 12
