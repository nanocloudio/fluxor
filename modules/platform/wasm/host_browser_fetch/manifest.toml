version = "1.0.0"
hardware_targets = ["wasm"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: its
# heap-seated instance record. `fluxor abi-regen` emits it as `STATE_BYTES`,
# which the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1

# Browser HTTP fetch source. Opens the configured URL on first
# step (via the host shim's `host_fetch_open` import), then drains
# the response body as it arrives and emits the bytes on the
# `bytes` output port. On EOF the shim returns -1; the module
# ends the stream (`channel::SET_HUP`) so downstream consumers
# (e.g. `media_loader.rom`) can finalise.
#
# Used in the WASM browser-host deployment as the analogue of
# `host_asset_source` on Linux: a way to bind external static
# assets (ROMs, snapshots, image data) into a graph without baking
# them into the bundle.

[[ports]]
name = "bytes"
direction = "output"
content_type = "OctetStream"
required = true

[[params]]
name = "url"
tag = 10
type = "str"
required = true

# Module-scope observability — exempt.
[observability]
exempt = "host-side dev/test provider — runs on the build host, observed via host tooling, not part of the on-silicon data path"

[capacities]
# The module heap the kernel seats for an instance, from the state arena:
# its instance, as the kernel lays it out on wasm32. `fluxor abi-regen` emits it as
# `HEAP_SEAT`, which the kernel seats by and the build charges by
# (`fluxor_contracts::state_arena::heap_seat_bytes`).
heap_seat = 4408
