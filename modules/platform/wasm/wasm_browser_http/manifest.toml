version = "1.0.0"
hardware_targets = ["wasm"]
builtin = true

# The browser as an HTTP exchange provider: the page's `fetch()` behind the
# exchange contract (`modules/sdk/contracts/exchange.rs`). Request records
# arrive on `request_in`; each request is collected whole, performed, and
# answered on `response_out` under its own exchange id — a response HEAD with
# the status, the content type, the other response header fields and the first
# body bytes, then BODY records as the rest arrives, as far as the requester's
# credit reaches. The same records, ports and statuses a socket-backed HTTP
# client offers, so a requester moves between the two by wiring alone.
#
# A request's target is a path; `origin` names where. A target carrying its
# own scheme or host is refused (400), so a program cannot reach a server the
# graph did not name. The browser's cross-origin policy is the enforcement
# behind that: a fetch the page may not make fails, and a fetch that fails
# before the response head is answered 502; after it, the exchange is aborted.
# Redirects are followed, as the page's own fetches are; a requester sees the
# final response.
#
# One exchange is performed at a time, with one more collected behind it; a
# request arriving past that is answered 503. A graph that wants concurrency
# instantiates more of these, which is also how it gets more connections.

capabilities = ["stream.ordered_ack.exchange"]

[capability_facts."stream.ordered_ack.exchange"]
# A 2xx means the origin accepted the request, not that anything was made
# durable — HTTP has no durability contract to offer.
ack         = "transport"
# One request performed at a time, so ordering is trivially preserved: there
# is never a second exchange in flight to reorder against.
ordering    = "single"
# A BROADCAST request is refused (400) rather than ignored. This provider
# reaches one origin, and answering a fan-out that reached one destination
# would report a delivery that did not happen.
broadcast   = "unsupported"
# The largest request body it collects.
max_payload = 8192

# `max_record` is one exchange record (`RECORD_MAX`): every record either
# side writes is a single channel record.
[[ports]]
name = "request_in"
direction = "input"
content_type = "ExchangeRequest"
buffer_size = 16384
max_record = 8192
required = true

[[ports]]
name = "response_out"
direction = "output"
content_type = "ExchangeResponse"
buffer_size = 16384
max_record = 8192
required = true

# Where targets resolve: a scheme and host such as `https://api.example`.
# Empty means the page's own origin, which is what a bundle served beside
# the service it talks to wants, and what its cross-origin policy permits
# without any further arrangement.
#
# A request may name its authority in a `host` header. With an `origin` set,
# a request naming that origin's host is performed and one naming another is
# refused (400): a pinned connector is pinned. With no `origin`, the named
# authority is where the request goes, over https — the connector is open,
# and the page's cross-origin policy is still the enforcement behind it.
[[params]]
name = "origin"
tag = 10
type = "str"
default = ""

# Module-scope observability — exempt (see standards/observability.md §6).
[observability]
exempt = "browser-API shim (wasm) — observed via browser devtools; the page's network panel is the byte stream"
