version = "1.0.0"
hardware_targets = ["linux"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: the pointer
# to its host instance. `fluxor abi-regen` emits it as `STATE_BYTES`, which
# the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1

# Host stdout/stderr sink + exit-code latch.
# exit_in takes [code: i32 LE]; absent wiring means exit 0 on completion.
[[ports]]
name = "bytes_in"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "err_in"
index = 1
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "exit_in"
index = 2
direction = "input"
content_type = "OctetStream"

[observability]
exempt = "host stdio surface — runs on the build host, observed via host tooling, not part of the on-silicon data path"
