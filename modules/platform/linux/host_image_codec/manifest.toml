version = "1.0.0"
hardware_targets = ["linux"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: the pointer
# to its host instance. `fluxor abi-regen` emits it as `STATE_BYTES`, which
# the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1

[[ports]]
name = "encoded"
direction = "input"
content_type = "OctetStream"
required = true

# One record a decoded picture: the region header of a whole-surface frame
# (`abi::contracts::video_raster`), then `width` x `height` RGB565 pixels.
[[ports]]
name = "pixels"
direction = "output"
content_type = "VideoRaster"
required = true
[ports.facts]
formats = ["rgb565"]
regions = ["bands"]

[[params]]
name = "width"
tag = 10
type = "u32"
default = 480
range = [1, 4096]

[[params]]
name = "height"
tag = 11
type = "u32"
default = 480
range = [1, 4096]

[[params]]
name = "scale_mode"
tag = 12
type = "enum"
values = ["fit", "stretch"]
default = "fit"

[[params]]
name = "max_bytes"
tag = 13
type = "u32"
default = 4194304
range = [1024, 67108864]

# Module-scope observability — exempt.
[observability]
exempt = "host-side dev/test provider — runs on the build host, observed via host tooling, not part of the on-silicon data path"
