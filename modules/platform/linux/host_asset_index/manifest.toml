version = "1.0.0"
hardware_targets = ["linux"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: the pointer
# to its host instance. `fluxor abi-regen` emits it as `STATE_BYTES`, which
# the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1

# Host-side built-in module that holds N file paths and streams them on
# demand. Mirrors the fat32 streaming pattern but without a filesystem
# layer — suitable for small static assets (JS, HTML, images) co-located
# with the host fluxor binary, so a foundation/http route can fetch them
# at runtime instead of inlining bytes into config.bin.
#
# Wiring (downstream is foundation/http or any HANDLER_FILE consumer):
#   - from: web_assets.stream
#     to: http.file_data
#
# `stream` serves `stream_select`: the consumer binds it through the input
# port it reads the stream on and calls `SELECT(idx)`, where idx matches the
# route's source_index. Each asset ends with the stream's HUP.
provider_contracts = ["stream_select"]

[[ports]]
name = "stream"
direction = "output"
content_type = "OctetStream"
required = true
serves = "stream_select"

[[params]]
name = "paths"
tag = 10
type = "str"
required = true

# Module-scope observability — exempt.
[observability]
exempt = "host-side dev/test provider — runs on the build host, observed via host tooling, not part of the on-silicon data path"
