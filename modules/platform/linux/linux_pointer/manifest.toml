version = "1.0.0"
hardware_targets = ["linux"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: the pointer
# to its host instance. `fluxor abi-regen` emits it as `STATE_BYTES`, which
# the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1

# Native Linux pointer/touch input authority: the evdev source of
# `PointerEvents`. Reads Linux `input_event` records from an evdev device
# (`/dev/input/eventN`) and writes pointer records
# (`abi::contracts::input::pointer`) on `events`, so an application that
# draws its own interface can hit-test a touchscreen or a mouse and scroll
# with its wheel.
#
# Absolute touch (`ABS_X`/`ABS_Y`, `ABS_MT_POSITION_X`/`_Y` with
# `BTN_TOUCH`) and relative mouse (`REL_X`/`REL_Y` with `BTN_LEFT`) both
# map to down, move and up records, scaled from the device's axis range to
# the surface. The wheel maps to `KIND_WHEEL` records in 1/120 detent:
# `REL_WHEEL_HI_RES` and `REL_HWHEEL_HI_RES` as they are, `REL_WHEEL` and
# `REL_HWHEEL` times 120 from a device that sends no high-resolution code.
# Positive `dy` scrolls toward the end, positive `dx` toward the right. At
# most one wheel record is sent a step, the step's movement summed.
#
# A record the channel refuses is held and offered again; while records
# wait the device is not read. `path` may also be a FIFO carrying the same
# `input_event` byte layout, for a run with no hardware.

[[ports]]
name = "events"
direction = "output"
content_type = "PointerEvents"
required = true

# Tag 10 — evdev device (or a FIFO of input_event records).
[[params]]
name = "path"
tag = 10
type = "str"
default = "/dev/input/event0"

# Tag 11/12 — the surface's extent, in surface pixels, that positions are
# scaled into.
[[params]]
name = "width"
tag = 11
type = "u32"
default = 960

[[params]]
name = "height"
tag = 12
type = "u32"
default = 540

# Tag 13/14 — device absolute-axis maxima for scaling. 0 = the axes are
# already surface pixels (the default: a mouse, or a FIFO written in
# surface pixels).
[[params]]
name = "x_max"
tag = 13
type = "u32"
default = 0

[[params]]
name = "y_max"
tag = 14
type = "u32"
default = 0

# Module-scope observability — exempt.
[observability]
exempt = "Linux-host hardware shim — evdev input via the host OS; observed via host tooling, not an on-silicon data path"
