version = "1.0.0"
hardware_targets = ["linux"]
builtin = true
# An instance's state in the kernel's arena, in 64-byte units: the pointer
# to its host instance. `fluxor abi-regen` emits it as `STATE_BYTES`, which
# the kernel's vtable and the build's state-arena charge both read.
state_bytes_64 = 1

# A consumer of the Surface Traits surface on Linux that logs what it
# reads. Each `input::surface_traits::MSG_TRAITS` record on its input is
# decoded with the contract's reader and logged by field (viewport, size
# classes, displays, `dpr_eighths`, modalities, epoch), so the round trip
# linux_surface_traits → channel → this probe can be watched on a host
# with no display. Plug or unplug a USB input device and the epoch moves.

[[ports]]
name = "events"
direction = "input"
content_type = "SurfaceTraits"
required = true

# Module-scope observability — exempt.
[observability]
exempt = "Linux-host probe — logs decoded surface-state to stdout, not an on-silicon data path"
