version = "1.0.0"
hardware_targets = ["linux"]
builtin = true

# Connection table size: listeners + clients, and the ceiling on the
# `u16` conn id net_proto carries. Idle slots hold no buffer.
[[params]]
name = "max_conns"
tag = 10
type = "u32"
default = 128
range = [2, 65535]

# Per-connection unsent-byte backlog cap, KiB. Grown as a send backs up
# and released with the slot. Commands stop being read (back-pressure on
# the shared upstream channel) only while some backlog is FULL — one more
# command frame would not fit — so a peer slow to read is buffered up to
# this cap without holding up every other connection. A server whose
# answers are large (a Kubernetes API: 1 MiB objects) sets it to hold a
# few of them.
[[params]]
name = "write_buf_kib"
tag = 11
type = "u32"
default = 128
range = [1, 65536]

# `listen()` backlog: the SYN queue that absorbs a connect burst.
[[params]]
name = "listen_backlog"
tag = 12
type = "u32"
default = 128
range = [1, 65535]

[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"

[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"

# Module-scope observability — exempt (see standards/observability.md §6).
[observability]
exempt = "Linux-host TCP/IP adapter — dev/test substitute for the silicon ip stack; host-side throughput is observed via the host OS (ss/netstat) and at the instrumented stream modules above it"
