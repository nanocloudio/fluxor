version = "1.0.0"
hardware_targets = ["linux"]
builtin = true
# Host display: file mode is a sink for raster; window mode adds scanout.
# Reports both since the actual mode is selected by `mode` param.
capabilities = ["video.raster", "video.scanout", "display.scanout", "presentation.clock"]

[[ports]]
name = "pixels"
direction = "input"
content_type = "VideoRaster"
required = true

[[params]]
name = "mode"
tag = 10
type = "enum"
values = ["file", "null", "window"]
default = "file"

[[params]]
name = "path"
tag = 11
type = "str"
default = "./target/host-display/frame_%04d.ppm"

[[params]]
name = "width"
tag = 12
type = "u32"
default = 480
range = [1, 4096]

[[params]]
name = "height"
tag = 13
type = "u32"
default = 480
range = [1, 4096]

[[params]]
name = "scale"
tag = 14
type = "u32"
default = 1
range = [1, 16]

# When 1, each frame on `pixels` is prefixed with a self-describing SRF1 header
# (magic + w + h + format) and the display takes its geometry from the STREAM rather
# than the width/height config — so the producer can resize without the two ends
# agreeing on a static config. See sector modules/common/sector_raster.rs.
[[params]]
name = "header"
tag = 15
type = "u32"
default = 0
range = [0, 1]

# Module-scope observability — exempt (see standards/observability.md §6).
[observability]
exempt = "Linux-host hardware shim — audio/display/MIDI via the host OS; observed via host tooling, not an on-silicon data path"
