# The ABI number registry: every contract id, opcode, permission bit, errno,
# poll bit, ioctl command and channel message type is declared here once.
# `fluxor abi-regen` generates `registry_gen.rs` from it; nothing else may
# restate a number. A contract's id is its opcode class byte, its vtable
# index, its `required_caps` bit and, when it mints handles, their fd tag.

[registry]
semantic_epoch = 1
max_contracts = 64
chain_next = 0x10000

[[permission]]
name = "reconfigure"
bit = 0
doc = "Graph slot commit, boot counter, FMP routing."

[[permission]]
name = "flash_raw"
bit = 1
doc = "Flash ERASE and PROGRAM, bounded to declared sectors."

[[permission]]
name = "platform_raw"
bit = 2
doc = "MMIO, NIC ring create, raw peripheral register bridges, workload spawn."

[[permission]]
name = "monitor"
bit = 3
doc = "Fault monitor BIND / WAIT / ACK / REPORT / RAISE, step histograms."

[[permission]]
name = "bridge"
bit = 4
doc = "Cross-domain / cross-core dispatch."

[[permission]]
name = "pcie_device"
bit = 5
doc = "Kernel-mediated PCIe device binding (bind/config/BAR/MSI/info on a validated device handle), distinct from raw MMIO/DMA (`platform_raw`)."

[[permission]]
name = "dma"
bit = 6
doc = "DMA-buffer allocation from the kernel's bounded DMA arena and cache maintenance on those buffers; narrower than raw register access (`platform_raw` still gates `MMIO_READ32`/`MMIO_WRITE32`)."

[[permission]]
name = "observe"
bit = 7
doc = "Read-only telemetry-ring drain (`TLM_SUBSCRIBE`/`DRAIN`/`STATS`); deliberately not `monitor`, which also grants `FAULT_RAISE`."

[[permission]]
name = "usb_host"
bit = 8
doc = "Kernel-mediated USB host binding on a validated controller handle; distinct from `platform_raw`, which would hand a USB driver the whole address space."

[[permission]]
name = "vault_store"
bit = 9
doc = "Keep the key vault's durable image: the holder sees every persisted record and decides what reaches the medium."

