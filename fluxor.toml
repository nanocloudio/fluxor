# Project-level fluxor configuration.

# Project identity. Read by `fluxor publish` to scope OCI-store
# artifacts under the owning project. `[project].version` is the
# human-readable tag label; `:latest` is the only tag with semantics.
[project]
name     = "fluxor"
version  = "0.0.1"
# Runtime binaries this project owns. The `fluxor publish` runtime
# sweep publishes only the binaries named here, plus the CLI itself; a
# binary synced in from upstream is never swept up by it. A bare name is
# built for the host; `<triple>/<name>` for another triple. The browser
# kernel is pinned like any runtime, so `fluxor sync` gives every
# consumer the kernel that matches the SDK its modules build against.
runtimes = ["fluxor-linux", "wasm32-unknown-unknown/fluxor.wasm"]

[required]
# Wire-ABI pin checked by `fluxor ci`'s version-skew phase: it equals
# `modules/sdk/wire/wire.rs::ABI_VERSION`, the module-header /
# channel-hint / contract-id layout. The running CLI's compiled-in ABI
# must equal this value.
fluxor = { abi = 1 }

[ci]
# Module artefact build targets — `fluxor modules build --all`
# iterates this list.
targets = ["bcm2712", "rp2350", "rp2040", "wasm"]
# Every ceiling-shaped constant in a register-named file is either a row
# or an exemption; the list is empty, so a new one fails the gate.
limit_register_coverage = "fail"

[ci.test]
# The project's runtime gate. `tools/ci/deps_budget.sh` holds each build
# configuration to a declared package ceiling, so that the external dependency
# count moves when someone decides it should rather than drifting; the
# script's header says why it is not a limit-register family.
# `tests/host/service_bundle_e2e.sh` has a scratch producer publish a
# fixture service bundle into an isolated store (fluxor publishes none),
# pins and syncs it in a scratch consumer, runs it with parameters and
# asserts the refusals.
# `tests/host/program_section.sh` builds a graph whose modules own programs
# and checks each instance reads its own, through the kernel and in place.
# `tools/ci/premmu_atomics.sh` builds the pi5 kernel and refuses any atomic
# read-modify-write on the boot core's path before its MMU is on: with the
# MMU off a store-exclusive never succeeds and the board boots dark, and
# QEMU, which lets it succeed, cannot catch that.
# `tests/host/qemu_net_ready_gate.sh` boots QEMU virt with a non-deferred
# module between `virtio_net` and `ip` and needs a DHCP lease: a NIC that
# never reports Ready holds everything after it unstepped.
# `tests/host/qemu_access_bounds.sh` boots the `access_probe` fixture: the raw
# register and cache-maintenance opcodes must refuse DRAM, holes and module
# memory and serve device registers and DMA buffers.
# The transport-continuity scripts run two Linux runtimes, each `ip` over
# `linux_eth` in an unprivileged network namespace, and need the client to
# see no reset and a byte-identical continuation:
# `transport_continuity_move.sh` moves a live TCP+TLS connection over
# TRANSPORT_CONTINUITY; `transport_continuity_crash.sh` kills the primary of
# a crash-continuous pair with a whole 16 KiB record under the horizons;
# `transport_continuity_halfclose.sh` and
# `transport_continuity_crash_halfclose.sh` move and take over a connection
# its client half-closed; `transport_continuity_own_close.sh` moves one with
# our close_notify and FIN in flight, `transport_continuity_v6.sh` one over
# IPv6, `transport_continuity_unconsumed.sh` one with a delivery the worker
# never consumed, `transport_continuity_resumed.sh` one whose consumer's
# acknowledgement stood inside a record while the next was handed up
# (resumed at that byte, byte-exact), `transport_continuity_pipelined.sh`
# one with more records pipelined than a standby holds (held in TCP, the
# pair kept), `transport_continuity_capsfull.sh` one whose consumer can
# never make room (the pair abandoned, the stream unstalled),
# `transport_continuity_smallrecords.sh` one with many tiny responses
# pipelined past the 32 outbound records the record holds (held at that
# ceiling, the pair kept, a crash there byte-exact), `transport_continuity_owed_key_update.sh` one owing the
# answer to the client's KeyUpdate, and `transport_continuity_client.sh` a
# session this host dialled. A connection's end is no loss of its pair:
# `transport_continuity_rst_in.sh` has the client reset a crash-continuous
# connection (both hosts report it ENDED, the standby refuses to arm it and
# answers nothing of it), `transport_continuity_rst_out.sh` has the service
# reset one (the RST held until the standby has the reset, then sent once,
# the flow never resumed), and `transport_continuity_timewait.sh` takes one
# over in TIME-WAIT (the client's retransmitted FIN re-ACKed by the standby).
# `transport_continuity_timers.sh` resumes the timers beyond the RTO — the
# retransmission timer, CLOSE-WAIT's bound (and one expired before the
# activation), the idle close, LAST-ACK's bound and TIME-WAIT — at the
# standby at what remained of each, planned and after a crash. `quic_continuity_move.sh` moves a QUIC
# connection (a routable server ID, its key moved vault to vault, activation
# on the authority's verdict). `packet_seam_v6.sh` runs `ip`'s decision seam
# on a veth against the Linux stack — IPv6 neighbour discovery and echo,
# datagrams tunnelled and sent back at the frame level through the NIC
# merge, forward-and-copy, an IPv6 RST, LOCAL over both families, `ip6`'s
# own address — and `packet_seam_sharded.sh` the same behind `seam_shard`
# with the forward port shared through `fwd_split`. `quic_v6.sh` runs an
# independent QUIC peer over IPv6 and IPv4 against `quic` on `ip`;
# `rescue_tunnel.sh` carries a flow from the ingress host to its anchor's
# host, refusing forged and replayed datagrams; `remote_channel_mux.sh`
# resumes a channel on the mux carrier over QUIC across three cuts.
# `tests/host/cli_out_drain.sh` drives the stdin-to-stdout graph with bursts
# larger than `cli_out`'s bridge, serially, under contention and through
# O_NONBLOCK pipes: every byte reaches stdout before the process exits.
# `tests/host/agent_remote.sh` runs the agent protocol between two runtimes over
# mutual TLS: apply, activation, replay across a restart, fence, descriptor,
# admission and identity refusals.
scripts = ["tools/ci/deps_budget.sh", "tests/host/service_bundle_e2e.sh", "tests/host/program_section.sh", "tools/ci/premmu_atomics.sh", "tests/host/qemu_net_ready_gate.sh", "tests/host/qemu_access_bounds.sh", "tests/host/transport_continuity_move.sh", "tests/host/transport_continuity_crash.sh", "tests/host/transport_continuity_horizon.sh", "tests/host/transport_continuity_halfclose.sh", "tests/host/transport_continuity_crash_halfclose.sh", "tests/host/packet_seam_v6.sh", "tests/host/packet_seam_sharded.sh", "tests/host/quic_v6.sh", "tests/host/transport_continuity_own_close.sh", "tests/host/transport_continuity_v6.sh", "tests/host/transport_continuity_unconsumed.sh", "tests/host/transport_continuity_resumed.sh", "tests/host/transport_continuity_pipelined.sh", "tests/host/transport_continuity_capsfull.sh", "tests/host/transport_continuity_smallrecords.sh", "tests/host/transport_continuity_owed_key_update.sh", "tests/host/transport_continuity_client.sh", "tests/host/transport_continuity_rst_in.sh", "tests/host/transport_continuity_rst_out.sh", "tests/host/transport_continuity_timewait.sh", "tests/host/transport_continuity_timers.sh", "tests/host/quic_continuity_move.sh", "tests/host/rescue_tunnel.sh", "tests/host/remote_channel_mux.sh", "tests/host/cli_out_drain.sh", "tests/host/agent_remote.sh"]

[ci.cargo]
# Where the cargo phase runs. fluxor's workspace root is the bare-metal
# kernel and cannot build on the host under default features, so the
# host-testable crate is `tools/`. Declared rather than left to the
# conventional fallback: `fluxor ci`, `fluxor test` and `fluxor lint`
# all resolve their cargo site through this key, and a site nothing
# names is a site nobody can check.
host_tools_crate = "tools"

[ci.templates]
# Directory whose YAML files render through `fluxor render-template`.
# The examples carry no `__KEY__` placeholders, so the render is a
# syntactic gate.
dir = "examples"

# Workspace-lints opt-in: every workspace member declares
# `[lints] workspace = true`, or is listed under `[[ci.lints.exemption]]`
# (`crate`, `reason`). None is exempt.

# Crate-root `#![allow(...)]` is banned. Each row below declares a prefix
# where it is permitted and the reason it is. A file outside these prefixes
# fails the gate.
[[ci.hygiene.allow_crate_root]]
prefix = "modules/"
reason = """PIC modules mount the whole of modules/sdk/* via include!, so every \
module's compile sees the entire ABI surface while using a subset, and the \
unreachable_patterns arms are deliberate defensive branches guarding against a \
new variant slipping past the error path. The first is the SDK's textual \
mounting showing through: it is a property of how a PIC module is built, not of \
any one module."""

[[ci.hygiene.allow_crate_root]]
prefix = "crates/fluxor-sdk/"
reason = """The cargo-shaped façade over modules/sdk/*: it mounts the whole tree \
so every #[path] consumer agrees on one surface, and consumers use a subset. \
Same cause as modules/, same fix."""

[[ci.hygiene.allow_crate_root]]
prefix = "src/"
reason = """The kernel relaxes unsafe_code and print_* at the crate root: it is a \
no_std kernel whose every platform layer is unsafe by construction, and \
per-call-site attributes on several thousand blocks would say less than one \
statement of what this crate is. A call-site rule assumes a crate where unsafe \
is the exception."""

[[ci.hygiene.allow_crate_root]]
prefix = "tools/"
reason = """The CLI is a user-facing binary, so it relaxes clippy::print_stdout \
and print_stderr at the crate root: a call-site #[expect] is preferred, but the \
CLI prints from hundreds of sites and the crate-level statement is the honest \
one."""

[[ci.hygiene.allow_crate_root]]
prefix = "crates/fluxor-abi/"
reason = """The ABI surface is raw register addresses, pointer-based syscall types \
and chip-specific BAR maps: unsafe_code is what the crate IS, not an exception \
within it. It also mounts modules/sdk/* and so carries the same dead_code cause \
as modules/."""

[[ci.hygiene.allow_crate_root]]
prefix = "crates/fluxor-launcher/"
reason = """A single-purpose binary whose whole job is one fexecve — exec of an \
open descriptor has no safe wrapper — and which prints its own diagnostics. Two \
crate-level facts about a crate of one function."""

[[ci.hygiene.allow_crate_root]]
prefix = "crates/fluxor-uefi-loader/"
reason = """A firmware application: everything it does is a call through a table of \
foreign function pointers the firmware hands it, then a jump with the MMU off. \
unsafe_code is what the crate is, not an exception within it."""

[[ci.hygiene.allow_crate_root]]
prefix = "tests/"
reason = """Test drivers: unwrap/expect are how a failed expectation becomes a test \
failure, and the harness mounts the module cores so it inherits modules/'s \
dead_code cause."""

[ci.hygiene]
# `permissive` allows bottom-of-file `#[cfg(test)] mod tests` blocks
# under `max_inline_lines` in `tools/` and `contracts/`. `modules/`
# is under a hard ban — every PIC module is `no_std` and inline
# tests would compile away silently.
mode                = "permissive"
forbid_inline_tests = ["modules"]
max_inline_lines    = 1000

