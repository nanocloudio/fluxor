# Project-level fluxor configuration.

# Project identity. Read by `fluxor publish` to scope OCI-store
# artifacts under the owning project. `[project].version` is the
# human-readable tag label; `:latest` is the only tag with semantics.
[project]
name     = "fluxor"
version  = "0.0.1"
# Host runtime binaries this project owns. The `fluxor publish`
# runtime sweep publishes only the binaries named here (plus, for
# fluxor itself, the CLI); this keeps a downstream consumer that has
# synced `fluxor-linux` into its own target tree from accidentally
# re-publishing it under the consumer's namespace.
runtimes = ["fluxor-linux"]

[required]
# Wire-ABI pin checked by `fluxor ci`'s version-skew phase. Bumps only
# when `modules/sdk/wire.rs::ABI_VERSION` changes — i.e., when the
# module-header / channel-hint / contract-id layout breaks. The
# installed CLI's compiled-in ABI must equal this value.
fluxor = { abi = 1 }

[ci]
# Module artefact build targets — `fluxor modules build --all`
# iterates this list.
targets = ["bcm2712", "rp2350", "rp2040", "wasm"]
# Every ceiling-shaped constant in a register-named file is either a row
# or an exemption; the list is empty, so a new one fails the gate.
limit_register_coverage = "fail"

[ci.cargo]
# Where the cargo phase runs. fluxor's workspace root is the bare-metal
# kernel and cannot build on the host under default features, so the
# host-testable crate is `tools/`. Declared rather than left to the
# conventional fallback: `fluxor ci`, `fluxor test` and `fluxor lint`
# all resolve their cargo site through this key, and a site nothing
# names is a site nobody can check.
host_tools_crate = "tools"

[ci.templates]
# Directory whose YAML files render through `fluxor render-template`.
# No `__KEY__` placeholders today; the empty render acts as a
# syntactic gate.
dir = "examples"

[ci.lints]
# Workspace-lints opt-in exemptions. New workspace members must
# declare `[lints] workspace = true` or list themselves here with a
# reason.

[ci.hygiene]
# `permissive` allows bottom-of-file `#[cfg(test)] mod tests` blocks
# under `max_inline_lines` in `tools/` and `contracts/`. `modules/`
# is under a hard ban — every PIC module is `no_std` and inline
# tests would compile away silently.
mode                = "permissive"
forbid_inline_tests = ["modules"]
max_inline_lines    = 1000

# `tls/mod.rs` gates its `#![no_std]` / `#![no_main]` on
# `not(any(feature = "host-test", test))`. The `test` cfg is
# load-bearing: `cargo test -p fluxor-mod-tls` without `host-test`
# still needs `main` + `std` to link the test harness. The crypto
# KATs under `tests/harness` already exercise the module from
# outside, so this is a structural cfg, not a smuggled inline test
# suite.
