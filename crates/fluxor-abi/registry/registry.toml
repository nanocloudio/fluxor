# Module entry points: the functions the kernel calls in a module, found by
# the FNV-1a hash of their names in the `.fmod` export table. A module exports
# these and nothing else; every static fact about it is in its manifest.

[[entry_point]]
name = "module_init"
doc = "Once per module type, before any instance: the syscall table."

[[entry_point]]
name = "module_new"
required = true
doc = "Initialise one instance's state from its ports and params."

[[entry_point]]
name = "module_step"
required = true
doc = "One step of an instance; answers a step return."

[[entry_point]]
name = "module_pipeline_refill"
doc = "Refill a pipelined instance's input between steps."

[[entry_point]]
name = "module_post_tick_flush"
doc = "Flush an instance's output after every module has stepped."

[[entry_point]]
name = "module_drain"
doc = "Drain an instance before a live reconfiguration removes it."

[[entry_point]]
name = "module_isr_entry"
doc = "The interrupt entry of an `irq` module."

[[entry_point]]
name = "module_provider_dispatch"
doc = "Serve one call on a contract the manifest says the module provides."

[[entry_point]]
name = "module_provider_selector"
doc = "The selector an instance-keyed provider registers under, from its config."
