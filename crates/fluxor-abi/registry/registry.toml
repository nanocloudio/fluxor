bit = 12
reach = "kernel"
doc = "Stage an OTA image (`OTA_STAGE_WRITE`, `OTA_STAGE_CTRL`)."

[[grant]]
name = "metal_device.mmio"
bit = 13
reach = "kernel"
doc = "Open a device-register aperture and read and write registers in it (`MMIO_OPEN`, `MMIO_READ32`, `MMIO_WRITE32`)."

[[grant]]
name = "metal_device.pcie"
bit = 14
reach = "kernel"
doc = "Rescan PCIe and read or write any device's config space."

[[grant]]
name = "metal_device.dma"
bit = 15
reach = "kernel"
doc = "Allocate DMA memory from the kernel's arena and maintain its cache."

[[grant]]
name = "seal_key"
bit = 16
reach = "kernel"
doc = "Keep the key vault's durable image: the holder sees every persisted record and decides what reaches the medium."

[[grant]]
name = "lend.borrow"
bit = 17
doc = "Resolve and return a span another module lent to one of this module's edges (`RESOLVE`, `RETURN`): the borrower reads or writes the span in place. It reaches only memory its lender opened to it; DMA into the span is `platform_dma`'s privilege, not this one."

