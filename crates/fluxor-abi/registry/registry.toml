[[contract]]
# Logical-block I/O, served by the module at the other end of a consumer's
# `blocks` port (`contracts::storage::block` has the records).
name = "storage.block"
id = 0x2A
module_provided = true
manifest = true
route = "edge"

  [[contract.op]]
  name = "DESCRIBE"
  op = 0x00
  gate = { handle = "minted", arg = "out", max = 40 }

  [[contract.op]]
  name = "SUBMIT"
  op = 0x01
  gate = { handle = "minted", arg = "in", max = 40 }

  [[contract.op]]
  name = "REAP"
  op = 0x02
  gate = { handle = "minted", arg = "out", max = 80 }

  [[contract.op]]
  name = "EXEC"
  op = 0x03
  gate = { handle = "minted", arg = "inout", max = 120, data = "inout", data_max = "any" }

  [[contract.op]]
  name = "READ_STREAM"
  op = 0x04
  gate = { handle = "minted", arg = "in", max = 40 }

[[contract]]
# Whether every frame a NIC driver was handed on the edge `ip` writes has
# left the wire, served by the driver at the other end of that edge
# (`contracts::net::identity::tx_drain`).
name = "net_tx_drain"
id = 0x2B
module_provided = true
manifest = true
route = "edge"

  [[contract.op]]
  name = "DRAINED"
  op = 0x00
  gate = { handle = "minted", arg = "out", max = 4 }

[[contract]]
# Decode an encoded image held in a store (a byte range of a storage.object
# object) to raw pixels at a named size (`contracts::image_decode`).
name = "image_decode"
id = 0x2C
module_provided = true
manifest = true

  [[contract.op]]
  name = "DECODE"
  op = 0x00
  admission = true
  gate = { handle = "scoped_mints", arg = "in", max = 274 }

  [[contract.op]]
  name = "RECV"
  op = 0x01
  gate = { handle = "minted", arg = "none", max = 0, data = "out", data_max = "any" }

  [[contract.op]]
  name = "CLOSE"
  op = 0x02
  gate = { handle = "minted", arg = "none", max = 0 }
  closes = true

