  [[contract.op]]
  name = "SIGNAL_CORE"
  grant = "kernel.signal_core"
  op = 0x52

  # `provider_open(contract, BIND, arg)`: a handle bound to one provider of
  # `contract`, through which every later op reaches it. `arg` names the
  # provider: `[NAME][len u8][name]` for an instance-keyed layer (or the
  # platform's own, `platform`), `[PORT][port_type u8][index u8]` for the
  # module at the other end of one of the caller's ports (an edge contract).
  gate = { handle = "global", arg = "in", max = 2 }
  [[contract.op]]
  name = "BIND"
  op = 0x53
  gate = { handle = "mints", arg = "in", max = 34 }

  # Kernel to provider: the doorbell a signalling handle's minter waits on,
  # delivered after the provider answered the signalling op with its index
  # (`handle` = that index). `arg` = `[doorbell u32][contract u16][0 u16]`.
  # A refusal closes the index and fails the mint. Never a module's call.
  [[contract.op]]
  name = "BIND_DOORBELL"
  op = 0x54

  # A module provider rings a doorbell the kernel handed it
  # (`BIND_DOORBELL`): the minter is woken and its handle polls ready once.
  # `arg` = `[doorbell u32]`. A doorbell whose handle closed is a no-op.
  [[contract.op]]
  name = "DOORBELL_RING"
  op = 0x55
  gate = { handle = "global", arg = "in", max = 4 }

[[contract]]
# The channel: a ring (FIFO) or a one-record mailbox between a producer and a
# consumer. `channel_read` / `channel_write` / `channel_peek` /
# `channel_discard` / `channel_poll` are the syscall table's own entries; the
# ops below are the rest of the object. A record a write publishes keeps its
# boundary (`RECORD_LEN`); the five lend ops act on a mailbox's record.
name = "channel"
grant = "none"
id = 0x01
manifest = true

  # `arg` = the ring's capacity in bytes, `u32` LE (a power of two within the
  # ring bounds), or empty for the default ring.
  [[contract.op]]
  name = "OPEN"
  op = 0x00
  admission = true
  gate = { handle = "mints", arg = "in", max = 4 }

  [[contract.op]]
  name = "CLOSE"
  op = 0x01
  gate = { handle = "channel", arg = "none", max = 0 }

  # Either end: drop what is buffered (a mailbox's READY record; `EBUSY` while
  # its record is lent), clear WROTE and the owed discard, and clear HUP unless
  # the producer is gone. ERR stays.
  [[contract.op]]
  name = "FLUSH"
  op = 0x02
  gate = { handle = "channel", arg = "none", max = 0 }

  # The producer: end of stream (`poll::HUP`), seen by a tap too.
  [[contract.op]]
  name = "SET_HUP"
  op = 0x03
  gate = { handle = "channel", arg = "none", max = 0 }

  # The producer: `arg` out `u32` LE, the largest write the ring takes now (0
  # for a full ring and for a mailbox).
  [[contract.op]]
  name = "WRITABLE"
  op = 0x04
  gate = { handle = "channel", arg = "out", max = 4 }

  # The consumer: the unread bytes of the record at the head of the channel,
  # as the call's result; `EAGAIN` when none is buffered.
  [[contract.op]]
  name = "RECORD_LEN"
  op = 0x05
  gate = { handle = "channel", arg = "none", max = 0 }

  [[contract.op]]
  name = "FACTS"
  op = 0x07
  gate = { handle = "channel", arg = "out", max = 4 }

  [[contract.op]]
  name = "PORT"
  op = 0x0C
  gate = { handle = "global", arg = "inout", max = 2 }

  # The producer lends the mailbox's record for writing (IDLE -> WRITING).
  [[contract.op]]
  name = "ACQUIRE_WRITE"
  op = 0x10
  gate = { handle = "channel", arg = "out", max = 16 }
  addr_answer = true

  # The lend's holder publishes `len` bytes (`u32` LE in `arg`; 0 cancels).
  [[contract.op]]
  name = "RELEASE_WRITE"
  op = 0x11
  gate = { handle = "channel", arg = "in", max = 4 }

  # The consumer lends the READY record for reading (READY -> READING).
  [[contract.op]]
  name = "ACQUIRE_READ"
  op = 0x12
  gate = { handle = "channel", arg = "out", max = 16 }
  addr_answer = true

  # The lend's holder consumes the record (READING -> IDLE).
  [[contract.op]]
  name = "RELEASE_READ"
  op = 0x13
  gate = { handle = "channel", arg = "none", max = 0 }

  # The consumer lends a READY record no in-place writer has processed for
  # rewriting (READY -> WRITING); `RELEASE_WRITE` hands it on.
  [[contract.op]]
  name = "ACQUIRE_INPLACE"
  op = 0x14
  gate = { handle = "channel", arg = "out", max = 16 }
  addr_answer = true

