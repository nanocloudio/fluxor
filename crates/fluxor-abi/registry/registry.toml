bit = 5
reach = "kernel"
doc = "Read and write the node's route table and segments (`SEGMENTS`, `ROUTES`, `HOLD`, `READ`)."

[[grant]]
name = "net_route.stack"
bit = 6
reach = "kernel"
doc = "Report to and take from the route table as the node's IP stack (`REPORT`, `TAKE`)."

[[grant]]
name = "workload.create"
bit = 7
reach = "kernel"
doc = "Create, run, signal and inspect workloads."

[[grant]]
name = "workload.net"
bit = 8
reach = "kernel"
doc = "Serve workloads' network lanes as the node's IP stack (`NET_*`)."

[[grant]]
name = "host_process.exec"
bit = 9
reach = "kernel"
doc = "Run processes and terminals on the host."

[[grant]]
name = "host_mount.mount"
bit = 10
