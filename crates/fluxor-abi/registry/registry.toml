[[contract]]
# A registered span of the lender's memory that outlives a call: opened on
# the handle of the session it is lent to, named in that session's requests
# by a cookie the lender chooses, and resolved only by the module serving the
# session. A torn-down lender whose spans are still borrowed is quarantined
# until every borrow is returned.
name = "lend"
grant = "none"
id = 0x29
route = "class"

  [[contract.op]]
  name = "OPEN"
  op = 0x00
  admission = true
  gate = { handle = "minted_mints", arg = "in", max = 8, data = "inout", data_max = "any" }

  [[contract.op]]
  name = "RESOLVE"
  grant = "lend.borrow"
  op = 0x01
  gate = { handle = "global", arg = "inout", max = 13 }
  addr_answer = true

  [[contract.op]]
  name = "RETURN"
  grant = "lend.borrow"
  op = 0x02
