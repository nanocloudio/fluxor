# The ABI number registry: every contract id, opcode, grant, errno, poll
# bit, ioctl command and channel message type is declared here once.
# `fluxor abi-regen` generates `registry.rs` from it; nothing else may
# restate a number. A contract's id is its opcode class byte, its vtable
# index, its grant bit and, when it mints handles, their fd tag.
#
# Grants. A module may call an op only when it holds the op's grant. An op's
# grant is its contract's own bit unless the op (or, as a default for its
# ops, the contract) names another: `grant = "none"` needs nothing, and
# `grant = "<name>"` needs that `[[grant]]`, a privileged family inside the
# contract. An op the registry does not list does not exist. `reach =
# "kernel"` marks a grant (or a contract's own bit) that a gated module may
# not hold.

[registry]
semantic_epoch = 1
max_contracts = 64
chain_next = 0x10000

[[grant]]
name = "kernel.serial"
bit = 0
reach = "kernel"
doc = "Write raw bytes to the board's serial port (`SERIAL_WRITE`)."

[[grant]]
name = "kernel.signal_core"
bit = 1
reach = "kernel"
doc = "Signal another core (`SIGNAL_CORE`)."

[[grant]]
name = "timer.discipline"
bit = 2
reach = "kernel"
doc = "Steer the kernel clock to an external time source (`DISCIPLINE`)."

[[grant]]
name = "resource.pool_sample"
bit = 3
reach = "kernel"
doc = "Sample a provider's pool for the resource ledger (`POOL_SAMPLE`)."

[[grant]]
name = "net_policy.replace"
bit = 4
reach = "kernel"
doc = "Replace or clear the node's network policy (`REPLACE`, `CLEAR`)."

[[grant]]
name = "net_route.table"
bit = 5
reach = "kernel"
doc = "Read and write the node's route table and segments (`SEGMENTS`, `ROUTES`, `HOLD`, `READ`)."

[[grant]]
name = "net_route.stack"
bit = 6
reach = "kernel"
doc = "Report to and take from the route table as the node's IP stack (`REPORT`, `TAKE`)."

[[grant]]
name = "workload.create"
bit = 7
reach = "kernel"
doc = "Create, run, signal and inspect workloads."

[[grant]]
name = "workload.net"
bit = 8
reach = "kernel"
doc = "Serve workloads' network lanes as the node's IP stack (`NET_*`)."

[[grant]]
name = "host_process.exec"
bit = 9
reach = "kernel"
doc = "Run processes and terminals on the host."

[[grant]]
name = "host_mount.mount"
bit = 10
reach = "kernel"
doc = "Mount, project and remove host trees."

[[grant]]
name = "reconfigure.owner"
bit = 11
reach = "kernel"
doc = "Add a subgraph, and pause, resume or free an owner."

[[grant]]
name = "reconfigure.ota"
bit = 12
reach = "kernel"
doc = "Stage an OTA image (`OTA_STAGE_WRITE`, `OTA_STAGE_CTRL`)."

[[grant]]
name = "metal_device.mmio"
bit = 13
reach = "kernel"
doc = "Read and write device registers by physical address (`MMIO_READ32`, `MMIO_WRITE32`)."

[[grant]]
name = "metal_device.pcie"
bit = 14
reach = "kernel"
doc = "Rescan PCIe and read or write any device's config space."

[[grant]]
name = "metal_device.dma"
bit = 15
reach = "kernel"
doc = "Allocate DMA memory from the kernel's arena and maintain its cache."

[[grant]]
name = "seal_key"
bit = 16
reach = "kernel"
doc = "Keep the key vault's durable image: the holder sees every persisted record and decides what reaches the medium."

