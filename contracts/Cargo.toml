[package]
name              = "fluxor-contracts"
version.workspace = true
edition           = "2021"
license           = "Apache-2.0"
description       = "Public Fluxor contracts: content types, isolation planner, boot map, owner-log ring"

[lib]
name = "fluxor_contracts"
path = "src/lib.rs"

[features]
default = ["alloc"]
# The types that own heap memory: the decoded owner-log records. Off for a
# consumer with no allocator (an RP kernel, which needs only the isolation
# planner and the vocabulary).
alloc = []
# Public contract crate — pure type definitions. The workspace
# `unsafe_code = "forbid"` is the right level here; nothing in this
# crate needs unsafe and we want a compile error if that ever changes.
[lints]
workspace = true
