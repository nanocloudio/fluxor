# WASM target — runs the kernel as a wasm32-unknown-unknown module
# instantiated by a host (browser, wasmtime, edge runtime).
#
# See `docs/architecture/wasm_platform.md` for the platform contract.
# The same `<config>.wasm` runs on any host that implements the
# host-import surface; per-host native modules live in their own host docs.

[target]
id = "wasm"
family = "wasm"
description = "WASM (wasm32, host-instantiated)"
runtime = "wasm"
module_abi = "wasm32"

[build]
rust_target = "wasm32-unknown-unknown"
cargo_features = ["host-wasm"]
uf2_family_id = "0x00000000"
module_target = "wasm32-unknown-unknown"

[gpio]
max_pin = 0

[peripherals]
spi_count = 0
i2c_count = 0
uart_count = 0
adc_channels = 0
pwm_slices = 0
pio_count = 0
pio_state_machines = 0
dma_channels = 0

# Kernel capacity for the WASM target (arenas, module slots, heap segments,
# the log ring) lives in `src/kernel/config.rs::profile_wasm`, selected
# by the `host-wasm` feature. It is kernel capacity, not ABI.

[memory]
ram_base = "0x00000000"
ram_size = "0x00000000"
flash_base = "0x00000000"
flash_size = "0x00000000"

[platform.net]
provider = "host"

# Service facts (D-BOARD-STACK): the host presents OS-backed audio/display
# sinks; stacks map these facts to driver modules.
[platform.audio]
sink = "host"

[platform.display]
sink = "host"

# Which core runs each execution domain: every domain on the one thread.
[smp]
cores = 1
domain_cores = [0, 0, 0, 0]

# What the counters a module reads through the `counters` contract count:
# the facts of the target capabilities `counter.cycles` and `counter.icache`.
# Cycles are the page's monotonic clock in microseconds; a page has no
# instruction-cache count.
[counters]
cycles = "system"

# The contracts this platform registers a provider for, named as a manifest's
# `requires_contract` names them. The composer refuses a graph whose module
# requires a contract that neither the kernel (`channel`, `timer`, `event`,
# `buffer`), this list, nor a module in the graph provides: the call would
# otherwise answer ENOSYS at run time. `workload`, where present, is what the
# platform answers a workload's modules; absent, the same as `platform`.
[providers]
platform = ["fs", "image_decode", "storage.namespace", "storage.object"]
