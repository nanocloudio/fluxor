# Linux host — fluxor as a userspace process on aarch64 Linux.
# Host-level target: not a silicon, not a board (targets/host/).
# No real hardware peripherals; modules communicate via kernel channels.
#
# The host CPU must carry the ARMv8 Cryptography Extension (FEAT_AES,
# FEAT_SHA256). Everything fluxor builds for this triple is compiled with
# `+aes,+sha2,+neon` — the aarch64 modules this host loads, its own kernel
# binary, and the `fluxor` CLI and launcher, which are published artefacts
# that ship alongside that runtime. The flags are declared once, in
# `.cargo/config.toml`, so that every invocation agrees: a host that cannot
# run the runtime cannot run the CLI either. The extensions are optional in
# ARMv8-A, and the Pi 4's BCM2711 is one part that omits them.

[target]
id = "linux"
family = "linux"
description = "Linux hosted (aarch64 userspace)"
# The hosted runtime on aarch64 loads `aarch64` modules: the same bytes
# bare-metal bcm2712 runs, placed by the runtime each module names.
runtime = "linux"
module_abi = "aarch64"

[build]
rust_target = "aarch64-unknown-linux-gnu"
cargo_features = ["host-linux"]
uf2_family_id = "0x00000000"
module_target = "aarch64-unknown-linux-gnu"

[gpio]
max_pin = 0

[peripherals]
spi_count = 0
i2c_count = 0
uart_count = 0
adc_channels = 0
pwm_slices = 0
pio_count = 0
pio_state_machines = 0
dma_channels = 0

# [kernel] capacity tunables for the Linux host live in
# `modules/sdk/config.rs::profile_host` (selected at compile time via
# `cfg(target_arch = "aarch64")`). build.rs takes the early-return path
# for `host-linux`; STATE_ARENA / BUFFER_ARENA / CONFIG_ARENA come from
# `src/platform/linux/chip.rs` re-exporting `abi::config::kernel`. Edit
# `modules/sdk/config.rs::profile_host::kernel` to change capacities.

[memory]
ram_base = "0x00000000"
ram_size = "0x00000000"
flash_base = "0x00000000"
flash_size = "0x00000000"

[platform.net]
provider = "host"

# Service facts (D-BOARD-STACK): the host presents OS-backed audio/display
# sinks; stacks map these facts to driver modules.
[platform.audio]
sink = "host"

[platform.display]
sink = "host"
