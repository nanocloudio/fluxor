# BCM2712 — Raspberry Pi 5 / Compute Module 5
# Quad Cortex-A76 @ 2.4 GHz, aarch64
#
# The core carries the ARMv8 Cryptography Extension (FEAT_AES, FEAT_SHA256);
# modules and the kernel are compiled with `+aes,+sha2,+neon` and the SDK's
# AES and SHA-256 select their instruction paths on those features.
#
# Silicon-level facts only. The concrete memory map is a board/emulator fact
# and lives in the board overlay (`targets/boards/qemu-virt.toml` carries the
# QEMU virt RAM map; a real board's RAM origin is selected by its `board-*`
# cargo feature at link time), not here.

[target]
id = "bcm2712"
family = "bcm"
description = "BCM2712 (Cortex-A76, aarch64)"

[build]
rust_target = "aarch64-unknown-none"
cargo_features = ["chip-bcm2712"]
uf2_family_id = "0x00000000"
module_target = "aarch64-unknown-none"

[gpio]
max_pin = 27

[peripherals]
spi_count = 6
i2c_count = 4
uart_count = 5
adc_channels = 0
pwm_slices = 4
pio_count = 0
pio_state_machines = 0
dma_channels = 16

[isolation]
has_mmu = true

# [kernel] capacity tunables for BCM2712 live in
# `modules/sdk/config.rs::profile_host` (selected at compile time via
# `cfg(target_arch = "aarch64")`). build.rs does not emit a
# `chip_generated.rs` for BCM; STATE_ARENA / BUFFER_ARENA / CONFIG_ARENA
# are re-exported through `src/platform/bcm2712/chip.rs`. Editing values
# in a [kernel] section here would have no effect — edit
# `modules/sdk/config.rs::profile_host::kernel` instead.

# NOTE: no [memory] here — the memory map is a board/emulator fact, declared in
# the board overlay (see the header). BCM2712 silicon does not fix RAM origin.
