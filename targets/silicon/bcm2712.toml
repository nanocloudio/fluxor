# BCM2712 — Raspberry Pi 5 / Compute Module 5
# Quad Cortex-A76 @ 2.4 GHz, aarch64
#
# The core carries the ARMv8 Cryptography Extension (FEAT_AES, FEAT_SHA256);
# modules and the kernel are compiled with `+aes,+sha2,+neon` and the SDK's
# AES and SHA-256 select their instruction paths on those features.
#
# Silicon-level facts only. The concrete memory map is a board/emulator fact
# and lives in the board overlay (`targets/boards/qemu-virt.toml` carries the
# QEMU virt RAM map; a real board's RAM origin is selected by its `board-*`
# cargo feature at link time), not here.

[target]
id = "bcm2712"
family = "bcm"
description = "BCM2712 (Cortex-A76, aarch64)"

[build]
rust_target = "aarch64-unknown-none"
cargo_features = ["chip-bcm2712"]
uf2_family_id = "0x00000000"
module_target = "aarch64-unknown-none"

[gpio]
max_pin = 27

[peripherals]
spi_count = 6
i2c_count = 4
uart_count = 5
adc_channels = 0
pwm_slices = 4
pio_count = 0
pio_state_machines = 0
dma_channels = 16

[kernel]
# The EL1 stack each core runs on: the primary's `__stack_start..__stack_end`
# (`linker/memory-bcm2712.x`) and each secondary's `CORE_STACK_SIZE`
# (`multicore.rs`), each above an unmapped guard page. A module that is not
# isolated steps on it.
kernel_stack_kb = 1024
# The kernel's own frames beneath a module's: the scheduler's and whatever a
# syscall from the module runs (a key-vault signature, a flash write). A
# non-isolated module is admitted against the stack less this.
kernel_stack_reserve_kb = 256
# The pool every loaded module's state and arena come from: the SDK's aarch64
# `kernel::STATE_ARENA_SIZE` (`modules/sdk/abi/config.rs`), 256 MiB. The kernel
# allocates that constant; this states it for the graph builder, which admits a
# graph against the sum of its modules' published state sizes.
state_arena_kb = 262144

[isolation]
# What the kernel implements here (`kernel-vm`, EL0 under a per-module page
# table). `contained` requests are given `isolated` — the floor rule.
levels = ["isolated"]
region_model = "pages"
stack_bound = "guard-page"
device_windows = true
# The peripheral blocks an isolated driver may be granted as its
# `device_window`, by name: an allowlist, default deny. A block is listed only
# when no kernel driver touches it (RP1's UART, GPIO and RIO, the GIC and the
# PCIe root complex are the kernel's) and it cannot master the bus. RP1
# peripherals are at 0x1c_0000_0000 + (RP1 address - 0x4000_0000).
device_ranges = [
    { name = "rp1_sysinfo", base = "0x1c00000000", size = "0x4000" },
]
# The stack an isolated module runs on at EL0, above an unmapped guard page
# (`ISOLATED_STACK_BYTES`). The composer refuses an isolated module that
# declares more.
isolated_stack_kb = 64
# Isolated modules at once: the kernel's static page-table slots (`MAX_ISO`).
isolated_slots = 2

# [kernel] capacity tunables for BCM2712 live in
# `modules/sdk/config.rs::profile_host` (selected at compile time via
# `cfg(target_arch = "aarch64")`). build.rs does not emit a
# `chip_generated.rs` for BCM; STATE_ARENA / BUFFER_ARENA / CONFIG_ARENA
# are re-exported through `src/platform/bcm2712/chip.rs`. Editing values
# in a [kernel] section here would have no effect — edit
# `modules/sdk/config.rs::profile_host::kernel` instead.

# NOTE: no [memory] here — the memory map is a board/emulator fact, declared in
# the board overlay (see the header). BCM2712 silicon does not fix RAM origin.
