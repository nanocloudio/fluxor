# Raspberry Pi Pico 2 W
# RP2350 (QFN-60 package A, 30 GPIO) with CYW43439 wireless (uses GP23-25, GP29)

[board]
id = "pico2w"
silicon = "rp2350"
description = "Raspberry Pi Pico 2 W"

# Default PIO: gSPI cmd (CYW43) on PIO1, I2S stream on PIO0
[[hardware.pio]]
pio_idx = 1
data_pin = 24
clk_pin = 29
extra_pin = 255

[[hardware.pio]]
pio_idx = 0
data_pin = 28
clk_pin = 26
extra_pin = 27

# Crystal frequency -- a BOARD fact, not silicon: the die takes whatever
# crystal the board fits. Every RP board in this tree fits 12 MHz, which is
# what the Pico family schematic specifies. clk_ref runs from XOSC undivided
# after clock init, so this is also clk_ref.
# Fallback console pins -- a BOARD fact: which header pins carry UART0 is
# wiring, not silicon. GP0/GP1 on the Pico family, which is where a USB-serial
# adapter goes. This is the log path that survives a USB stack that will not
# enumerate, so it exists to make that failure diagnosable.
[hardware.console_uart]
tx_pin = 0
rx_pin = 1
baud = 115200

[hardware.xosc]
hz = 12000000

[gpio]
# QFN-60 package: GPIO 0-29 only (silicon pin tables are QFN-80).
max_pin = 29
reserved_pins = [23, 24, 25, 29]

[gpio.reserved_reasons]
23 = "WL_GPIO_ON (wireless power)"
24 = "WL_GPIO_CS (wireless SPI CS)"
25 = "WL_GPIO_CLK (wireless SPI CLK)"
29 = "WL_CLK (wireless SPI clock) / VSYS sense (ADC3)"

[platform.net]
phy = "wifi"
nic = "cyw43"

# Public hardware-rig contract. Board-level facts only — which board is
# attached and how it is reached is a private rig profile.
#
# All three deploy routes are physically available, but only picotool
# needs nobody at the bench: it takes a running board into BOOTSEL over
# the reset interface, writes the image and reboots it. Mounting the UF2
# drive means holding the button, and SWD means a second board wired as a
# probe, so an unattended run prefers picotool.
[rig]
artifact = "uf2"
deploy = ["deploy.uf2_mount", "deploy.picotool", "deploy.swd"]
preferred_deploy = "deploy.picotool"
console = ["console.usb_cdc", "console.serial"]
preferred_console = "console.usb_cdc"
# `observe.proto_load` drives traffic at the board over its own wireless
# link, so it is available whenever the CYW43 has an address. It is a
# BOARD fact rather than a rig one because the radio is soldered to the
# board; which address the link gets, and from whom, belongs to the rig
# profile.
observe = ["observe.console_regex", "observe.usb_enumeration", "observe.proto_load"]
power = ["power.cycle"]
default_timeout_s = 20

# Audio hardware fact: I2S out via PIO-driven pins (D-BOARD-STACK).
[platform.audio]
sink = "i2s"
