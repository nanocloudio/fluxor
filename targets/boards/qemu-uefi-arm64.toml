# QEMU `virt` machine with UEFI firmware (AAVMF), aarch64.
#
# The emulated machine a UEFI kernel is brought up on before a cloud one: the
# same loader, the same disk, the same ACPI-described boot. It stands on the
# `uefi` host target; QEMU and its firmware are the rig's, not the image's.
#
# Build: tools/firmware.sh qemu-uefi-arm64

[board]
id = "qemu-uefi-arm64"
host = "uefi"
description = "QEMU aarch64 virt machine with UEFI firmware"

[rig]
artifact = "uefi_disk"
deploy = ["deploy.qemu_disk"]
console = ["console.qemu_serial"]
telemetry = ["telemetry.qemu_virtio"]
observe = ["observe.console_regex"]
power = ["power.cycle", "power.on", "power.off"]
default_timeout_s = 60
