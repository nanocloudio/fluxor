# QEMU virt machine (aarch64)
# Virtual board for development and testing via QEMU.

[board]
id = "qemu-virt"
silicon = "bcm2712"
description = "QEMU aarch64 virt machine"

# The QEMU virt machine's memory map (a board/emulator fact, not silicon).
[memory]
# QEMU virt: RAM at 0x4000_0000, 2 GB — the machine `fluxor run` launches
# (`-m 2G`), which holds the kernel's 1 GiB state arena, and what the
# kernel's identity map covers as memory.
ram_base = "0x40000000"
ram_size = "0x80000000"
# No XIP flash — kernel loaded to RAM by bootloader
flash_base = "0x00000000"
flash_size = "0x00000000"

# QEMU enters the kernel at EL1, under an EL2 it cannot ask about its traps,
# so the kernel programs no performance monitor here: the cycle count is the
# system clock, and there is no instruction-cache count.
[counters]
cycles = "system"

# No reserved pins — virtual platform
[gpio]
reserved_pins = []

[platform.net]
phy = "ethernet"
nic = "virtio"
