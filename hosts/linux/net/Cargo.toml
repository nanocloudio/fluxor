[package]
name              = "fluxor-provider-net"
version.workspace = true
edition           = "2021"
license           = "Apache-2.0"
repository        = "https://github.com/nanocloudio/fluxor"
description       = "Host provider of the node's network control plane (net_route, net_policy, address control) on Linux"

# The library holds the realization (the route and policy stores on the
# shared `net_tables` core, the instance registry, links, addresses, routes
# and the `nft` rule tables); the binary serves it through a host lane. The
# harness drives the binary through `fluxor-host-lane` and pins the pure
# renderings through the library.
[lib]
name = "fluxor_provider_net"
path = "src/lib.rs"

[[bin]]
name = "fluxor-provider-net"
path = "src/main.rs"

[dependencies]
# The contracts it serves (route, policy, identity wire), errno values and
# the ABI surface digest its HELLO states.
fluxor-abi = { path = "../../../crates/fluxor-abi" }
# The route and policy stores (`cores::net_tables`), and SHA-256 for the
# default instance tag.
fluxor-sdk = { path = "../../../crates/fluxor-sdk" }
fluxor-host-lane = { path = "../lane" }
libc = "0.2.186"
log = "0.4.29"

[lints]
workspace = true
