# A target's end of the agent protocol's remote transport: frames on the
# runtime's stdin and stdout, mutual TLS on the network, controllers accepted.
# `fluxor agent serve --runtime` runs it beside a target's agent; `agent_dial` is
# the controller's end (docs/architecture/agent_protocol.md).
#
#   stdin ─> cli_in ─> link.ch0 ═══ tls ═══ the other end ═══ link.ch0_rx ─> cli_out ─> stdout
#
# Every frame is `[peer:32][len:u32][record]`. The 32 bytes are the channel's
# `peer_tag` prefix: inbound, the key fingerprint `tls` verified for the session
# the record came from; outbound, the peer it goes to, all zero for every
# session. `[len:u32][record]` is the channel's `len32` record, which is what
# delimits it however stdin and stdout split it.
#
# Each record belongs to the session that carries it: no `resume`. A request or
# an answer lost with its session is the controller's to send again under the
# same idempotency identity, which the agent answers without a second commit.
#
# A graph includes it and names the target; the stack cannot name a target or a
# scheduler. The graph needs `accept_cycles`, the network provider and `tls`
# being a feedback pair:
#
#   target: linux
#   tick_us: 1000
#   scheduler: { accept_cycles: true }
#   include:
#     - stack: agent_listen
#       as: agent
#       params:
#         port: 9310
#         cert_file: /etc/fluxor/agent/target.pem
#         key_file: /etc/fluxor/agent/target.key
#         trust: /etc/fluxor/agent/controllers-ca.pem
#         peer_uri: spiffe://fabric/controller/
stack: agent_listen
version: 0.1.0
description: A target's agent-protocol frames on stdio, carried across mutual TLS by a remote channel.

params:
  port:
    type: integer
    default: 9310
    min: 1
    max: 65535
    description: The port bound.
  sessions:
    type: integer
    default: 4
    min: 1
    max: 8
    description: Controllers served at once, one session per verified peer.
  cert_file:
    type: string
    required: true
    example: /etc/fluxor/agent/target.pem
    description: "This end's certificate chain (PEM or DER): an absolute path `tls` reads where it runs, not at build."
  key_file:
    type: string
    required: true
    example: /etc/fluxor/agent/target.key
    description: "This end's private key (PEM or DER): an absolute path `tls` reads where it runs, not at build."
  trust:
    type: string
    required: true
    example: /etc/fluxor/agent/controllers-ca.pem
    description: "The authority the peer's certificate must chain to (PEM or DER): an absolute path `tls` reads where it runs, not at build."
  peer_uri:
    type: string
    required: true
    example: spiffe://fabric/controller/
    description: "The URI SAN a controller's certificate must carry; one ending in `/` accepts any name under it."
  clock_policy:
    type: string
    default: require
    description: "`require`: a certificate's lifetime is checked against a clock the platform vouches for, and a host whose clock is not synchronised refuses every handshake. `unchecked`: lifetimes are not checked, and removing a controller from the agent's set is what ends its authority."

modules:
  - name: net
    type: linux_net

  - name: tls
    type: tls
    mode: 1
    verify_peer: 1
    peer_auth: ca_uri
    verify_uri: ${param:peer_uri}
    trust: ${param:trust}
    cert_file: ${param:cert_file}
    key_file: ${param:key_file}
    clock_policy: ${param:clock_policy}
    alpn: fluxor-agent

  - name: link
    type: remote_channel
    transport: net
    role: listen
    port: ${param:port}
    sessions: ${param:sessions}
    channels: "OctetStream:len32:8196"
    require_peer: 1
    peer_tag: 1

  - name: stdio_in
    type: cli_in

  - name: stdio_out
    type: cli_out

wiring:
  - from: net.net_out
    to: tls.cipher_in
  - from: tls.cipher_out
    to: net.net_in
  - from: tls.clear_out
    to: link.transport_in
  - from: link.transport_out
    to: tls.clear_in
  - from: tls.peer_identity
    to: link.peer_identity
  - from: stdio_in.stdin_out
    to: link.ch0
  - from: link.ch0_rx
    to: stdio_out.bytes_in
